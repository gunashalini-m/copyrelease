 status code and body.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('GET');\nrm.setEndpoint('https://api.example.com/incidents');\nvar res = rm.execute();\ngs.info(res.getStatusCode());\ngs.info(res.getBody());","checks":[{"type":"includes","value":"sn_ws.RESTMessageV2","message":"RESTMessageV2"},{"type":"includes","value":"setHttpMethod('GET')","message":"GET"},{"type":"includes","value":"https://api.example.com/incidents","message":"Endpoint"},{"type":"includes","value":"execute()","message":"execute"},{"type":"includes","value":"getStatusCode()","message":"Status"},{"type":"includes","value":"getBody()","message":"Body"}]},{"id":"int-02","title":"Outbound REST JSON POST","difficulty":"intermediate","kind":"integration","prompt":"POST https://api.example.com/tickets with Content-Type application/json and body JSON.stringify({ short_description: \"VPN down\", urgency: \"1\" }). Log status.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('POST');\nrm.setEndpoint('https://api.example.com/tickets');\nrm.setRequestHeader('Content-Type', 'application/json');\nrm.setRequestBody(JSON.stringify({ short_description: 'VPN down', urgency: '1' }));\nvar res = rm.execute();\ngs.info(res.getStatusCode());","checks":[{"type":"includes","value":"setHttpMethod('POST')","message":"POST"},{"type":"includes","value":"setRequestHeader","message":"Header"},{"type":"includes","value":"application/json","message":"JSON content type"},{"type":"includes","value":"setRequestBody","message":"Body"},{"type":"includes","value":"JSON.stringify","message":"JSON.stringify"},{"type":"includes","value":"VPN down","message":"Payload"}]},{"id":"int-03","title":"Named REST message with parameters","difficulty":"intermediate","kind":"integration","prompt":"new sn_ws.RESTMessageV2(\"PagerDuty\", \"postEvent\"); setStringParameter(\"routing_key\", \"RKEY\"); setStringParameter(\"summary\", current.getValue(\"short_description\")); execute and if haveError log getErrorMessage.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2('PagerDuty', 'postEvent');\nrm.setStringParameter('routing_key', 'RKEY');\nrm.setStringParameter('summary', current.getValue('short_description'));\nvar res = rm.execute();\nif (res.haveError()) {\n  gs.error(res.getErrorMessage());\n}","checks":[{"type":"includes","value":"RESTMessageV2('PagerDuty', 'postEvent')","message":"Named message"},{"type":"includes","value":"setStringParameter('routing_key'","message":"routing_key"},{"type":"includes","value":"setStringParameter('summary'","message":"summary"},{"type":"includes","value":"haveError()","message":"Error check"},{"type":"includes","value":"getErrorMessage()","message":"Error text"}]},{"id":"int-04","title":"Async REST via MID Server","difficulty":"intermediate","kind":"integration","prompt":"RESTMessageV2 GET to http://internal.example.local/health, setMIDServer \"MID_PROD\", executeAsync, then waitForResponse(30) on the response.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('GET');\nrm.setEndpoint('http://internal.example.local/health');\nrm.setMIDServer('MID_PROD');\nvar res = rm.executeAsync();\nres.waitForResponse(30);\ngs.info(res.getStatusCode());","checks":[{"type":"includes","value":"setMIDServer('MID_PROD')","message":"MID Server"},{"type":"includes","value":"executeAsync()","message":"Async"},{"type":"includes","value":"waitForResponse(30)","message":"Wait 30s"},{"type":"includes","value":"internal.example.local","message":"Internal endpoint"}]},{"id":"int-05","title":"Scripted REST: get incident by number","difficulty":"intermediate","kind":"integration","prompt":"Scripted REST process function: read pathParams.number, GlideRecord incident get by number, if found setStatus 200 and setBody { number, short_description, state }; else setStatus 404 and setBody { error: \"not_found\" }.","starter":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n\n})(request, response);\n","solution":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n  var number = request.pathParams.number;\n  var gr = new GlideRecord('incident');\n  if (gr.get('number', number)) {\n    response.setStatus(200);\n    response.setBody({\n      number: gr.getValue('number'),\n      short_description: gr.getValue('short_description'),\n      state: gr.getValue('state')\n    });\n  } else {\n    response.setStatus(404);\n    response.setBody({ error: 'not_found' });\n  }\n})(request, response);","checks":[{"type":"includes","value":"request.pathParams","message":"Path params"},{"type":"includes","value":"new GlideRecord('incident')","message":"Load incident"},{"type":"includes","value":"response.setStatus(200)","message":"200"},{"type":"includes","value":"response.setStatus(404)","message":"404"},{"type":"includes","value":"not_found","message":"not_found"},{"type":"includes","value":"setBody","message":"Body"}]},{"id":"int-06","title":"Scripted REST: create incident","difficulty":"intermediate","kind":"integration","prompt":"Parse request.body.data (already an object) short_description and caller_id. Insert incident. setStatus 201, setBody { sys_id, number }.","starter":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n\n})(request, response);\n","solution":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n  var data = request.body.data;\n  var gr = new GlideRecord('incident');\n  gr.initialize();\n  gr.setValue('short_description', data.short_description);\n  gr.setValue('caller_id', data.caller_id);\n  var id = gr.insert();\n  response.setStatus(201);\n  response.setBody({ sys_id: id, number: gr.getValue('number') });\n})(request, response);","checks":[{"type":"includes","value":"request.body.data","message":"Read JSON body"},{"type":"includes","value":"initialize()","message":"New record"},{"type":"includes","value":"short_description","message":"short_description"},{"type":"includes","value":"insert()","message":"Insert"},{"type":"includes","value":"setStatus(201)","message":"201 Created"}]},{"id":"int-07","title":"Basic authentication on REST","difficulty":"easy","kind":"integration","prompt":"RESTMessageV2 POST to https://api.example.com/login, setBasicAuth user \"svc.itsm\" password gs.getProperty(\"integration.password\"), setRequestHeader Accept application/json.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('POST');\nrm.setEndpoint('https://api.example.com/login');\nrm.setBasicAuth('svc.itsm', gs.getProperty('integration.password'));\nrm.setRequestHeader('Accept', 'application/json');\nvar res = rm.execute();\ngs.info(res.getStatusCode());","checks":[{"type":"includes","value":"setBasicAuth","message":"Basic auth"},{"type":"includes","value":"svc.itsm","message":"Service user"},{"type":"includes","value":"gs.getProperty('integration.password')","message":"Password from property"},{"type":"includes","value":"application/json","message":"Accept JSON"}]},{"id":"int-08","title":"Parse inbound JSON and update incident","difficulty":"intermediate","kind":"integration","prompt":"var payload is a JSON string { \"number\": \"INC0001111\", \"state\": \"6\" }. JSON.parse it, load incident by number, set state, update.","starter":"var payload = '{\"number\":\"INC0001111\",\"state\":\"6\"}';\n","solution":"var payload = '{\"number\":\"INC0001111\",\"state\":\"6\"}';\nvar data = JSON.parse(payload);\nvar gr = new GlideRecord('incident');\nif (gr.get('number', data.number)) {\n  gr.setValue('state', data.state);\n  gr.update();\n}","checks":[{"type":"includes","value":"JSON.parse","message":"Parse JSON"},{"type":"includes","value":"new GlideRecord('incident')","message":"Incident"},{"type":"includes","value":"data.number","message":"Use parsed number"},{"type":"includes","value":"data.state","message":"Use parsed state"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"int-09","title":"SOAP message execute","difficulty":"easy","kind":"integration","prompt":"new sn_ws.SOAPMessageV2(\"CMDBSync\", \"exportCI\"); setStringParameter(\"ci_name\", \"lxapp01\"); execute; log getBody.","starter":"// Write your ServiceNow script below\n","solution":"var soap = new sn_ws.SOAPMessageV2('CMDBSync', 'exportCI');\nsoap.setStringParameter('ci_name', 'lxapp01');\nvar res = soap.execute();\ngs.info(res.getBody());","checks":[{"type":"includes","value":"SOAPMessageV2","message":"SOAPMessageV2"},{"type":"includes","value":"CMDBSync","message":"Message name"},{"type":"includes","value":"setStringParameter('ci_name'","message":"Parameter"},{"type":"includes","value":"execute()","message":"execute"}]},{"id":"int-10","title":"Import set row insert","difficulty":"intermediate","kind":"integration","prompt":"Insert into import table u_incident_import: u_number INC9990001, u_short_description \"Interface error\". Then you would transform; here just insert and log sys_id.","starter":"// Write your ServiceNow script below\n","solution":"var row = new GlideRecord('u_incident_import');\nrow.initialize();\nrow.setValue('u_number', 'INC9990001');\nrow.setValue('u_short_description', 'Interface error');\nvar id = row.insert();\ngs.info(id);","checks":[{"type":"includes","value":"new GlideRecord('u_incident_import')","message":"Import table"},{"type":"includes","value":"INC9990001","message":"External number"},{"type":"includes","value":"Interface error","message":"Description"},{"type":"includes","value":"insert()","message":"Insert row"}]},{"id":"int-11","title":"Transform script: ignore empty","difficulty":"easy","kind":"integration","prompt":"In an onBefore transform script: if source.u_short_description is empty, set ignore = true.","starter":"// Write your ServiceNow script below\n","solution":"if (gs.nil(source.u_short_description)) {\n  ignore = true;\n}","checks":[{"type":"includes","value":"source.u_short_description","message":"Source field"},{"type":"includes","value":"ignore = true","message":"Ignore row"},{"type":"oneOf","values":["gs.nil","!source.u_short_description"],"message":"Empty check"}]},{"id":"int-12","title":"ECC queue probe log","difficulty":"intermediate","kind":"integration","prompt":"Query ecc_queue where agent is MID_PROD and topic is RESTProbe, orderByDesc sys_created_on, setLimit 10, log payload or name field—use getValue(\"queue\") and getValue(\"state\").","starter":"// Write your ServiceNow script below\n","solution":"var ecc = new GlideRecord('ecc_queue');\necc.addQuery('agent', 'MID_PROD');\necc.addQuery('topic', 'RESTProbe');\necc.orderByDesc('sys_created_on');\necc.setLimit(10);\necc.query();\nwhile (ecc.next()) {\n  gs.info(ecc.getValue('state'));\n}","checks":[{"type":"includes","value":"new GlideRecord('ecc_queue')","message":"ecc_queue"},{"type":"includes","value":"MID_PROD","message":"Agent"},{"type":"includes","value":"RESTProbe","message":"Topic"},{"type":"includes","value":"setLimit(10)","message":"Limit 10"}]},{"id":"int-13","title":"Query parameter and header","difficulty":"easy","kind":"integration","prompt":"REST GET https://api.example.com/search, setQueryParameter q \"email outage\", setRequestHeader Authorization \"Bearer \" + gs.getProperty(\"integration.token\").","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('GET');\nrm.setEndpoint('https://api.example.com/search');\nrm.setQueryParameter('q', 'email outage');\nrm.setRequestHeader('Authorization', 'Bearer ' + gs.getProperty('integration.token'));\nvar res = rm.execute();\ngs.info(res.getBody());","checks":[{"type":"includes","value":"setQueryParameter","message":"Query param"},{"type":"includes","value":"email outage","message":"Search text"},{"type":"includes","value":"Authorization","message":"Auth header"},{"type":"includes","value":"integration.token","message":"Token property"}]},{"id":"int-14","title":"Scripted REST query filter","difficulty":"intermediate","kind":"integration","prompt":"Read request.queryParams.priority (may be array—use + or String). Query incident addQuery priority that value, active true, setLimit 20. setBody an array of { number, priority }.","starter":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n\n})(request, response);\n","solution":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n  var priority = request.queryParams.priority;\n  if (priority && priority.join) {\n    priority = priority[0];\n  }\n  var result = [];\n  var gr = new GlideRecord('incident');\n  gr.addQuery('priority', priority);\n  gr.addQuery('active', true);\n  gr.setLimit(20);\n  gr.query();\n  while (gr.next()) {\n    result.push({ number: gr.getValue('number'), priority: gr.getValue('priority') });\n  }\n  response.setStatus(200);\n  response.setBody(result);\n})(request, response);","checks":[{"type":"includes","value":"request.queryParams","message":"Query params"},{"type":"includes","value":"priority","message":"Priority filter"},{"type":"includes","value":"setLimit(20)","message":"Limit 20"},{"type":"includes","value":"result.push","message":"Build array"},{"type":"includes","value":"setBody","message":"Response body"}]},{"id":"int-15","title":"Handle non-2xx REST status","difficulty":"intermediate","kind":"integration","prompt":"Execute a GET. If status \u003c 200 or >= 300, gs.error the body and do not parse JSON. Else JSON.parse the body and gs.info parsed.id.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('GET');\nrm.setEndpoint('https://api.example.com/item');\nvar res = rm.execute();\nvar status = res.getStatusCode();\nvar body = res.getBody();\nif (status \u003c 200 || status >= 300) {\n  gs.error(body);\n} else {\n  var parsed = JSON.parse(body);\n  gs.info(parsed.id);\n}","checks":[{"type":"includes","value":"getStatusCode()","message":"Status"},{"type":"includes","value":"gs.error","message":"Log errors"},{"type":"includes","value":"JSON.parse","message":"Parse success JSON"},{"type":"includes","value":"parsed.id","message":"Read id"}]},{"id":"int-16","title":"setStringParameterNoEscape for JSON fragments","difficulty":"easy","kind":"integration","prompt":"Named REST message Webhook / send: setStringParameterNoEscape(\"payload\", JSON.stringify({ number: current.getValue(\"number\") })); execute.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2('Webhook', 'send');\nrm.setStringParameterNoEscape('payload', JSON.stringify({ number: current.getValue('number') }));\nvar res = rm.execute();\ngs.info(res.getStatusCode());","checks":[{"type":"includes","value":"setStringParameterNoEscape","message":"NoEscape"},{"type":"includes","value":"JSON.stringify","message":"JSON fragment"},{"type":"includes","value":"RESTMessageV2('Webhook', 'send')","message":"Named webhook"}]},{"id":"int-17","title":"Inbound header API key check","difficulty":"intermediate","kind":"integration","prompt":"In Scripted REST, if request.getHeader(\"X-API-Key\") does not equal gs.getProperty(\"inbound.api.key\"), setStatus 401 and setBody { error: \"unauthorized\" }, return. Else setStatus 204.","starter":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n\n})(request, response);\n","solution":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n  var key = request.getHeader('X-API-Key');\n  if (key != gs.getProperty('inbound.api.key')) {\n    response.setStatus(401);\n    response.setBody({ error: 'unauthorized' });\n    return;\n  }\n  response.setStatus(204);\n})(request, response);","checks":[{"type":"includes","value":"getHeader('X-API-Key')","message":"API key header"},{"type":"includes","value":"gs.getProperty('inbound.api.key')","message":"Stored key"},{"type":"includes","value":"setStatus(401)","message":"401"},{"type":"includes","value":"unauthorized","message":"unauthorized"},{"type":"includes","value":"setStatus(204)","message":"204"}]}],"theory":[{"id":"int-t01","title":"Table API vs Scripted REST vs Import Set API","difficulty":"hard","format":"theory","kind":"theory","prompt":"A vendor will POST 50k CMDB-ish rows/hour with coalesce. Which inbound pattern matches community/docs guidance?","options":[{"id":"a","text":"Scripted REST that GlideRecord.insert() each target CI in the user session"},{"id":"b","text":"Thin Scripted REST (or Import Set API) into a staging table extending import set row, coalesce in a Transform Map / IRE — don’t do IRE/target logic inline on the REST thread for that volume"},{"id":"c","text":"Only SOAPMessageV2 inbound exists"},{"id":"d","text":"updateMultiple on cmdb_ci from the request body without staging"}],"answer":"b","explanation":"Community: Scripted REST + staging + transform. Direct target inserts skip coalesce/IRE, timeout, and duplicate. Import Set API is the productized version of the same idea. Batch rows into one import set when possible; one import set per REST call at 50k/hour is also painful.","multi":false},{"id":"int-t02","title":"execute vs executeAsync + MID","difficulty":"hard","format":"theory","kind":"theory","prompt":"Outbound REST to an internal URL without setMIDServer, using execute(). Works in PDI, fails in prod. Why?","options":[{"id":"a","text":"execute() cannot do HTTPS"},{"id":"b","text":"The instance cannot route to RFC1918; you need a MID (setMIDServer) and usually executeAsync + ECC; execute() from the node never leaves ServiceNow’s network the way the customer thinks"},{"id":"c","text":"You must use SOAP for internal URLs"},{"id":"d","text":"g_form is required for REST"}],"answer":"b","explanation":"Classic interview. PDI with a public mock API lies. Prod: MID, credentials, IP ACLs on the customer firewall, and async.","multi":false},{"id":"int-t03","title":"waitForResponse","difficulty":"hard","format":"theory","kind":"theory","prompt":"executeAsync() then waitForResponse(30) in a Before BR on incident. What did you just do?","options":[{"id":"a","text":"Best practice for all REST"},{"id":"b","text":"Turned async into a 30s blocking user transaction anyway — you can still hit form timeout; don’t wait in Before/UI thread"},{"id":"c","text":"waitForResponse is client-only"},{"id":"d","text":"It disables the MID"}],"answer":"b","explanation":"Async is for not blocking. If you immediately wait in the same BR, you paid for none of the benefit. Fire-and-forget + callback event, or Flow.","multi":false},{"id":"int-t04","title":"PUT vs PATCH","difficulty":"hard","format":"theory","kind":"theory","prompt":"Vendor document says “update the incident.” You send PUT with only {state:6} and wipe short_description. Why?","options":[{"id":"a","text":"PUT is illegal in RESTMessageV2"},{"id":"b","text":"PUT is often replace-the-resource; PATCH is partial. Table API/scripted APIs differ — know the contract or you null fields"},{"id":"c","text":"PATCH cannot change state"},{"id":"d","text":"JSON.parse causes this"}],"answer":"b","explanation":"Interview question from community API threads. Never assume PUT=PATCH.","multi":false},{"id":"int-t05","title":"OAuth provider","difficulty":"hard","format":"theory","kind":"theory","prompt":"Inbound: a third party calls your Scripted REST with OAuth. Who is the provider?","options":[{"id":"a","text":"Always the third party"},{"id":"b","text":"ServiceNow is the authorization server/resource server for inbound; outbound, ServiceNow is the client talking to their provider (token URL, refresh token)"},{"id":"c","text":"MID Server is always the provider"},{"id":"d","text":"OAuth cannot be used inbound"}],"answer":"b","explanation":"Community interview set: inbound vs outbound OAuth roles, access vs refresh tokens, expiry.","multi":false},{"id":"int-t06","title":"setStringParameter vs NoEscape","difficulty":"hard","format":"theory","kind":"theory","prompt":"You put JSON in a REST body template as ${payload} via setStringParameter and the remote side rejects it. Why?","options":[{"id":"a","text":"JSON is not allowed in REST"},{"id":"b","text":"setStringParameter XML-escapes; use setStringParameterNoEscape for JSON/XML fragments already encoded"},{"id":"c","text":"You must Base64 the entire HTTP"},{"id":"d","text":"Only SOAP needs NoEscape"}],"answer":"b","explanation":"Docs: NoEscape for payloads that must not become &quot;{...}&quot;.","multi":false},{"id":"int-t07","title":"haveError vs HTTP 404","difficulty":"hard","format":"theory","kind":"theory","prompt":"getStatusCode() is 404, haveError() is false. Is the call “successful”?","options":[{"id":"a","text":"Yes; only transport errors set haveError"},{"id":"b","text":"haveError is for client/transport/MID failures; HTTP 4xx/5xx can still be a completed HTTP exchange — you must check status and body yourself"},{"id":"c","text":"404 always sets haveError true OOTB"},{"id":"d","text":"getStatusCode is only for SOAP"}],"answer":"b","explanation":"Interview trap. Treat haveError and status independently. Parse JSON only on the statuses you expect.","multi":false},{"id":"int-t08","title":"GlideRecord in Scripted REST as admin","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why is this a finding in a security review even with “we check a custom header”?","options":[{"id":"a","text":"Admin is required for REST"},{"id":"b","text":"Header checks are not authentication; Table ACL bypass + broken object-level checks leak data. Use the session user, OAuth scopes, GlideRecordSecure, and real authn"},{"id":"c","text":"Scripted REST cannot use GlideRecord"},{"id":"d","text":"Custom headers are stronger than OAuth"}],"answer":"b","explanation":"X-API-Key in a script compared to a property is better than nothing, still not user-context ACLs. Don’t run as maint.","multi":false},{"id":"int-t09","title":"Coalesce empty key","difficulty":"hard","format":"theory","kind":"theory","prompt":"Excel User ID empty should not insert. Transform map coalesce on user_id. What happens without an onBefore?","options":[{"id":"a","text":"The row is always skipped OOTB"},{"id":"b","text":"Empty coalesce keys are dangerous (merge into one dummy/update wrong row). onBefore: if gs.nil(source.u_user_id) ignore=true"},{"id":"c","text":"Coalesce cannot be used on user_id"},{"id":"d","text":"You must use IRE for users always"}],"answer":"b","explanation":"Quoted community interview question. ignore=true is the transform script answer.","multi":false},{"id":"int-t10","title":"Protection policy","difficulty":"hard","format":"theory","kind":"theory","prompt":"After install from App Store, a Scripted REST script is read-only. What is that?","options":[{"id":"a","text":"An ACL on sys_scripted_rest_resource"},{"id":"b","text":"Protection Policy (read-only/protected) on the artifact so customers don’t edit vendor logic — copy/extend rather than customize in place"},{"id":"c","text":"The instance is in read-only mode"},{"id":"d","text":"MID Server locked the file"}],"answer":"b","explanation":"Community interview: protection policy on BR, SI, Scripted REST, Flow, etc.","multi":false},{"id":"int-t11","title":"ECC RESTProbe","difficulty":"hard","format":"theory","kind":"theory","prompt":"executeAsync via MID. Where do you debug a hung call?","options":[{"id":"a","text":"Only the browser network tab"},{"id":"b","text":"ecc_queue (output/input), MID agent logs, REST message HTTP status on the response after wait — not gs.log in a BR that already returned"},{"id":"c","text":"kb_use"},{"id":"d","text":"change_conflict"}],"answer":"b","explanation":"topic RESTProbe / REST. States processed/error. Interview: know ECC.","multi":false},{"id":"int-t12","title":"Mutual TLS vs basic","difficulty":"hard","format":"theory","kind":"theory","prompt":"Bank requires cert-based client auth from the instance. API?","options":[{"id":"a","text":"setBasicAuth is enough if the password is the cert PEM"},{"id":"b","text":"setMutualAuth / protocol profile on the REST message — not basic auth"},{"id":"c","text":"Only SOAP supports mTLS"},{"id":"d","text":"Put the cert in short_description"}],"answer":"b","explanation":"RESTMessageV2 setMutualAuth. Credentials stored in platform stores, not scripts.","multi":false},{"id":"int-t13","title":"JSON.parse without status check","difficulty":"hard","format":"theory","kind":"theory","prompt":"Body is an HTML 502 from a proxy. JSON.parse throws and the BR aborts the incident save. Fix?","options":[{"id":"a","text":"JSON.parse never throws"},{"id":"b","text":"Check haveError, status, Content-Type, then parse inside try/catch; never parse in Before if a throw should not abort the user"},{"id":"c","text":"Use eval() instead"},{"id":"d","text":"getBody() already returns an object"}],"answer":"b","explanation":"Defensive integration. Move I/O async so a 502 doesn’t block ITSM.","multi":false},{"id":"int-t14","title":"Outbound auth storage","difficulty":"hard","format":"theory","kind":"theory","prompt":"gs.getProperty(\"integration.password\") in a Script Include. Security review?","options":[{"id":"a","text":"Properties are the most secure secret store"},{"id":"b","text":"Prefer Connection & Credential aliases / credential records; sys_properties are widely readable depending on ACLs and leak in update sets"},{"id":"c","text":"Hard-code the password in the Script Include instead"},{"id":"d","text":"Passwords cannot be used in RESTMessageV2"}],"answer":"b","explanation":"Interview: Credential alias on REST message. Properties for non-secrets.","multi":false},{"id":"int-t15","title":"Flow IntegrationHub vs RESTMessageV2","difficulty":"hard","format":"theory","kind":"theory","prompt":"When do interviewers still want RESTMessageV2 instead of a spoke?","options":[{"id":"a","text":"Never; scripting outbound REST is forbidden"},{"id":"b","text":"When no spoke exists, you need tight BR-level control, or you are in a pattern already built — but prefer IntegrationHub/Flow for maintainability and retry; don’t copy-paste REST in 12 BRs"},{"id":"c","text":"RESTMessageV2 cannot set headers"},{"id":"d","text":"Spokes cannot use MID"}],"answer":"b","explanation":"Judgment question. Configuration first, script when you must. Centralize in a Script Include if you script.","multi":false}]},{"id":"acl","title":"ACLs & Security","blurb":"Record/field ACLs, GlideRecordSecure, roles, and server-side enforcement — not UI hiding.","questions":[{"id":"acl-01","title":"GlideRecordSecure instead of GlideRecord","difficulty":"intermediate","kind":"server","prompt":"Query incident as the current user with ACL enforcement: GlideRecordSecure, active=true, log numbers you can actually read.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecordSecure('incident');\ngr.addQuery('active', true);\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecordSecure('incident')","message":"Use GlideRecordSecure on incident"},{"type":"includes","value":"addQuery","message":"Filter"},{"type":"includes","value":"query()","message":"query()"},{"type":"includes","value":".next()","message":"Iterate"}]},{"id":"acl-02","title":"canRead before returning a record","difficulty":"intermediate","kind":"script_include","prompt":"Script Include method getIncident: load incident by sysparm_sys_id with GlideRecord. If !gr.canRead() return \"\"; else return number.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var IncidentSecureAjax = Class.create();\nIncidentSecureAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  getIncident: function() {\n    var id = this.getParameter('sysparm_sys_id');\n    var gr = new GlideRecord('incident');\n    if (gr.get(id) && gr.canRead()) {\n      return gr.getValue('number');\n    }\n    return '';\n  },\n  type: 'IncidentSecureAjax'\n});","checks":[{"type":"includes","value":"getParameter('sysparm_sys_id')","message":"Read sysparm"},{"type":"includes","value":"new GlideRecord('incident')","message":"Load incident"},{"type":"includes","value":".canRead()","message":"Check canRead"}]},{"id":"acl-03","title":"Abort update without write","difficulty":"intermediate","kind":"business_rule","prompt":"Before update: if the user cannot write the record (current.canWrite() is false), add an error and setAbortAction(true).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (!current.canWrite()) {\n    gs.addErrorMessage('You cannot update this record.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"canWrite()","message":"canWrite"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"},{"type":"includes","value":"gs.addErrorMessage","message":"Error"}]},{"id":"acl-04","title":"Role check itil","difficulty":"easy","kind":"business_rule","prompt":"If the user does not have role itil (gs.hasRole(\"itil\") is false) and also does not have admin, abort the action.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (!gs.hasRole('itil') && !gs.hasRole('admin')) {\n    gs.addErrorMessage('itil role required.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.hasRole('itil')","message":"Check itil"},{"type":"includes","value":"gs.hasRole('admin')","message":"Check admin"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"acl-05","title":"ACL script: only opener or assigned","difficulty":"hard","kind":"server","prompt":"Write an ACL script body (not a full BR wrapper) that sets answer true only if opened_by or assigned_to equals gs.getUserID(). Use current and answer.","starter":"// Write your ServiceNow script below\n","solution":"answer = current.getValue('opened_by') == gs.getUserID() || current.getValue('assigned_to') == gs.getUserID();","checks":[{"type":"includes","value":"answer","message":"Set answer"},{"type":"includes","value":"gs.getUserID()","message":"Current user"},{"type":"includes","value":"opened_by","message":"opened_by"},{"type":"includes","value":"assigned_to","message":"assigned_to"}]},{"id":"acl-06","title":"Create ACL: new records","difficulty":"intermediate","kind":"server","prompt":"ACL create script: answer is true if gs.hasRole(\"itil\") OR current.isNewRecord() is not required — for create, check gs.hasRole(\"itil\"). Set answer accordingly.","starter":"// Write your ServiceNow script below\n","solution":"answer = gs.hasRole('itil');","checks":[{"type":"includes","value":"answer","message":"answer"},{"type":"includes","value":"gs.hasRole('itil')","message":"itil"}]},{"id":"acl-07","title":"canCreate / canDelete","difficulty":"easy","kind":"server","prompt":"Log \"CREATE\" if a GlideRecord on incident canCreate(), else \"NO_CREATE\". Then if canDelete() log \"DELETE\" else \"NO_DELETE\". Use one GlideRecord instance.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\ngs.info(gr.canCreate() ? 'CREATE' : 'NO_CREATE');\ngs.info(gr.canDelete() ? 'DELETE' : 'NO_DELETE');","checks":[{"type":"includes","value":"canCreate()","message":"canCreate"},{"type":"includes","value":"canDelete()","message":"canDelete"},{"type":"includes","value":"CREATE","message":"CREATE"},{"type":"includes","value":"NO_CREATE","message":"NO_CREATE"}]},{"id":"acl-08","title":"Field-level: hide SSN pattern","difficulty":"intermediate","kind":"business_rule","prompt":"Display-style idea in a Before query is wrong. Instead: if !gs.hasRole(\"admin\") && current.isValidField(\"u_ssn\"), set u_ssn to empty string so non-admins do not keep a value on update. (Simple field protection sketch.)","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (!gs.hasRole('admin') && current.isValidField('u_ssn')) {\n    current.setValue('u_ssn', '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.hasRole('admin')","message":"admin check"},{"type":"includes","value":"u_ssn","message":"u_ssn field"},{"type":"includes","value":"setValue","message":"Clear or set field"}]},{"id":"acl-09","title":"Scripted REST + GlideRecordSecure","difficulty":"hard","kind":"integration","prompt":"Scripted REST: pathParams.sys_id, GlideRecordSecure incident get. If not found or not readable, setStatus 404. Else 200 and setBody { number }.","starter":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n\n})(request, response);\n","solution":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n  var id = request.pathParams.sys_id;\n  var gr = new GlideRecordSecure('incident');\n  if (!gr.get(id)) {\n    response.setStatus(404);\n    response.setBody({ error: 'not_found' });\n    return;\n  }\n  response.setStatus(200);\n  response.setBody({ number: gr.getValue('number') });\n})(request, response);","checks":[{"type":"includes","value":"GlideRecordSecure","message":"GlideRecordSecure"},{"type":"includes","value":"pathParams","message":"pathParams"},{"type":"includes","value":"setStatus(404)","message":"404"},{"type":"includes","value":"setStatus(200)","message":"200"}]},{"id":"acl-10","title":"isMemberOf group","difficulty":"intermediate","kind":"business_rule","prompt":"Abort unless gs.getUser().isMemberOf(\"Service Desk\") or gs.hasRole(\"admin\").","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (!gs.getUser().isMemberOf('Service Desk') && !gs.hasRole('admin')) {\n    gs.addErrorMessage('Service Desk members only.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.getUser()","message":"getUser"},{"type":"includes","value":"isMemberOf('Service Desk')","message":"isMemberOf"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"acl-11","title":"hasRoleExactly","difficulty":"hard","kind":"client","prompt":"onLoad: if the user does NOT have sn_incident_write exactly (g_user.hasRoleExactly), setReadOnly short_description true. Do not use hasRole (admin would bypass).","starter":"function onLoad() {\n\n}\n","solution":"function onLoad() {\n  if (!g_user.hasRoleExactly('sn_incident_write')) {\n    g_form.setReadOnly('short_description', true);\n  }\n}","checks":[{"type":"includes","value":"g_user.hasRoleExactly","message":"hasRoleExactly"},{"type":"includes","value":"sn_incident_write","message":"role name"},{"type":"includes","value":"g_form.setReadOnly('short_description', true)","message":"Read-only"}]},{"id":"acl-12","title":"Query ACL style: restrict encoded query","difficulty":"intermediate","kind":"business_rule","prompt":"Query BR sketch: if !gs.hasRole(\"itil\"), addQuery(\"caller_id\", gs.getUserID()) so users only see their incidents.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (!gs.hasRole('itil')) {\n    current.addQuery('caller_id', gs.getUserID());\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.hasRole('itil')","message":"itil"},{"type":"includes","value":"addQuery","message":"addQuery"},{"type":"includes","value":"caller_id","message":"caller_id"},{"type":"includes","value":"gs.getUserID()","message":"current user"}]},{"id":"acl-13","title":"Deny script: answer false","difficulty":"easy","kind":"server","prompt":"Write an ACL script that always denies: answer = false;","starter":"// Write your ServiceNow script below\n","solution":"answer = false;","checks":[{"type":"regex","value":{"__regex":true,"source":"answer\\s*=\\s*false","flags":""},"message":"answer = false"}]},{"id":"acl-14","title":"Table name check in ACL","difficulty":"intermediate","kind":"server","prompt":"ACL script: answer true only if current.getTableName() == \"incident\" and gs.hasRole(\"itil\").","starter":"// Write your ServiceNow script below\n","solution":"answer = current.getTableName() == 'incident' && gs.hasRole('itil');","checks":[{"type":"includes","value":"getTableName()","message":"getTableName"},{"type":"includes","value":"incident","message":"incident"},{"type":"includes","value":"gs.hasRole('itil')","message":"itil"},{"type":"includes","value":"answer","message":"answer"}]},{"id":"acl-15","title":"Debug log without leaking","difficulty":"easy","kind":"server","prompt":"Log whether the current user has role admin using gs.hasRole(\"admin\") via gs.info, do not log the user password or session token. Log true/false only.","starter":"// Write your ServiceNow script below\n","solution":"gs.info(gs.hasRole('admin'));","checks":[{"type":"includes","value":"gs.hasRole('admin')","message":"hasRole admin"},{"type":"includes","value":"gs.info","message":"gs.info"}]},{"id":"acl-16","title":"canRead on GlideRecordSecure loop","difficulty":"intermediate","kind":"server","prompt":"GlideRecordSecure problem query active true. While next, if canRead() gs.info number. (Secure may skip unreadable rows; still check canRead.)","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecordSecure('problem');\ngr.addQuery('active', true);\ngr.query();\nwhile (gr.next()) {\n  if (gr.canRead()) {\n    gs.info(gr.getValue('number'));\n  }\n}","checks":[{"type":"includes","value":"GlideRecordSecure","message":"Secure"},{"type":"includes","value":"new GlideRecordSecure('problem')","message":"problem"},{"type":"includes","value":"canRead()","message":"canRead"}]},{"id":"acl-17","title":"Client: do not use hasRole for security","difficulty":"easy","kind":"client","prompt":"onSubmit: if short_description is empty, return false. Do not implement security with g_user.hasRole here — only UX validation.","starter":"function onSubmit() {\n  return true;\n}\n","solution":"function onSubmit() {\n  if (!g_form.getValue('short_description')) {\n    g_form.addErrorMessage('Short description is required.');\n    return false;\n  }\n  return true;\n}","checks":[{"type":"includes","value":"g_form.getValue('short_description')","message":"Read field"},{"type":"includes","value":"return false","message":"Block submit"}]},{"id":"acl-18","title":"Opened by self-read","difficulty":"intermediate","kind":"server","prompt":"answer = (current.opened_by == gs.getUserID()); for a record ACL read script. Use getValue for opened_by.","starter":"// Write your ServiceNow script below\n","solution":"answer = current.getValue('opened_by') == gs.getUserID();","checks":[{"type":"includes","value":"getValue('opened_by')","message":"opened_by"},{"type":"includes","value":"gs.getUserID()","message":"user"},{"type":"includes","value":"answer","message":"answer"}]},{"id":"acl-19","title":"REST 403 when cannot read","difficulty":"hard","kind":"integration","prompt":"Load incident with GlideRecord get pathParams.id. If found but !canRead(), setStatus 403 and body {error:\"forbidden\"}. If missing, 404. Else 200 {number}.","starter":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n\n})(request, response);\n","solution":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n  var gr = new GlideRecord('incident');\n  if (!gr.get(request.pathParams.id)) {\n    response.setStatus(404);\n    response.setBody({ error: 'not_found' });\n    return;\n  }\n  if (!gr.canRead()) {\n    response.setStatus(403);\n    response.setBody({ error: 'forbidden' });\n    return;\n  }\n  response.setStatus(200);\n  response.setBody({ number: gr.getValue('number') });\n})(request, response);","checks":[{"type":"includes","value":"canRead()","message":"canRead"},{"type":"includes","value":"setStatus(403)","message":"403"},{"type":"includes","value":"forbidden","message":"forbidden"},{"type":"includes","value":"setStatus(404)","message":"404"}]},{"id":"acl-20","title":"Both role and group","difficulty":"intermediate","kind":"server","prompt":"answer true only if gs.hasRole(\"itil\") AND gs.getUser().isMemberOf(\"CAB Approvers\").","starter":"// Write your ServiceNow script below\n","solution":"answer = gs.hasRole('itil') && gs.getUser().isMemberOf('CAB Approvers');","checks":[{"type":"includes","value":"gs.hasRole('itil')","message":"itil"},{"type":"includes","value":"isMemberOf('CAB Approvers')","message":"CAB Approvers"},{"type":"includes","value":"answer","message":"answer"}]}],"theory":[{"id":"acl-t01","title":"ACL evaluation order","difficulty":"hard","format":"theory","kind":"theory","prompt":"Record ACL vs field ACL: a user can open the incident form but SSN is empty/*blank*. Most accurate explanation?","options":[{"id":"a","text":"The record ACL failed"},{"id":"b","text":"Record read passed; a field ACL on that column denied read so the UI/API omits or blanks the field"},{"id":"c","text":"Query BRs always blank fields"},{"id":"d","text":"g_form.setDisplay is the only way fields blank"}],"answer":"b","explanation":"Table/record ACL grants the row. Field ACLs are evaluated per column. Deny field read ≠ deny record read. Debug Security Rules shows both layers. Never “fix” this with a client script only.","multi":false},{"id":"acl-t02","title":"Wildcard table *","difficulty":"hard","format":"theory","kind":"theory","prompt":"What does an ACL on *.* vs incident.None mean in interviews?","options":[{"id":"a","text":"They are identical"},{"id":"b","text":"* is a fallback for tables/fields without a more specific ACL; a specific incident ACL wins over * for that table. Empty/incorrect * rules are a common lockout or wide-open hole"},{"id":"c","text":"* always denies everything"},{"id":"d","text":"You cannot create * ACLs"}],"answer":"b","explanation":"Specificity: table.field > table.None > * . Understand None (row) vs field name. Misconfigured * is a classic outage after an update set.","multi":false},{"id":"acl-t03","title":"Admin override","difficulty":"hard","format":"theory","kind":"theory","prompt":"gs.hasRole(\"itil\") returns true for admin even without itil. Why does ACL design still break?","options":[{"id":"a","text":"Admin never bypasses ACLs"},{"id":"b","text":"Many ACL scripts use hasRole which admin satisfies; security that must not apply to admin needs hasRoleExactly or explicit user_name checks — and admin can still often pass other ACLs. Design SoD knowing admin is a bypass hammer"},{"id":"c","text":"hasRole never returns true for admin"},{"id":"d","text":"Admin cannot query incident"}],"answer":"b","explanation":"Interview: hasRole vs hasRoleExactly (client g_user too). Don’t use hasRole(\"snc_internal\") style checks expecting admin to fail.","multi":false},{"id":"acl-t04","title":"Script + role + condition","difficulty":"hard","format":"theory","kind":"theory","prompt":"An ACL has a role, a condition, AND a script. When does it pass?","options":[{"id":"a","text":"If any one of the three is true (OR)"},{"id":"b","text":"Typically ALL configured parts must pass (AND): role AND condition AND script answer true. Empty script is not a free pass if other parts fail"},{"id":"c","text":"Script always overrides roles"},{"id":"d","text":"Conditions are ignored when a script exists"}],"answer":"b","explanation":"People assume script replaces roles. Debug Security: each piece is a gate. Test with a non-admin.","multi":false},{"id":"acl-t05","title":"GlideRecord vs ACL","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why can a Business Rule using GlideRecord update a field the user cannot edit on the form?","options":[{"id":"a","text":"BRs cannot update that field"},{"id":"b","text":"Server GlideRecord often runs with engine privileges / not the same as UI field ACL for that user; user-facing paths need GlideRecordSecure or the BR is an intentional elevation — never confuse UI ACLs with scripted writes"},{"id":"c","text":"Field ACLs apply equally to all GlideRecord in every context"},{"id":"d","text":"setWorkflow(false) enforces field ACLs"}],"answer":"b","explanation":"Elevation vs user context is the whole ACL interview. Integrations running as a privileged user bypass UI. That’s a feature and a finding.","multi":false},{"id":"acl-t06","title":"Query ACLs","difficulty":"hard","format":"theory","kind":"theory","prompt":"Query ACLs / query rules vs Query Business Rules: which statement is right?","options":[{"id":"a","text":"They are the same record type"},{"id":"b","text":"Both can restrict which rows a user sees in lists/queries; Query BRs mutate the GlideRecord query; ACLs deny access. Using both without planning causes “empty list” tickets that look like a broken filter"},{"id":"c","text":"Query ACLs only apply to SOAP"},{"id":"d","text":"Query BRs replace all ACLs so you should delete ACLs"}],"answer":"b","explanation":"CIS/CAD: two mechanisms. Debug: impersonate + Debug Security + log the encoded query.","multi":false},{"id":"acl-t07","title":"Create ACL and isNewRecord","difficulty":"hard","format":"theory","kind":"theory","prompt":"Create ACL scripts that check current.number == \"INC0001\" fail. Why?","options":[{"id":"a","text":"number is always INC0001 on create"},{"id":"b","text":"On create, many fields are still empty; number may be generated on insert. Use roles, gs.hasRole, or parent fields that exist before insert — not post-insert data"},{"id":"c","text":"Create ACLs cannot use scripts"},{"id":"d","text":"You must use SOAP to create"}],"answer":"b","explanation":"Create vs write. isNewRecord() is for write ACLs on records not yet saved. Create happens before a sys_id exists in DB.","multi":false},{"id":"acl-t08","title":"Debug Security Rules","difficulty":"hard","format":"theory","kind":"theory","prompt":"Best first tool when “itil cannot see a module/record” after an update set?","options":[{"id":"a","text":"Rewrite all ACLs from scratch"},{"id":"b","text":"Impersonate the user, enable Debug Security Rules / Debug Business Rules, reproduce, read the first failing ACL — do not guess in sys_security_acl list unsorted"},{"id":"c","text":"Delete the user"},{"id":"d","text":"Client script console.log"}],"answer":"b","explanation":"Platform tool. Session debug. Impersonation. Then look at roles and groups.","multi":false},{"id":"acl-t09","title":"UI Policy vs ACL","difficulty":"hard","format":"theory","kind":"theory","prompt":"Hiding a field with UI Policy is not security because?","options":[{"id":"a","text":"UI Policies encrypt the field"},{"id":"b","text":"The value can still be read via API, reports, lists, export, GlideRecord; only ACLs/Data Policies/encryption protect data"},{"id":"c","text":"UI Policies run on the server before SQL"},{"id":"d","text":"Hidden fields are deleted"}],"answer":"b","explanation":"Repeated ITSM/CAD question. Same as mandatory client scripts.","multi":false},{"id":"acl-t10","title":"Scoped app ACLs","difficulty":"hard","format":"theory","kind":"theory","prompt":"A scoped Script Include queries incident and fails for a user who can open incidents in ITSM. Likely cause?","options":[{"id":"a","text":"Scoped apps cannot query incident"},{"id":"b","text":"Missing cross-scope privilege / runtime access / ACLs on the script include itself (Execute) — not only table ACLs"},{"id":"c","text":"GlideRecord is banned in scope"},{"id":"d","text":"You must duplicate the incident table in scope"}],"answer":"b","explanation":"Application access on the table (Can read, Allow access to this table via web services) plus SI protection. CAD territory that hits ITSM integrations.","multi":false},{"id":"acl-t11","title":"REST Table API","difficulty":"hard","format":"theory","kind":"theory","prompt":"Table API honors ACLs of the authenticated user. You used basic auth as admin and thought ACLs were “tested.” Why is that invalid?","options":[{"id":"a","text":"Table API ignores ACLs always"},{"id":"b","text":"You tested admin, not the integration user; create a dedicated user with least-privilege roles and retest; also test field ACLs on GET sysparm_fields"},{"id":"c","text":"Basic auth disables ACLs"},{"id":"d","text":"Table API only works as guest"}],"answer":"b","explanation":"Least privilege integration accounts. Field-level exclusions in JSON.","multi":false},{"id":"acl-t12","title":"answer = true","difficulty":"hard","format":"theory","kind":"theory","prompt":"An ACL script is empty / answer never set. What happens?","options":[{"id":"a","text":"JavaScript throws and the node crashes"},{"id":"b","text":"Platform default for an ACL script without setting answer is typically deny (or legacy quirks) — never rely on implicit true; always set answer explicitly"},{"id":"c","text":"Empty script always allows"},{"id":"d","text":"Empty script skips the ACL row"}],"answer":"b","explanation":"Be explicit. Interviewers want answer = ... every time.","multi":false},{"id":"acl-t13","title":"Deny-unless vs allow-if","difficulty":"hard","format":"theory","kind":"theory","prompt":"ServiceNow ACLs are closer to which model?","options":[{"id":"a","text":"Default allow if no ACL exists on a custom table — which is why new tables are wide open until you add ACLs"},{"id":"b","text":"Default deny for every new table with no extra work"},{"id":"c","text":"ACLs cannot be added to custom tables"},{"id":"d","text":"Only admin can create tables so ACLs never matter"}],"answer":"a","explanation":"Huge CAD trap: custom table with no ACLs can be accessible more than you think depending on * rules. Always add ACLs on new tables. Verify with a non-admin.","multi":false},{"id":"acl-t14","title":"gs.getSession().impersonate","difficulty":"hard","format":"theory","kind":"theory","prompt":"When is impersonate in a script appropriate?","options":[{"id":"a","text":"In every REST call to skip ACLs"},{"id":"b","text":"Rare, audited elevation (e.g. inbound integration must act as the caller); always restore, never impersonate in a Before BR on a user-facing form as a shortcut"},{"id":"c","text":"To make Query BRs faster"},{"id":"d","text":"Impersonate is client-only"}],"answer":"b","explanation":"Security review finding if used casually. Prefer GlideRecordSecure as the user already in session.","multi":false},{"id":"acl-t15","title":"Roles in groups","difficulty":"hard","format":"theory","kind":"theory","prompt":"User has itil via group. ACL requires itil. Still fail. Causes?","options":[{"id":"a","text":"Groups never grant roles"},{"id":"b","text":"Role not in the group, inheritance cache, domain, or the ACL needs a different role (sn_incident_read) while itil was assumed enough"},{"id":"c","text":"ACLs cannot use roles from groups"},{"id":"d","text":"You need SOAP to refresh roles"}],"answer":"b","explanation":"Check sys_user_has_role. Impersonate. sn_* granular roles in later families vs classic itil.","multi":false},{"id":"acl-t16","title":"Write ACL vs Data Policy","difficulty":"hard","format":"theory","kind":"theory","prompt":"Both can block a field update. Difference?","options":[{"id":"a","text":"None"},{"id":"b","text":"ACL is security (who); Data Policy is data quality (what is allowed) and can apply to UI and/or web services independently of roles"},{"id":"c","text":"Data Policies only run on the client"},{"id":"d","text":"ACLs cannot block writes"}],"answer":"b","explanation":"Use both. ACL: HR can write u_ssn. Data Policy: format. Don’t overload ACL scripts with regex validation.","multi":false},{"id":"acl-t17","title":"List vs form","difficulty":"hard","format":"theory","kind":"theory","prompt":"User sees the row in a list but form says Security constraints. Typical?","options":[{"id":"a","text":"Impossible"},{"id":"b","text":"List used a query that showed the row (or a report as another user); form load evaluates ACLs differently, or a Display BR aborts, or field ACLs on a mandatory field; impersonate on both views"},{"id":"c","text":"Lists never use ACLs"},{"id":"d","text":"Forms ignore ACLs"}],"answer":"b","explanation":"Debug both. Also UI actions vs form.","multi":false},{"id":"acl-t18","title":"GlideRecordSecure.next()","difficulty":"hard","format":"theory","kind":"theory","prompt":"Secure query returns fewer rows than GlideRecord for the same addQuery. Why?","options":[{"id":"a","text":"A bug; they must match"},{"id":"b","text":"Unreadable rows are skipped; that is the point. Using Secure then getRowCount for metrics under-counts vs admin GlideRecord"},{"id":"c","text":"Secure ignores addQuery"},{"id":"d","text":"Secure only works on sys_user"}],"answer":"b","explanation":"Don’t mix Secure counts with admin KPIs. Document the user context.","multi":false},{"id":"acl-t19","title":"Execute ACL on Script Include","difficulty":"hard","format":"theory","kind":"theory","prompt":"Client callable SI works for admin, 403/empty for itil. Besides Client callable checkbox?","options":[{"id":"a","text":"Nothing else"},{"id":"b","text":"Script Include ACL / roles on the include, and the ACLs on tables it touches; also sandbox and scope"},{"id":"c","text":"itil can never call GlideAjax"},{"id":"d","text":"You must put the SI in Global and uncheck isolation"}],"answer":"b","explanation":"Three layers: Ajax access, SI roles, table ACLs inside the method.","multi":false},{"id":"acl-t20","title":"High security plugin / contextual security","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why might an instance after “High Security” behave differently for * ACLs?","options":[{"id":"a","text":"It disables all ACLs"},{"id":"b","text":"High Security / contextual security tightens defaults; copying ACLs from a PDI without it causes surprises. Know whether the customer instance has it before designing * wildcards"},{"id":"c","text":"It only affects MID"},{"id":"d","text":"It removes itil"}],"answer":"b","explanation":"Environment parity. Interview: don’t design ACLs on a loose PDI and ship to a locked prod.","multi":false}]}];

  <script>
/* global TOPICS, EXAMS, SNOW_API */
(function () {
    const STORAGE_KEY = 'snow-itsm-lab-v2';

  const COMMENT_BLOCK = /\/\*[\s\S]*?\*\//g;
  const COMMENT_LINE = /(^|[^:\\])\/\/.*$/gm;

  function stripComments(code) {
    return String(code ?? '')
      .replace(COMMENT_BLOCK, ' ')
      .replace(COMMENT_LINE, '$1');
  }

  function asRegex(value, flags) {
    if (value instanceof RegExp) return value;
    return new RegExp(value, flags || '');
  }

  function runCheck(source, stripped, check) {
    const haystack = check.raw ? source : stripped;
    const type = check.type || 'includes';
    if (type === 'includes') {
      const ok = haystack.includes(check.value);
      return { ok, message: check.message, detail: ok ? 'found' : 'missing “' + check.value + '”' };
    }
    if (type === 'includesi') {
      const ok = haystack.toLowerCase().includes(String(check.value).toLowerCase());
      return { ok, message: check.message, detail: ok ? 'found' : 'missing “' + check.value + '”' };
    }
    if (type === 'excludes') {
      const ok = !haystack.includes(check.value);
      return { ok, message: check.message, detail: ok ? 'ok' : 'must not include “' + check.value + '”' };
    }
    if (type === 'regex') {
      const pattern = check.value && check.value.__regex
        ? new RegExp(check.value.source, check.value.flags || '')
        : asRegex(check.value, check.flags);
      const ok = pattern.test(haystack);
      return { ok, message: check.message, detail: ok ? 'matched' : 'pattern not found' };
    }
    if (type === 'oneOf') {
      const ok = (check.values || []).some(function (value) { return haystack.includes(value); });
      return { ok, message: check.message, detail: ok ? 'found' : 'need one of: ' + (check.values || []).join(', ') };
    }
    if (type === 'allOf') {
      const missing = (check.values || []).filter(function (value) { return !haystack.includes(value); });
      return { ok: missing.length === 0, message: check.message, detail: missing.length ? 'missing ' + missing.join(', ') : 'found' };
    }
    if (type === 'order') {
      const values = check.values || [];
      var from = 0;
      for (var i = 0; i < values.length; i += 1) {
        var idx = haystack.indexOf(values[i], from);
        if (idx === -1) return { ok: false, message: check.message, detail: 'missing “' + values[i] + '” in order' };
        from = idx + values[i].length;
      }
      return { ok: true, message: check.message, detail: 'order ok' };
    }
    if (type === 'minCount') {
      var needle = check.value;
      var count = 0;
      var pos = 0;
      while (needle && (pos = haystack.indexOf(needle, pos)) !== -1) {
        count += 1;
        pos += needle.length;
      }
      var okc = count >= (check.count || 1);
      return { ok: okc, message: check.message, detail: okc ? count + ' occurrence(s)' : 'need at least ' + check.count + ' of “' + needle + '”' };
    }
    return { ok: false, message: check.message || 'Unknown check', detail: type };
  }

  function grade(code, checks) {
    var started = performance.now();
    var source = String(code ?? '');
    var stripped = stripComments(source);
    var results = (checks || []).map(function (check) { return runCheck(source, stripped, check); });
    return {
      passed: results.length > 0 && results.every(function (item) { return item.ok; }),
      results: results,
      durationMs: Math.max(0, performance.now() - started),
    };
  }

  function hydrateChecks(checks) {
    return (checks || []).map(function (check) {
      if (check && check.value && check.value.__regex) {
        return Object.assign({}, check, { value: new RegExp(check.value.source, check.value.flags || '') });
      }
      return check;
    });
  }

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"answers":{},"results":{}}');
    } catch (e) {
      return { answers: {}, results: {} };
    }
  }

  function saveProgress(progress) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }

  function escapeHtml(value) {
    return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function getTopic(id) {
    return TOPICS.find(function (topic) { return topic.id === id; }) || TOPICS[0];
  }

  function getExam(id) {
    return EXAMS.find(function (exam) { return exam.id === id; }) || EXAMS[0];
  }

  function getQuestion(topicId, questionId, mode) {
    var topic = getTopic(topicId);
    var list = mode === 'theory' ? topic.theory : topic.questions;
    return list.find(function (item) { return item.id === questionId; }) || list[0];
  }

  var state = {
    view: 'practice',
    examId: EXAMS[0].id,
    examIndex: 0,
    topicId: TOPICS[0].id,
    questionId: TOPICS[0].questions[0].id,
    mode: 'code',
    progress: loadProgress(),
    solutionOpen: false,
    acIndex: 0,
    acItems: [],
  };

  function currentExam() {
    return getExam(state.examId);
  }

  function currentTopic() {
    return getTopic(state.topicId);
  }

  function currentList() {
    var topic = currentTopic();
    return state.mode === 'theory' ? topic.theory : topic.questions;
  }

  function currentQuestion() {
    return getQuestion(state.topicId, state.questionId, state.mode);
  }

  function applyExamItem(index) {
    var exam = currentExam();
    var safe = Math.max(0, Math.min(index, exam.items.length - 1));
    var item = exam.items[safe];
    state.examIndex = safe;
    state.topicId = item.topicId;
    state.questionId = item.questionId;
    state.mode = item.mode;
  }

  function passedCount(topic, mode) {
    var list = mode === 'theory' ? topic.theory : topic.questions;
    return list.filter(function (item) { return state.progress.results[item.id] && state.progress.results[item.id].passed; }).length;
  }

  function examPassedCount(exam) {
    return exam.items.filter(function (item) {
      return state.progress.results[item.questionId] && state.progress.results[item.questionId].passed;
    }).length;
  }

  var textarea = document.getElementById('code');
  var acMenu = document.getElementById('ac-menu');

  function persistTheory() {
    var question = currentQuestion();
    if (!question || !question.options) return;
    if (question.multi) {
      state.progress.answers[question.id] = Array.prototype.map.call(document.querySelectorAll('#theory-box input:checked'), function (el) { return el.value; });
    } else {
      var selected = document.querySelector('#theory-box input:checked');
      state.progress.answers[question.id] = selected ? selected.value : '';
    }
    saveProgress(state.progress);
  }

  function persistCurrent() {
    if (state.mode === 'theory') persistTheory();
    else persistCode();
  }

  function gradeTheory(selected, question) {
    var started = performance.now();
    var expected = [].concat(question.answer).map(String).sort();
    var got = [].concat(selected || []).filter(Boolean).map(String).sort();
    var passed = expected.length > 0 && got.length === expected.length && got.every(function (v, i) { return v === expected[i]; });
    return {
      passed: passed,
      results: [{ ok: passed, message: passed ? 'Correct' : 'Incorrect', detail: passed ? 'matched' : 'Choose an answer, then Grade' }],
      durationMs: Math.max(0, performance.now() - started),
    };
  }

  function persistCode() {
    if (state.mode !== 'code') return;
    state.progress.answers[currentQuestion().id] = textarea.value;
    saveProgress(state.progress);
  }

  function snippetInsert(text) {
    return String(text || '').replace(/\$\{\d+:([^}]+)\}/g, '$1').replace(/\$\d+/g, '');
  }

  function completionsFor(prefix, objectName) {
    var items = [];
    var p = (prefix || '').toLowerCase();
    if (objectName && SNOW_API.namespaces[objectName]) {
      (SNOW_API.namespaces[objectName].methods || []).forEach(function (method) {
        if (!p || method.name.toLowerCase().indexOf(p) === 0) {
          items.push({ label: method.name, detail: method.signature, insert: snippetInsert(method.insertText || method.name + '()') });
        }
      });
    }
    if (objectName && SNOW_API.classes[objectName] && SNOW_API.classes[objectName].methods) {
      SNOW_API.classes[objectName].methods.forEach(function (method) {
        if (!p || method.name.toLowerCase().indexOf(p) === 0) {
          items.push({ label: method.name, detail: method.signature, insert: snippetInsert(method.insertText || method.name + '()') });
        }
      });
    }
    if (items.length) return items.slice(0, 20);
    Object.keys(SNOW_API.classes).forEach(function (name) {
      if (!p || name.toLowerCase().indexOf(p) === 0) {
        var cls = SNOW_API.classes[name];
        items.push({ label: name, detail: cls.detail, insert: snippetInsert(cls.construct || name) });
      }
    });
    SNOW_API.globals.forEach(function (g) {
      if (!p || g.name.toLowerCase().indexOf(p) === 0) {
        items.push({ label: g.name, detail: g.detail, insert: g.name });
      }
    });
    SNOW_API.snippets.forEach(function (snip) {
      if (!p || snip.label.toLowerCase().indexOf(p) !== -1) {
        items.push({ label: snip.label, detail: 'snippet', insert: snippetInsert(snip.insertText) });
      }
    });
    SNOW_API.tables.forEach(function (table) {
      if (p && table.toLowerCase().indexOf(p) === 0) {
        items.push({ label: table, detail: 'table', insert: table });
      }
    });
    return items.slice(0, 20);
  }

  function tokenBeforeCursor() {
    var pos = textarea.selectionStart;
    var before = textarea.value.slice(0, pos);
    var member = before.match(/([A-Za-z_$][\w$]*)\.([A-Za-z_$][\w$]*)$/);
    if (member) return { objectName: member[1], prefix: member[2], start: pos - member[2].length };
    var word = before.match(/[A-Za-z_$][\w$]*$/);
    if (word) return { objectName: '', prefix: word[0], start: pos - word[0].length };
    return { objectName: '', prefix: '', start: pos };
  }

  function hideAc() {
    acMenu.hidden = true;
    state.acItems = [];
  }

  function showAc() {
    var token = tokenBeforeCursor();
    if (!token.prefix && !token.objectName) {
      hideAc();
      return;
    }
    state.acItems = completionsFor(token.prefix, token.objectName);
    state.acIndex = 0;
    if (!state.acItems.length) {
      hideAc();
      return;
    }
    acMenu.innerHTML = state.acItems.map(function (item, i) {
      return '<button type="button" class="ac-item' + (i === 0 ? ' active' : '') + '" data-i="' + i + '"><strong>' + escapeHtml(item.label) + '</strong><span>' + escapeHtml(item.detail || '') + '</span></button>';
    }).join('');
    acMenu.hidden = false;
    acMenu.querySelectorAll('.ac-item').forEach(function (btn) {
      btn.addEventListener('mousedown', function (ev) {
        ev.preventDefault();
        acceptAc(Number(btn.getAttribute('data-i')));
      });
    });
  }

  function acceptAc(index) {
    var item = state.acItems[index];
    if (!item) return;
    var token = tokenBeforeCursor();
    var value = textarea.value;
    var pos = textarea.selectionStart;
    textarea.value = value.slice(0, token.start) + item.insert + value.slice(pos);
    var caret = token.start + item.insert.length;
    textarea.selectionStart = textarea.selectionEnd = caret;
    hideAc();
    persistCode();
    textarea.focus();
  }

  function renderSidebar() {
    var nav = document.getElementById('topic-nav');
    var examButtons = EXAMS.map(function (exam) {
      var done = examPassedCount(exam);
      var active = state.view === 'exam' && exam.id === state.examId ? 'active' : '';
      return '<button class="topic exam ' + active + '" data-exam="' + exam.id + '"><span class="topic-title">' + escapeHtml(exam.title) + '</span><span class="topic-count">' + done + '/' + exam.items.length + '</span></button>';
    }).join('');
    var topicButtons = TOPICS.map(function (topic) {
      var codeDone = passedCount(topic, 'code');
      var theoryDone = passedCount(topic, 'theory');
      var active = state.view === 'practice' && topic.id === state.topicId ? 'active' : '';
      return '<button class="topic ' + active + '" data-topic="' + topic.id + '"><span class="topic-title">' + escapeHtml(topic.title) + '</span><span class="topic-count">' + codeDone + '/' + topic.questions.length + ' · ' + theoryDone + '/' + topic.theory.length + '</span></button>';
    }).join('');
    nav.innerHTML = '<p class="nav-heading">Exams</p>' + examButtons + '<p class="nav-heading">Practice</p>' + topicButtons;
    nav.querySelectorAll('[data-exam]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        persistCurrent();
        state.view = 'exam';
        state.examId = btn.getAttribute('data-exam');
        applyExamItem(0);
        state.solutionOpen = false;
        render();
      });
    });
    nav.querySelectorAll('[data-topic]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        persistCurrent();
        state.view = 'practice';
        state.topicId = btn.getAttribute('data-topic');
        state.questionId = currentList()[0].id;
        state.solutionOpen = false;
        render();
      });
    });
  }

  function renderQuestionList() {
    var listEl = document.getElementById('question-list');
    if (state.view === 'exam') {
      var exam = currentExam();
      listEl.innerHTML = exam.items.map(function (item, index) {
        var question = getQuestion(item.topicId, item.questionId, item.mode);
        var result = state.progress.results[item.questionId];
        var cls = index === state.examIndex ? 'active' : '';
        if (result && result.passed) cls += ' passed';
        return '<button class="q-item ' + cls + '" data-idx="' + index + '"><span class="q-idx">' + String(index + 1).padStart(2, '0') + '</span><span class="q-name">' + escapeHtml(question.title) + '</span><span class="q-kind">' + item.mode + '</span></button>';
      }).join('');
      listEl.querySelectorAll('.q-item').forEach(function (btn) {
        btn.addEventListener('click', function () {
          persistCurrent();
          applyExamItem(Number(btn.getAttribute('data-idx')));
          state.solutionOpen = false;
          render();
        });
      });
      return;
    }
    listEl.innerHTML = currentList().map(function (item, index) {
      var result = state.progress.results[item.id];
      var cls = item.id === state.questionId ? 'active' : '';
      if (result && result.passed) cls += ' passed';
      return '<button class="q-item ' + cls + '" data-qid="' + item.id + '"><span class="q-idx">' + String(index + 1).padStart(2, '0') + '</span><span class="q-name">' + escapeHtml(item.title) + '</span><span class="q-diff">' + escapeHtml(item.difficulty) + '</span></button>';
    }).join('');
    listEl.querySelectorAll('.q-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        persistCurrent();
        state.questionId = btn.getAttribute('data-qid');
        state.solutionOpen = false;
        render();
      });
    });
  }

  function theorySolutionText(question) {
    var ids = [].concat(question.answer);
    var labels = ids.map(function (id) {
      var option = (question.options || []).find(function (item) { return item.id === id; });
      return option ? id.toUpperCase() + '. ' + option.text : id;
    });
    return labels.join('\n') + '\n\n' + (question.explanation || '');
  }

  function renderTheory() {
    var box = document.getElementById('theory-box');
    if (!box) return;
    if (state.mode !== 'theory') {
      box.innerHTML = '';
      box.hidden = true;
      return;
    }
    var question = currentQuestion();
    var saved = state.progress.answers[question.id];
    var selected = {};
    [].concat(saved || []).forEach(function (id) { if (id) selected[id] = true; });
    var inputType = question.multi ? 'checkbox' : 'radio';
    box.hidden = false;
    box.innerHTML = question.options.map(function (option) {
      var on = selected[option.id] ? ' checked' : '';
      var cls = selected[option.id] ? ' selected' : '';
      return '<label class="theory-option' + cls + '"><input type="' + inputType + '" name="theory-' + question.id + '" value="' + option.id + '"' + on + ' /><span><strong>' + option.id.toUpperCase() + '.</strong> ' + escapeHtml(option.text) + '</span></label>';
    }).join('');
    box.querySelectorAll('input').forEach(function (input) {
      input.addEventListener('change', function () {
        persistTheory();
        renderTheory();
      });
    });
  }

  function renderGrade(result) {
    var box = document.getElementById('grade-results');
    if (!result) {
      box.innerHTML = '<p class="muted">' + (state.mode === 'theory' ? 'Pick an answer, then Grade.' : 'Press Grade (Ctrl/Cmd+Enter) for instant feedback. Type a ServiceNow API name for autocomplete.') + '</p>';
      box.className = 'grade-box';
      return;
    }
    box.className = 'grade-box ' + (result.passed ? 'ok' : 'fail');
    var rows = result.results.map(function (item) {
      return '<li class="' + (item.ok ? 'ok' : 'fail') + '"><span>' + (item.ok ? 'Pass' : 'Fail') + '</span>' + escapeHtml(item.message) + (item.ok ? '' : ' — ' + escapeHtml(item.detail)) + '</li>';
    }).join('');
    box.innerHTML = '<div class="grade-head">' + (result.passed ? 'Passed' : 'Not yet') + ' · ' + result.durationMs.toFixed(1) + ' ms</div><ul>' + rows + '</ul>';
  }

  function goNext() {
    persistCurrent();
    state.solutionOpen = false;
    if (state.view === 'exam') {
      var exam = currentExam();
      if (state.examIndex < exam.items.length - 1) applyExamItem(state.examIndex + 1);
    } else {
      var list = currentList();
      var idx = -1;
      for (var i = 0; i < list.length; i += 1) {
        if (list[i].id === state.questionId) { idx = i; break; }
      }
      if (idx >= 0 && idx < list.length - 1) state.questionId = list[idx + 1].id;
    }
    render();
  }

  function render() {
    var question = currentQuestion();
    var topic = currentTopic();
    var isTheory = state.mode === 'theory';
    renderSidebar();
    renderQuestionList();
    var toggle = document.getElementById('mode-toggle');
    if (toggle) toggle.hidden = state.view === 'exam';
    document.querySelectorAll('#mode-toggle [data-mode]').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-mode') === state.mode);
    });
    var exam = state.view === 'exam' ? currentExam() : null;
    document.getElementById('crumb').textContent = (exam ? exam.title + ' · ' : '') + topic.title + ' · ' + (isTheory ? 'theory' : String(question.kind || 'server').replace(/_/g, ' '));
    document.getElementById('q-title').textContent = question.title;
    document.getElementById('q-prompt').textContent = question.prompt;
    var hint = document.getElementById('hint');
    hint.textContent = question.hint || '';
    hint.hidden = !question.hint;
    document.getElementById('solution-pane').hidden = !state.solutionOpen;
    document.getElementById('solution-code').textContent = isTheory ? theorySolutionText(question) : question.solution;
    document.getElementById('reveal-btn').textContent = state.solutionOpen ? 'Hide solution' : 'Show solution';
    document.getElementById('apply-btn').textContent = isTheory ? 'Select correct answer' : 'Copy solution into editor';
    document.getElementById('editor').hidden = isTheory;
    var nextBtn = document.getElementById('next-btn');
    if (nextBtn) {
      if (state.view === 'exam') {
        nextBtn.disabled = state.examIndex >= currentExam().items.length - 1;
      } else {
        var plist = currentList();
        var pidx = -1;
        for (var pi = 0; pi < plist.length; pi += 1) {
          if (plist[pi].id === state.questionId) { pidx = pi; break; }
        }
        nextBtn.disabled = pidx < 0 || pidx >= plist.length - 1;
      }
    }
    renderTheory();
    if (!isTheory) {
      textarea.value = state.progress.answers[question.id] != null ? state.progress.answers[question.id] : question.starter;
    }
    var last = state.progress.results[question.id];
    renderGrade(last && last.grade ? last.grade : null);
    if (exam) {
      document.getElementById('blurb').textContent = exam.blurb;
      document.getElementById('progress-label').textContent = examPassedCount(exam) + ' of ' + exam.items.length + ' exam items passed';
    } else {
      document.getElementById('blurb').textContent = topic.blurb;
      document.getElementById('progress-label').textContent = isTheory
        ? passedCount(topic, 'theory') + ' of ' + topic.theory.length + ' theory passed'
        : passedCount(topic, 'code') + ' of ' + topic.questions.length + ' code passed';
    }
  }

  function runGrade() {
    persistCurrent();
    var question = currentQuestion();
    var result = state.mode === 'theory'
      ? gradeTheory(state.progress.answers[question.id], question)
      : grade(textarea.value, hydrateChecks(question.checks));
    var prev = state.progress.results[question.id] || {};
    state.progress.results[question.id] = { passed: result.passed, grade: result, revealed: prev.revealed };
    saveProgress(state.progress);
    renderSidebar();
    renderQuestionList();
    renderGrade(result);
  }

  document.getElementById('grade-btn').addEventListener('click', runGrade);
  document.getElementById('reveal-btn').addEventListener('click', function () {
    state.solutionOpen = !state.solutionOpen;
    var prev = state.progress.results[currentQuestion().id] || {};
    state.progress.results[currentQuestion().id] = Object.assign({}, prev, { revealed: true });
    saveProgress(state.progress);
    render();
  });
  document.getElementById('apply-btn').addEventListener('click', function () {
    var question = currentQuestion();
    if (state.mode === 'theory') {
      state.progress.answers[question.id] = question.answer;
      saveProgress(state.progress);
      renderTheory();
      return;
    }
    textarea.value = question.solution;
    persistCode();
  });
  document.getElementById('reset-btn').addEventListener('click', function () {
    delete state.progress.answers[currentQuestion().id];
    saveProgress(state.progress);
    render();
  });
  var nextEl = document.getElementById('next-btn');
  if (nextEl) nextEl.addEventListener('click', goNext);
  document.querySelectorAll('#mode-toggle [data-mode]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      persistCurrent();
      state.mode = btn.getAttribute('data-mode');
      state.questionId = currentList()[0].id;
      state.solutionOpen = false;
      render();
    });
  });

  textarea.addEventListener('input', function () {
    persistCode();
    showAc();
  });
  textarea.addEventListener('keydown', function (ev) {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
      ev.preventDefault();
      hideAc();
      runGrade();
      return;
    }
    if (acMenu.hidden) return;
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      state.acIndex = (state.acIndex + 1) % state.acItems.length;
      acMenu.querySelectorAll('.ac-item').forEach(function (el, i) { el.classList.toggle('active', i === state.acIndex); });
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      state.acIndex = (state.acIndex - 1 + state.acItems.length) % state.acItems.length;
      acMenu.querySelectorAll('.ac-item').forEach(function (el, i) { el.classList.toggle('active', i === state.acIndex); });
    } else if (ev.key === 'Tab' || ev.key === 'Enter') {
      ev.preventDefault();
      acceptAc(state.acIndex);
    } else if (ev.key === 'Escape') {
      hideAc();
    }
  });
  textarea.addEventListener('blur', function () {
    setTimeout(hideAc, 150);
  });

  render();
})();

  </script>
</body>
</html>
