pe":"includes","value":"g_form.getReference('cmdb_ci'","message":"getReference"},{"type":"includes","value":"operational_status","message":"Status"},{"type":"includes","value":"showFieldMsg","message":"Field message"}]}],"theory":[{"id":"cmdb-t01","title":"cmdb vs cmdb_ci","difficulty":"hard","format":"theory","kind":"theory","prompt":"CIS: What extends what?","options":[{"id":"a","text":"Everything extends incident"},{"id":"b","text":"Technical CIs extend cmdb_ci; some non-technical/base configuration items extend cmdb (Base Configuration Item). Mixing them in a GlideRecord(\"cmdb_ci\") query silently drops classes that live only under cmdb"},{"id":"c","text":"cmdb_ci extends alm_asset"},{"id":"d","text":"cmdb_rel_ci extends cmdb_ci"}],"answer":"b","explanation":"CSDM/CIS trap. Query the right ancestor. Relationships still live in cmdb_rel_ci.","multi":false},{"id":"cmdb-t02","title":"IRE vs GlideRecord insert","difficulty":"hard","format":"theory","kind":"theory","prompt":"Discovery-quality uniqueness: two payloads with the same serial for a server. What happens with naive insert vs IRE?","options":[{"id":"a","text":"GlideRecord insert always coalesces on serial_number OOTB"},{"id":"b","text":"Blind insert creates duplicates; IdentificationEngine uses identification rules (hardware rule: serial, etc.) and reconciliation to update the right CI and set discovery_source"},{"id":"c","text":"IRE only works for users, not CIs"},{"id":"d","text":"addQuery(\"name\") is equivalent to IRE"}],"answer":"b","explanation":"Never integration-insert cmdb_ci_* for authoritative sources. IRE JSON items[].className + values + lookup. Reconciliation decides which source wins a field.","multi":false},{"id":"cmdb-t03","title":"Identification vs reconciliation","difficulty":"hard","format":"theory","kind":"theory","prompt":"Identification succeeded but a field didn’t update from SCCM. Why?","options":[{"id":"a","text":"IRE cannot update fields"},{"id":"b","text":"Reconciliation rules / data source precedence blocked that field from that source; identification only found the CI"},{"id":"c","text":"You forgot g_form.save()"},{"id":"d","text":"serial_number is not a field"}],"answer":"b","explanation":"Two engines. Interview: “duplicate CI” vs “stale field.” Different consoles (CI Class Manager identification vs recon).","multi":false},{"id":"cmdb-t04","title":"Dependent identification","difficulty":"hard","format":"theory","kind":"theory","prompt":"An application CI is identified by name + running on a specific server. If you only send name, IRE may create duplicates. Why?","options":[{"id":"a","text":"Applications cannot be CIs"},{"id":"b","text":"Dependent identity uses parent/host lookup rules; incomplete relationship payload fails uniqueness"},{"id":"c","text":"Name is always globally unique in CMDB"},{"id":"d","text":"Use problem_id to identify apps"}],"answer":"b","explanation":"IRE payload must include related items (Runs on::Runs) when rules are dependent. Community duplicate-app-CI epidemic.","multi":false},{"id":"cmdb-t05","title":"cmdb_rel_ci direction","difficulty":"hard","format":"theory","kind":"theory","prompt":"Parent = App, Child = Server, type = Runs on::Runs. Is that the OOTB semantic everyone uses?","options":[{"id":"a","text":"Direction is arbitrary and never documented"},{"id":"b","text":"Type is directional (Runs on vs Runs); reversing parent/child inverts the graph and breaks impact/change conflict. Always verify the type’s parent/child descriptors"},{"id":"c","text":"You should store both directions as two rows always"},{"id":"d","text":"Relationships are stored on incident"}],"answer":"b","explanation":"Impact calculation and service mapping assume a direction. Wrong direction = wrong blast radius on a change.","multi":false},{"id":"cmdb-t06","title":"Health dashboard duplicate vs orphan","difficulty":"hard","format":"theory","kind":"theory","prompt":"Orphan vs duplicate in CMDB Health mean?","options":[{"id":"a","text":"The same thing"},{"id":"b","text":"Duplicates fail identification uniqueness; orphans fail expected relationships/required fields (depends on health metric) — different remediations"},{"id":"c","text":"Orphans are always retired CIs"},{"id":"d","text":"Duplicates are only name collisions in Excel"}],"answer":"b","explanation":"CIS/CSDM operations. Don’t run deleteMultiple on all “orphans” without reading the metric definition.","multi":false},{"id":"cmdb-t07","title":"Querying a class","difficulty":"hard","format":"theory","kind":"theory","prompt":"GlideRecord(\"cmdb_ci_server\") vs GlideRecord(\"cmdb_ci\") + addQuery(\"sys_class_name\", \"cmdb_ci_linux_server\"). Difference?","options":[{"id":"a","text":"Identical always"},{"id":"b","text":"Querying the class table uses the hierarchy (includes extensions); sys_class_name equals a leaf class excludes other server subclasses unless you use IN or INSTANCEOF-style patterns"},{"id":"c","text":"sys_class_name cannot be queried"},{"id":"d","text":"The class table cannot be queried with addQuery"}],"answer":"b","explanation":"INSTANCEOF / table API. Interview: linux vs windows both servers. Wrong filter drops a fleet.","multi":false},{"id":"cmdb-t08","title":"Principal class / CSDM","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why not put a business application as cmdb_ci_linux_server?","options":[{"id":"a","text":"You should; one class is simpler"},{"id":"b","text":"CSDM separates Application Service / Business App / Technical CI. Wrong class breaks service mapping, IRE rules, and ITSM referencing"},{"id":"c","text":"Business apps cannot have relationships"},{"id":"d","text":"Linux servers cannot be operational"}],"answer":"b","explanation":"CSDM is on CIS-ITSM now. Class choice is a design decision, not a label.","multi":false},{"id":"cmdb-t09","title":"setWorkflow on CI updates","difficulty":"hard","format":"theory","kind":"theory","prompt":"Data fix sets install_status=7 on 10k CIs with setWorkflow(false). What did you skip that ITSM might need?","options":[{"id":"a","text":"Nothing important"},{"id":"b","text":"BR/flows that retire relationships, notify support groups, sync assets, or fire cmdb events — plus audit/updated_on if autoSysFields(false)"},{"id":"c","text":"IRE identification always still runs"},{"id":"d","text":"Client scripts on cmdb_ci will still run"}],"answer":"b","explanation":"Bulk CMDB hygiene vs process. Sometimes you want engines; sometimes you don’t. Say it out loud in the interview.","multi":false},{"id":"cmdb-t10","title":"Asset-CI sync","difficulty":"hard","format":"theory","kind":"theory","prompt":"alm_asset.ci points to a CI; assigned_to diverges. Typical cause?","options":[{"id":"a","text":"They cannot be linked"},{"id":"b","text":"One-direction BRs, import that updates only one side, or model not using the asset-CI field service"},{"id":"c","text":"assigned_to on CI is not a field"},{"id":"d","text":"IRE deletes assets nightly"}],"answer":"b","explanation":"ITSM + HAM. Know which product owns assignment. Dual-write without a source of truth = tickets assigned to the wrong person.","multi":false},{"id":"cmdb-t11","title":"Ref qualification on incident.cmdb_ci","difficulty":"hard","format":"theory","kind":"theory","prompt":"Users pick retired CIs. Best control?","options":[{"id":"a","text":"Client script only that alerts after submit"},{"id":"b","text":"Reference qualifier / dictionary advanced qualifier excluding operational_status/install_status, plus a server Data Policy/BR — UI-only filters are bypassed by imports"},{"id":"c","text":"Delete all retired CIs nightly"},{"id":"d","text":"Hide cmdb_ci from itil"}],"answer":"b","explanation":"Qualifiers are UX. Imports and REST still need server rules.","multi":false},{"id":"cmdb-t12","title":"Dynamic CI groups vs static","difficulty":"hard","format":"theory","kind":"theory","prompt":"Change conflict on an application service. Why include related CIs?","options":[{"id":"a","text":"Conflict only looks at the one reference field"},{"id":"b","text":"Impacted services/CI relations expand the conflict set; a service CI without relations looks “clean” and is a false negative"},{"id":"c","text":"Conflict detection ignores CMDB"},{"id":"d","text":"Only alm_hardware participates in conflict"}],"answer":"b","explanation":"Populate relations or use service mapping. Empty graph = useless collision detection.","multi":false},{"id":"cmdb-t13","title":"createOrUpdateCI source string","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why does IdentificationEngine.createOrUpdateCI(\"ServiceNow\", json) vs \"SCCM\" matter?","options":[{"id":"a","text":"The string is comments only"},{"id":"b","text":"It is the discovery/reconciliation source name used in rules and cmdb_ci.discovery_source — wrong source applies wrong precedence"},{"id":"c","text":"It must always be the MID name"},{"id":"d","text":"It must be a sys_id"}],"answer":"b","explanation":"Match the Data Source record. Typos = unidentified inserts or fields that never win.","multi":false},{"id":"cmdb-t14","title":"GlideRecordSecure on CMDB","difficulty":"hard","format":"theory","kind":"theory","prompt":"An integration user needs to update IPs but not HR CIs. Pattern?","options":[{"id":"a","text":"Run as admin and hope"},{"id":"b","text":"Dedicated integration user + ACLs on classes + GlideRecordSecure in scripted APIs; don’t use maint/admin in REST"},{"id":"c","text":"Query BRs are the only control"},{"id":"d","text":"cmdb_ci has no ACLs OOTB so none can be added"}],"answer":"b","explanation":"Least privilege. Class-level ACLs. IRE still needs a user that can write the target class.","multi":false},{"id":"cmdb-t15","title":"deleteMultiple relationships","difficulty":"hard","format":"theory","kind":"theory","prompt":"Retiring a server, deleteMultiple on cmdb_rel_ci where parent OR child = ci. What can you destroy?","options":[{"id":"a","text":"Only that server’s rows if the encoded query is correct — still: service maps, app Runs-on, and reverse relations; consider end-dating vs delete for history"},{"id":"b","text":"The entire CMDB always"},{"id":"c","text":"Nothing; deleteMultiple is blocked on cmdb_rel_ci"},{"id":"d","text":"Only orphan duplicates"}],"answer":"a","explanation":"Query must be precise. Some shops expire relationships instead of delete for forensic graphs. Never run unfiltered deleteMultiple in a fix script.","multi":false}]},{"id":"asset","title":"Asset Management","blurb":"Hardware and software assets, stock, assignment, and lifecycle in ITSM.","questions":[{"id":"ast-01","title":"Query in-stock hardware","difficulty":"easy","kind":"server","prompt":"Query alm_hardware where install_status is 6 (In stock). Log asset_tag.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('alm_hardware');\ngr.addQuery('install_status', '6');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('asset_tag'));\n}","checks":[{"type":"includes","value":"new GlideRecord('alm_hardware')","message":"Hardware assets"},{"type":"includes","value":"addQuery('install_status', '6')","message":"In stock"},{"type":"includes","value":"asset_tag","message":"Log asset tag"}]},{"id":"ast-02","title":"Create a hardware asset","difficulty":"easy","kind":"server","prompt":"Insert alm_hardware with display_name \"Laptop\", asset_tag \"AST-1001\", serial_number \"SN9\", install_status 1 (In use).","starter":"// Write your ServiceNow script below\n","solution":"var ast = new GlideRecord('alm_hardware');\nast.initialize();\nast.setValue('display_name', 'Laptop');\nast.setValue('asset_tag', 'AST-1001');\nast.setValue('serial_number', 'SN9');\nast.setValue('install_status', '1');\nast.insert();","checks":[{"type":"includes","value":"new GlideRecord('alm_hardware')","message":"alm_hardware"},{"type":"includes","value":"AST-1001","message":"Asset tag"},{"type":"includes","value":"SN9","message":"Serial"},{"type":"includes","value":"insert()","message":"Insert"}]},{"id":"ast-03","title":"Assign asset to a user","difficulty":"easy","kind":"server","prompt":"Load alm_asset by asset_tag AST-1001, set assigned_to to user sys_id userId, install_status 1, update.","starter":"var userId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var userId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar ast = new GlideRecord('alm_asset');\nif (ast.get('asset_tag', 'AST-1001')) {\n  ast.setValue('assigned_to', userId);\n  ast.setValue('install_status', '1');\n  ast.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('alm_asset')","message":"alm_asset"},{"type":"includes","value":"AST-1001","message":"Lookup tag"},{"type":"includes","value":"assigned_to","message":"Assign user"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"ast-04","title":"Abort retire without substatus","difficulty":"intermediate","kind":"business_rule","prompt":"If install_status changes to 7 (Retired) and substatus is empty, abort with an error.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.install_status.changesTo('7') && current.substatus.nil()) {\n    gs.addErrorMessage('Select a retire substatus.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('7')","message":"Retired"},{"type":"oneOf","values":["substatus.nil()","getValue('substatus')"],"message":"Substatus"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"ast-05","title":"Sync CI from asset","difficulty":"intermediate","kind":"business_rule","prompt":"When assigned_to changes, if ci is not empty, load cmdb_ci and set assigned_to to the same user, then update the CI with setWorkflow(false).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.assigned_to.changes() && !current.ci.nil()) {\n    var ci = new GlideRecord('cmdb_ci');\n    if (ci.get(current.getValue('ci'))) {\n      ci.setValue('assigned_to', current.getValue('assigned_to'));\n      ci.setWorkflow(false);\n      ci.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"assigned_to.changes()","message":"Watch assigned_to"},{"type":"includes","value":"new GlideRecord('cmdb_ci')","message":"Update CI"},{"type":"includes","value":"setWorkflow(false)","message":"Avoid loops"}]},{"id":"ast-06","title":"Count assets by model","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate COUNT alm_asset groupBy model. Log model and count.","starter":"// Write your ServiceNow script below\n","solution":"var ga = new GlideAggregate('alm_asset');\nga.addAggregate('COUNT');\nga.groupBy('model');\nga.query();\nwhile (ga.next()) {\n  gs.info(ga.getValue('model') + ' ' + ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('alm_asset')","message":"Aggregate assets"},{"type":"includes","value":"groupBy('model')","message":"By model"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"}]},{"id":"ast-07","title":"Client: cost mandatory when in use","difficulty":"easy","kind":"client","prompt":"onChange install_status: if newValue is 1, setMandatory cost true else false.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setMandatory('cost', newValue == '1');\n}","checks":[{"type":"includes","value":"g_form.setMandatory('cost'","message":"Mandatory cost"},{"type":"oneOf","values":["newValue == '1'","newValue === '1'"],"message":"In use"}]},{"id":"ast-08","title":"Find duplicate serial numbers","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate alm_hardware COUNT groupBy serial_number, addAggregate COUNT, then you cannot easily HAVING in SN—after query, if parseInt(getAggregate COUNT) > 1 log the serial_number. Skip empty serials with addNotNullQuery.","starter":"// Write your ServiceNow script below\n","solution":"var ga = new GlideAggregate('alm_hardware');\nga.addNotNullQuery('serial_number');\nga.addAggregate('COUNT');\nga.groupBy('serial_number');\nga.query();\nwhile (ga.next()) {\n  if (parseInt(ga.getAggregate('COUNT'), 10) > 1) {\n    gs.info(ga.getValue('serial_number'));\n  }\n}","checks":[{"type":"includes","value":"new GlideAggregate('alm_hardware')","message":"Hardware aggregate"},{"type":"includes","value":"groupBy('serial_number')","message":"Group serial"},{"type":"includes","value":"addNotNullQuery('serial_number')","message":"Skip empty"},{"type":"includes","value":"parseInt","message":"Compare count"}]},{"id":"ast-09","title":"Event asset.assigned","difficulty":"easy","kind":"business_rule","prompt":"When assigned_to changes to a non-empty value, queue asset.assigned with parm1 = asset_tag.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.assigned_to.changes() && !current.assigned_to.nil()) {\n    gs.eventQueue('asset.assigned', current, current.getValue('asset_tag'), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.eventQueue","message":"eventQueue"},{"type":"includes","value":"asset.assigned","message":"Event name"},{"type":"includes","value":"asset_tag","message":"Parm asset_tag"}]},{"id":"ast-10","title":"GlideAjax getAssetUser","difficulty":"intermediate","kind":"script_include","prompt":"AssetAjax.assignedUser reads sysparm_tag, get alm_asset by asset_tag, return assigned_to.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var AssetAjax = Class.create();\nAssetAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  assignedUser: function() {\n    var tag = this.getParameter('sysparm_tag');\n    var ast = new GlideRecord('alm_asset');\n    if (ast.get('asset_tag', tag)) {\n      return ast.getValue('assigned_to');\n    }\n    return '';\n  },\n  type: 'AssetAjax'\n});","checks":[{"type":"includes","value":"assignedUser","message":"Method"},{"type":"includes","value":"getParameter('sysparm_tag')","message":"sysparm_tag"},{"type":"includes","value":"get('asset_tag'","message":"Lookup tag"},{"type":"includes","value":"assigned_to","message":"Return assigned_to"}]},{"id":"ast-11","title":"Return to stock","difficulty":"easy","kind":"server","prompt":"For asset astId, clear assigned_to, set install_status to 6 (In stock), update.","starter":"var astId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var astId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar ast = new GlideRecord('alm_asset');\nif (ast.get(astId)) {\n  ast.setValue('assigned_to', '');\n  ast.setValue('install_status', '6');\n  ast.update();\n}","checks":[{"type":"includes","value":"assigned_to","message":"Clear assigned_to"},{"type":"regex","value":{"__regex":true,"source":"install_status['\"]\\s*,\\s*['\"]6['\"]","flags":""},"message":"In stock"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"ast-12","title":"onSubmit: require stockroom when in stock","difficulty":"easy","kind":"client","prompt":"If install_status is 6 and stockroom is empty, addErrorMessage and return false.","starter":"function onSubmit() {\n  return true;\n}\n","solution":"function onSubmit() {\n  if (g_form.getValue('install_status') == '6' && !g_form.getValue('stockroom')) {\n    g_form.addErrorMessage('Stockroom is required for in-stock assets.');\n    return false;\n  }\n  return true;\n}","checks":[{"type":"includes","value":"install_status","message":"Status"},{"type":"includes","value":"stockroom","message":"Stockroom"},{"type":"includes","value":"return false","message":"Block"}]},{"id":"ast-13","title":"Encoded query: warranty expired","difficulty":"intermediate","kind":"server","prompt":"Query alm_hardware addEncodedQuery warranty_expiration\u003cjavascript:gs.now()^install_status=1. Log asset_tag.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('alm_hardware');\ngr.addEncodedQuery('warranty_expiration\u003cjavascript:gs.now()^install_status=1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('asset_tag'));\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"warranty_expiration","message":"Warranty"},{"type":"includes","value":"install_status=1","message":"In use"}]},{"id":"ast-14","title":"Link asset to incident CI","difficulty":"easy","kind":"server","prompt":"Load incident incId; if cmdb_ci is set, query alm_asset where ci equals that value and gs.info asset_tag of each.","starter":"var incId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var incId = 'cccccccccccccccccccccccccccccccc';\nvar inc = new GlideRecord('incident');\nif (inc.get(incId) && inc.getValue('cmdb_ci')) {\n  var ast = new GlideRecord('alm_asset');\n  ast.addQuery('ci', inc.getValue('cmdb_ci'));\n  ast.query();\n  while (ast.next()) {\n    gs.info(ast.getValue('asset_tag'));\n  }\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Incident"},{"type":"includes","value":"new GlideRecord('alm_asset')","message":"Assets"},{"type":"includes","value":"addQuery('ci'","message":"Match CI"}]},{"id":"ast-15","title":"Bulk retire by model","difficulty":"intermediate","kind":"server","prompt":"Query alm_asset where model is modelId, set install_status 7, updateMultiple (also set substatus disposed if the field exists—set substatus to disposed before updateMultiple).","starter":"var modelId = 'dddddddddddddddddddddddddddddddd';\n","solution":"var modelId = 'dddddddddddddddddddddddddddddddd';\nvar ast = new GlideRecord('alm_asset');\nast.addQuery('model', modelId);\nast.setValue('install_status', '7');\nast.setValue('substatus', 'disposed');\nast.updateMultiple();","checks":[{"type":"includes","value":"addQuery('model', modelId)","message":"Filter model"},{"type":"includes","value":"setValue('install_status', '7')","message":"Retire"},{"type":"includes","value":"updateMultiple()","message":"Bulk update"},{"type":"includes","value":"disposed","message":"Substatus"}]},{"id":"ast-16","title":"Prevent delete of in-use asset","difficulty":"easy","kind":"business_rule","prompt":"Before delete, if install_status is 1, abort with an error.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.getValue('install_status') == '1') {\n    gs.addErrorMessage('Return the asset to stock before deleting.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"install_status","message":"Check status"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"},{"type":"includes","value":"gs.addErrorMessage","message":"Error"}]}],"theory":[{"id":"ast-t01","title":"HAM vs CMDB ownership","difficulty":"hard","format":"theory","kind":"theory","prompt":"Finance says the laptop is assigned to Alice; ITSM incidents still show Bob on the CI. Interview diagnosis?","options":[{"id":"a","text":"Assets and CIs cannot represent the same device"},{"id":"b","text":"Split-brain: HAM assigned_to vs cmdb_ci.assigned_to not syncing (BR direction, import, or model). Pick a source of truth and sync one way"},{"id":"c","text":"assigned_to on CI is always copied from caller_id of the latest incident"},{"id":"d","text":"You must delete the CI so the asset wins"}],"answer":"b","explanation":"HAM (alm_asset) is financial/lifecycle. CMDB is operational. OOTB field service may create/sync CI. Custom imports often update one table. Tickets use cmdb_ci.","multi":false},{"id":"ast-t02","title":"install_status vs operational_status vs stockroom","difficulty":"hard","format":"theory","kind":"theory","prompt":"Asset In stock (6) still has a stockroom empty and CI Operational. What’s wrong with process, not just fields?","options":[{"id":"a","text":"In stock does not require stockroom in any design"},{"id":"b","text":"In stock should be in a stockroom and usually not “in use” operationally; CI operational_status should be aligned or you will assign incidents to shelf hardware"},{"id":"c","text":"operational_status is only for knowledge articles"},{"id":"d","text":"Status 6 means Retired in all tables"}],"answer":"b","explanation":"Choice values differ by table. Don’t memorize 6 without the label. Design: stock + not assigned_to + CI not operational.","multi":false},{"id":"ast-t03","title":"updateMultiple retire by model","difficulty":"hard","format":"theory","kind":"theory","prompt":"Fix script: alm_asset addQuery model, set install_status 7, updateMultiple. Audit later shows serials vanished from reports of in-use assets but HAM contracts still bill. Issue?","options":[{"id":"a","text":"updateMultiple cannot set install_status"},{"id":"b","text":"You skipped substatus/disposal date/CI sync/contract assets; bulk engine skip may also skip HAM life-cycle flows that notify finance"},{"id":"c","text":"Models cannot be queried"},{"id":"d","text":"Retired assets are deleted by OOTB nightly"}],"answer":"b","explanation":"HAM has more than install_status. Asset tasks, depreciation, contract_rel. setWorkflow(false) makes it worse. Interview: data fix vs process.","multi":false},{"id":"ast-t04","title":"Duplicate serial_number","difficulty":"hard","format":"theory","kind":"theory","prompt":"GlideAggregate COUNT > 1 on serial_number. Two hardware assets, one CI. What next, not just “merge”?","options":[{"id":"a","text":"deleteMultiple the CI"},{"id":"b","text":"Determine which asset is the financial record, retire/duplicate-handle the other, and run IRE/identification on the CI serial so discovery doesn’t keep splitting"},{"id":"c","text":"Serial duplicates are allowed if names differ, so ignore"},{"id":"d","text":"Put both sys_ids in incident.cmdb_ci"}],"answer":"b","explanation":"Duplicates are often one stolen/replaced device plus a bad import. IRE hardware rule uses serial — two assets fighting one identity.","multi":false},{"id":"ast-t05","title":"Consumables vs hardware","difficulty":"hard","format":"theory","kind":"theory","prompt":"Ordering mice from catalog creates alm_hardware with unique serials empty. Better class?","options":[{"id":"a","text":"Always hardware for anything physical"},{"id":"b","text":"Consumable/alm_consumable (quantity) vs hardware (serialized). Wrong class breaks inventory counts and assignment"},{"id":"c","text":"Mice must be cmdb_ci_linux_server"},{"id":"d","text":"Catalog cannot create assets"}],"answer":"b","explanation":"HAM models: hardware, consumable, software entitlement (SAM). Interview if they say “everything is alm_hardware.”","multi":false},{"id":"ast-t06","title":"Reference qualifier stockroom","difficulty":"hard","format":"theory","kind":"theory","prompt":"Users pick a stockroom from another building when install_status=In stock. Control?","options":[{"id":"a","text":"Email them"},{"id":"b","text":"Mandatory stockroom Data Policy when in stock + qualifier on stockroom (location/building) + server BR; client-only is bypassed by mobile/import"},{"id":"c","text":"Hide stockroom forever"},{"id":"d","text":"Stockroom is a journal"}],"answer":"b","explanation":"Same UI vs server lesson as incident mandatory fields.","multi":false},{"id":"ast-t07","title":"Warranty encoded query","difficulty":"hard","format":"theory","kind":"theory","prompt":"warranty_expiration\u003cjavascript:gs.now() in a scheduled job. DST/timezone complaint from AU vs US?","options":[{"id":"a","text":"javascript: in encoded query is illegal"},{"id":"b","text":"gs.now()/nowDateTime() vs date-only fields and instance TZ vs user TZ; compare using GlideDateTime at start-of-day in a defined TZ or date field operators"},{"id":"c","text":"Warranty dates cannot be queried"},{"id":"d","text":"Only GlideAggregate can read warranty_expiration"}],"answer":"b","explanation":"glide_date vs glide_date_time. Community threads on “expired yesterday in US, still valid in AU.”","multi":false},{"id":"ast-t08","title":"Asset task vs incident","difficulty":"hard","format":"theory","kind":"theory","prompt":"Broken laptop: incident vs asset task vs change. How do you decide in ITSM+HAM?","options":[{"id":"a","text":"Always incident only"},{"id":"b","text":"Incident restores the user’s service; asset/repair task tracks the device lifecycle; a change if the fix is a controlled modification to a shared CI"},{"id":"c","text":"Always change_request"},{"id":"d","text":"Never incident if an asset exists"}],"answer":"b","explanation":"Three tickets can be correct. Link them (CI/asset refs). Don’t force one table.","multi":false},{"id":"ast-t09","title":"coalesce on import","difficulty":"hard","format":"theory","kind":"theory","prompt":"Transform map coalesce on asset_tag. Excel has blank tags. Result?","options":[{"id":"a","text":"Rows with blank coalesce keys often collapse into one target or insert unpredictably — filter/ignore in onBefore when tag is empty"},{"id":"b","text":"Blank coalesce always creates perfect unique rows"},{"id":"c","text":"Coalesce ignores empty by deleting the row from Excel"},{"id":"d","text":"You cannot coalesce on asset_tag"}],"answer":"a","explanation":"Community import interview: empty coalesce key is a foot-gun. Combine with coalesce case-sensitive option if tags differ by case.","multi":false},{"id":"ast-t10","title":"GlideRecordSecure HAM","difficulty":"hard","format":"theory","kind":"theory","prompt":"Contractor with sn_eam roles sees costs. How?","options":[{"id":"a","text":"cost has no ACLs possible"},{"id":"b","text":"Field-level ACL / data policy / encryption; also list vs form. Scripted reports using GlideRecord as admin bypass UI field ACLs"},{"id":"c","text":"Hide the field with CSS only"},{"id":"d","text":"Cost is always in g_scratchpad"}],"answer":"b","explanation":"Financial fields need field ACLs. Widgets that query as a privileged user leak cost.","multi":false},{"id":"ast-t11","title":"CI class vs asset model category","difficulty":"hard","format":"theory","kind":"theory","prompt":"Creating a CI from asset uses the model’s CI class. Wrong class selected on the model. Symptom?","options":[{"id":"a","text":"No CI is ever created"},{"id":"b","text":"IRE/health rules for the intended class never apply; attributes missing; discovery may create a second CI of the right class"},{"id":"c","text":"The asset is deleted"},{"id":"d","text":"Serial number is cleared"}],"answer":"b","explanation":"Model category → CI class mapping is HAM+CMDB glue. Fix the model, don’t keep scripting class in a BR.","multi":false},{"id":"ast-t12","title":"In use without assigned_to","difficulty":"hard","format":"theory","kind":"theory","prompt":"Should a BR abort install_status=1 when assigned_to is empty?","options":[{"id":"a","text":"Never; shared infrastructure assets (racks, UPSs) may be In use without a person"},{"id":"b","text":"Always abort; HAM forbids it"},{"id":"c","text":"Only abort on alm_consumable"},{"id":"d","text":"assigned_to is mandatory at dictionary level OOTB for all assets"}],"answer":"a","explanation":"Process nuance. Laptops yes; datacenter hardware no. Condition the BR on model category.","multi":false},{"id":"ast-t13","title":"Retirement and licenses","difficulty":"hard","format":"theory","kind":"theory","prompt":"Retiring a workstation asset but SAM still counts an install. Why?","options":[{"id":"a","text":"SAM always uses alm_hardware.install_status only"},{"id":"b","text":"Software installations/discovery on the CI may still be active; retire the CI/uninstall or SAM will keep entitlements consumed"},{"id":"c","text":"Retirement deletes all cmdb_sam tables"},{"id":"d","text":"You must use SOAP to notify SAM"}],"answer":"b","explanation":"HAM retire ≠ SAM uninstall. Cross-product interview.","multi":false},{"id":"ast-t14","title":"Stockroom transfer","difficulty":"hard","format":"theory","kind":"theory","prompt":"Two-step transfer (in transit) vs direct stockroom change on the record. Why do HAM people care?","options":[{"id":"a","text":"No difference"},{"id":"b","text":"In-transit states keep inventory accurate and audit who held the device; a silent stockroom overwrite loses chain of custody"},{"id":"c","text":"Stockroom cannot change after insert"},{"id":"d","text":"Transfers are only catalog items"}],"answer":"b","explanation":"Asset audits fail when techs edit stockroom like a string field.","multi":false},{"id":"ast-t15","title":"Event asset.assigned","difficulty":"hard","format":"theory","kind":"theory","prompt":"You fire gs.eventQueue on assigned_to change but emails go to the previous user. Cause?","options":[{"id":"a","text":"Events cannot include parm1"},{"id":"b","text":"BR After vs Before: parm built from previous vs current; notification uses event parm or current at send time — classic off-by-one on who is “new assignee”"},{"id":"c","text":"assigned_to cannot be in events"},{"id":"d","text":"You must use SOAPMessageV2 for email"}],"answer":"b","explanation":"After BR sees committed current. If the notification script reads previous, you notify the wrong person. Print both sys_ids in the event parms explicitly.","multi":false}]},{"id":"sla","title":"SLA Management","blurb":"Task SLAs, breach handling, pause conditions, and notifications.","questions":[{"id":"sla-01","title":"Query breached task SLAs","difficulty":"easy","kind":"server","prompt":"Query task_sla where has_breached is true and stage is in_progress. Log the task display (task.getDisplayValue) or task field.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('task_sla');\ngr.addQuery('has_breached', true);\ngr.addQuery('stage', 'in_progress');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getDisplayValue('task'));\n}","checks":[{"type":"includes","value":"new GlideRecord('task_sla')","message":"task_sla"},{"type":"includes","value":"has_breached","message":"Breached"},{"type":"includes","value":"addQuery('stage', 'in_progress')","message":"In progress"}]},{"id":"sla-02","title":"Count open SLAs for an incident","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate COUNT task_sla where task = incId and stage != complete. Log count. Use addQuery stage != completed or stage=in_progress. Filter task = incId.","starter":"var incId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var incId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar ga = new GlideAggregate('task_sla');\nga.addQuery('task', incId);\nga.addQuery('stage', '!=', 'completed');\nga.addAggregate('COUNT');\nga.query();\nif (ga.next()) {\n  gs.info(ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('task_sla')","message":"Aggregate task_sla"},{"type":"includes","value":"addQuery('task', incId)","message":"For the incident"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"}]},{"id":"sla-03","title":"On breach escalate assignment group","difficulty":"intermediate","kind":"business_rule","prompt":"After update on task_sla: if has_breached changes to true, load the task incident and set escalation to 1, then update the task.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.has_breached.changesTo('true')) {\n    var task = new GlideRecord('incident');\n    if (task.get(current.getValue('task'))) {\n      task.setValue('escalation', '1');\n      task.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('true')","message":"Newly breached"},{"type":"includes","value":"has_breached","message":"has_breached"},{"type":"includes","value":"setValue('escalation', '1')","message":"Escalate"},{"type":"includes","value":"update()","message":"Update task"}]},{"id":"sla-04","title":"Queue sla.breached event","difficulty":"easy","kind":"business_rule","prompt":"When has_breached changes to true, gs.eventQueue sla.breached on current with parm1 = task number display.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.has_breached.changesTo('true')) {\n    gs.eventQueue('sla.breached', current, current.task.getDisplayValue(), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.eventQueue","message":"eventQueue"},{"type":"includes","value":"sla.breached","message":"Event name"},{"type":"includes","value":"has_breached","message":"Breach field"}]},{"id":"sla-05","title":"Pause SLA when on hold","difficulty":"intermediate","kind":"server","prompt":"This is a script snippet for a pause condition: return true if incident state is On Hold (3). Read current.state in a script that sets answer. Use answer = (current.getValue(\"state\") == \"3\");","starter":"// Write your ServiceNow script below\n","solution":"answer = current.getValue('state') == '3';","checks":[{"type":"includes","value":"answer","message":"Set answer"},{"type":"includes","value":"getValue('state')","message":"Read state"},{"type":"regex","value":{"__regex":true,"source":"==\\s*['\"]3['\"]","flags":""},"message":"On Hold is 3"}]},{"id":"sla-06","title":"List contract SLAs for P1","difficulty":"easy","kind":"server","prompt":"Query contract_sla (or sla) table contract_sla where duration is not empty and name contains P1. Use addQuery name CONTAINS P1. Log name.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('contract_sla');\ngr.addQuery('name', 'CONTAINS', 'P1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('name'));\n}","checks":[{"type":"includes","value":"new GlideRecord('contract_sla')","message":"SLA definitions"},{"type":"includes","value":"P1","message":"P1 SLAs"},{"type":"includes","value":"addQuery('name', 'CONTAINS', 'P1')","message":"CONTAINS query"}]},{"id":"sla-07","title":"Client: warn when SLA breached","difficulty":"easy","kind":"client","prompt":"onLoad: if g_form.getValue(\"made_sla\") is false, addErrorMessage that an SLA was missed.","starter":"function onLoad() {\n\n}\n","solution":"function onLoad() {\n  if (g_form.getValue('made_sla') == 'false') {\n    g_form.addErrorMessage('This task missed its SLA.');\n  }\n}","checks":[{"type":"includes","value":"g_form.getValue('made_sla')","message":"made_sla"},{"type":"includes","value":"g_form.addErrorMessage","message":"Error message"}]},{"id":"sla-08","title":"Percentage used threshold","difficulty":"intermediate","kind":"server","prompt":"Query task_sla where percentage >= 75 and stage is in_progress. Log task and percentage.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('task_sla');\ngr.addQuery('percentage', '>=', 75);\ngr.addQuery('stage', 'in_progress');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('task') + ' ' + gr.getValue('percentage'));\n}","checks":[{"type":"includes","value":"new GlideRecord('task_sla')","message":"task_sla"},{"type":"includes","value":"percentage","message":"percentage"},{"type":"includes","value":"'>='","message":"At least 75"}]},{"id":"sla-09","title":"Reset business elapsed after reopen","difficulty":"intermediate","kind":"business_rule","prompt":"On incident, when state changes from 6 (Resolved) to 2 (In Progress), log \"SLA_RESTART\" with gs.info. (Repair scripts would cancel task_sla; here just detect reopen.)","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesFrom('6') && current.getValue('state') == '2') {\n    gs.info('SLA_RESTART');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesFrom('6')","message":"Left Resolved"},{"type":"regex","value":{"__regex":true,"source":"state['\"]\\)\\s*==\\s*['\"]2['\"]|getValue\\('state'\\) == '2'","flags":""},"message":"Now In Progress"},{"type":"includes","value":"SLA_RESTART","message":"Log marker"}]},{"id":"sla-10","title":"GlideAjax remaining time","difficulty":"intermediate","kind":"script_include","prompt":"SlaAjax.remaining reads sysparm_task, finds first task_sla in_progress, returns planned_end_time getDisplayValue.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var SlaAjax = Class.create();\nSlaAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  remaining: function() {\n    var task = this.getParameter('sysparm_task');\n    var sla = new GlideRecord('task_sla');\n    sla.addQuery('task', task);\n    sla.addQuery('stage', 'in_progress');\n    sla.setLimit(1);\n    sla.query();\n    if (sla.next()) {\n      return sla.getDisplayValue('planned_end_time');\n    }\n    return '';\n  },\n  type: 'SlaAjax'\n});","checks":[{"type":"includes","value":"remaining","message":"Method"},{"type":"includes","value":"getParameter('sysparm_task')","message":"sysparm_task"},{"type":"includes","value":"new GlideRecord('task_sla')","message":"task_sla"},{"type":"includes","value":"planned_end_time","message":"End time"}]},{"id":"sla-11","title":"onChange: hold reason mandatory","difficulty":"easy","kind":"client","prompt":"onChange state: if newValue is 3, setMandatory hold_reason true.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setMandatory('hold_reason', newValue == '3');\n}","checks":[{"type":"includes","value":"g_form.setMandatory('hold_reason'","message":"hold_reason"},{"type":"regex","value":{"__regex":true,"source":"newValue\\s*==\\s*['\"]3['\"]","flags":""},"message":"On Hold"}]},{"id":"sla-12","title":"Encoded query: breached today","difficulty":"intermediate","kind":"server","prompt":"task_sla addEncodedQuery has_breached=true^breached_onONToday. Log sys_id.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('task_sla');\ngr.addEncodedQuery('has_breached=true^breached_onONToday');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getUniqueValue());\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"has_breached=true","message":"Breached"},{"type":"includes","value":"breached_onONToday","message":"Today"}]},{"id":"sla-13","title":"Stop SLAs on cancel","difficulty":"intermediate","kind":"server","prompt":"For task incId, query task_sla stage in_progress, set stage to cancelled and update each (setWorkflow false).","starter":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar sla = new GlideRecord('task_sla');\nsla.addQuery('task', incId);\nsla.addQuery('stage', 'in_progress');\nsla.query();\nwhile (sla.next()) {\n  sla.setValue('stage', 'cancelled');\n  sla.setWorkflow(false);\n  sla.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('task_sla')","message":"task_sla"},{"type":"includes","value":"setValue('stage', 'cancelled')","message":"Cancelled"},{"type":"includes","value":"setWorkflow(false)","message":"setWorkflow"}]},{"id":"sla-14","title":"Duration display with GlideDuration","difficulty":"intermediate","kind":"server","prompt":"Create GlideDuration from business_percentage is wrong. Instead: var d = new GlideDuration(current.duration); gs.info(d.getDayPart()); Assume you have ms in variable ms. Log getDurationValue().","starter":"var ms = 3600000;\n","solution":"var ms = 3600000;\nvar d = new GlideDuration(ms);\ngs.info(d.getDurationValue());","checks":[{"type":"includes","value":"new GlideDuration","message":"GlideDuration"},{"type":"includes","value":"getDurationValue()","message":"Display duration"}]},{"id":"sla-15","title":"Made SLA flag","difficulty":"easy","kind":"business_rule","prompt":"When incident state changes to 6 or 7, if any related task_sla has_breached true, set made_sla to false else true.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('6') || current.state.changesTo('7')) {\n    var sla = new GlideRecord('task_sla');\n    sla.addQuery('task', current.getUniqueValue());\n    sla.addQuery('has_breached', true);\n    sla.setLimit(1);\n    sla.query();\n    current.setValue('made_sla', sla.hasNext() ? false : true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('task_sla')","message":"task_sla"},{"type":"includes","value":"has_breached","message":"Breach check"},{"type":"includes","value":"made_sla","message":"Set made_sla"}]},{"id":"sla-16","title":"Schedule window using GlideDateTime","difficulty":"intermediate","kind":"server","prompt":"If now is after a breach GlideDateTime stored in breachAt (string UTC), gs.info(\"BREACHED\") else gs.info(\"OK\"). Use compareTo.","starter":"var breachAt = '2026-01-01 00:00:00';\n","solution":"var breachAt = '2026-01-01 00:00:00';\nvar now = new GlideDateTime();\nvar due = new GlideDateTime(breachAt);\nif (now.compareTo(due) > 0) {\n  gs.info('BREACHED');\n} else {\n  gs.info('OK');\n}","checks":[{"type":"includes","value":"GlideDateTime","message":"GlideDateTime"},{"type":"includes","value":"compareTo","message":"compareTo"},{"type":"includes","value":"BREACHED","message":"BREACHED"},{"type":"includes","value":"OK","message":"OK"}]}],"theory":[{"id":"sla-t01","title":"Retroactive start","difficulty":"hard","format":"theory","kind":"theory","prompt":"SLA attaches 30 minutes after insert because priority was updated to P1. Retroactive start is true. What does the engine do, and what must exist?","options":[{"id":"a","text":"It always starts from now; retroactive is a label only"},{"id":"b","text":"It backdates start using audit history of when the start condition became true; if the driving fields are not audited, the backdate is wrong or missing"},{"id":"c","text":"It deletes the first 30 minutes from the database"},{"id":"d","text":"It requires a MID Server"}],"answer":"b","explanation":"Community/docs: retroactive start/pause/stop replay audit. CIS-ITSM loves this. Enable auditing on priority/state. Incomplete audit = SLA that “starts now” despite the checkbox.","multi":false},{"id":"sla-t02","title":"Retroactive pause","difficulty":"hard","format":"theory","kind":"theory","prompt":"Incident went On Hold 2 hours ago but the SLA didn’t pause. You enable Retroactive Pause. Result?","options":[{"id":"a","text":"Pause still starts from now only"},{"id":"b","text":"Engine looks back to when the pause condition first became true and excludes that wait from elapsed, if audit supports it"},{"id":"c","text":"It converts the SLA to cancelled"},{"id":"d","text":"It clones a second task_sla"}],"answer":"b","explanation":"Same audit dependency. If On Hold is a substate that isn’t in the pause condition, retroactive cannot invent a pause.","multi":false},{"id":"sla-t03","title":"Schedule vs 24x7","difficulty":"hard","format":"theory","kind":"theory","prompt":"P1 4-hour SLA uses 8–5 weekdays. A ticket opens Saturday 01:00. Elapsed after 1 wall-clock hour is ~0. Why do agents argue “we’re already late”?","options":[{"id":"a","text":"The SLA is broken"},{"id":"b","text":"Elapsed follows GlideSchedule; time outside the schedule does not count (unless 24x7). Agents confuse wall clock with business time"},{"id":"c","text":"Schedules cannot be attached to SLAs"},{"id":"d","text":"P1 must ignore schedules OOTB with no property"}],"answer":"b","explanation":"Display BR + g_scratchpad to warn “outside business hours” is a known pattern. Interview: define P1 as 24x7 if the contract says so.","multi":false},{"id":"sla-t04","title":"Multiple SLAs on one task","difficulty":"hard","format":"theory","kind":"theory","prompt":"Response SLA and Resolution SLA both in_progress. Breach of response does not cancel resolution. Correct?","options":[{"id":"a","text":"False; only one task_sla can exist per task"},{"id":"b","text":"True; multiple definitions can attach; they have independent clocks, stages, and breach flags"},{"id":"c","text":"The older SLA always wins and kills the other"},{"id":"d","text":"GlideAggregate cannot count them"}],"answer":"b","explanation":"CIS: multiple SLAs. made_sla on the task is a rollup you must understand (any breach vs all). Don’t assume one row in task_sla.","multi":false},{"id":"sla-t05","title":"Pause condition vs client hold_reason","difficulty":"hard","format":"theory","kind":"theory","prompt":"On Hold pauses SLA, but agents use a custom u_waiting_vendor state that is not in the pause condition. Symptom?","options":[{"id":"a","text":"SLA still pauses because any non-In-Progress state pauses OOTB"},{"id":"b","text":"Clock keeps running; UI Policy cannot pause SLAs — pause is SLA definition conditions evaluated by the engine on update"},{"id":"c","text":"hold_reason mandatory pauses SLAs by itself"},{"id":"d","text":"You must call gs.sleep to pause"}],"answer":"b","explanation":"Configure pause conditions for every waiting state. Client mandatory hold_reason is UX, not the clock.","multi":false},{"id":"sla-t06","title":"Retroactive start vs SLA breakdown","difficulty":"hard","format":"theory","kind":"theory","prompt":"SLA Breakdown by assignment group attributes early time to the wrong assignee. Known interaction?","options":[{"id":"a","text":"Breakdown ignores assignment"},{"id":"b","text":"With retroactive start, breakdown may only see assignee changes after the SLA record attached, attributing backdated time to the first assignee it sees"},{"id":"c","text":"This cannot happen if has_breached is false"},{"id":"d","text":"Breakdown requires SOAP"}],"answer":"b","explanation":"ServiceNow community: retroactive start + SLA breakdown mismatch. Implementation choice: disable retroactive or custom breakdown.","multi":false},{"id":"sla-t07","title":"getRowCount of task_sla in a BR","difficulty":"hard","format":"theory","kind":"theory","prompt":"Before BR on incident counts related SLAs with GlideRecord query + getRowCount on every update. Production issue?","options":[{"id":"a","text":"None; it is O(1)"},{"id":"b","text":"Extra query on a hot table; use GlideAggregate, cache on g_scratchpad for display, or check only when state/priority changes (condition field)"},{"id":"c","text":"task_sla cannot be queried from incident BRs"},{"id":"d","text":"You must use RESTMessageV2 to localhost"}],"answer":"b","explanation":"Incident is the hottest table. Condition + aggregate. Display BR if it is only for the form.","multi":false},{"id":"sla-t08","title":"Reset vs repair","difficulty":"hard","format":"theory","kind":"theory","prompt":"Reopen Resolved → In Progress. Customer wants a fresh resolution SLA. What actually happens OOTB-ish?","options":[{"id":"a","text":"Always a brand-new task_sla with no config"},{"id":"b","text":"Depends: existing SLA may resume/cancel/reset based on reset conditions and SLA definition; “repair” scripts exist because reopen is an edge case CIS tests"},{"id":"c","text":"Reopen always deletes CMDB relationships"},{"id":"d","text":"You cannot reopen incidents that had SLAs"}],"answer":"b","explanation":"Don’t promise a new 4-hour clock unless reset conditions are built. Test it on a PDI.","multi":false},{"id":"sla-t09","title":"contract_sla vs sla table names","difficulty":"hard","format":"theory","kind":"theory","prompt":"You GlideRecord(\"sla\") in a Tokyo+ instance and get nothing. Why might that be?","options":[{"id":"a","text":"SLAs were removed from ITSM"},{"id":"b","text":"Definition table is typically contract_sla (or the family-specific SLA definition); “sla” as a table name is a common wrong guess"},{"id":"c","text":"You must query ecc_queue"},{"id":"d","text":"Definitions live only in XML update sets, not tables"}],"answer":"b","explanation":"Runtime = task_sla. Definition = contract_sla in many ITSM apps. Verify sys_db_object on the target family.","multi":false},{"id":"sla-t10","title":"Percentage workflow","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why do SLA workflows use 50%/75% instead of “2 hours” in the flow?","options":[{"id":"a","text":"Percentages are less accurate"},{"id":"b","text":"One generic flow can serve 4-hour and 3-day SLAs; time-based waits would need a flow per duration"},{"id":"c","text":"The engine cannot read duration fields"},{"id":"d","text":"Percentages ignore schedules"}],"answer":"b","explanation":"CIS-ITSM study notes: percentage-based SLA notifications. Elapsed still honors schedule.","multi":false},{"id":"sla-t11","title":"made_sla true but has_breached true","difficulty":"hard","format":"theory","kind":"theory","prompt":"How is that possible?","options":[{"id":"a","text":"It is impossible in all versions"},{"id":"b","text":"made_sla may be calculated at close from a subset of SLAs, a BR that doesn’t see all task_sla rows, or a customized field — don’t treat the two as a DB constraint"},{"id":"c","text":"has_breached is client-only"},{"id":"d","text":"made_sla is on contract_sla only"}],"answer":"b","explanation":"Interview: query all task_sla for the task. Don’t trust one boolean.","multi":false},{"id":"sla-t12","title":"Stopping SLAs on cancel","difficulty":"hard","format":"theory","kind":"theory","prompt":"Setting stage=cancelled with setWorkflow(false) on task_sla. Side effect?","options":[{"id":"a","text":"The SLA engine will still send breach emails forever"},{"id":"b","text":"You may skip SLA engine’s own stop processing/notifications; sometimes that’s desired for cancel storms, but reporting of “cancelled vs breached” can be wrong if you just flip the choice"},{"id":"c","text":"cancelled is not a valid stage name in any family"},{"id":"d","text":"You must delete the row instead, always"}],"answer":"b","explanation":"Prefer letting the stop condition fire (incident cancelled) over hand-editing task_sla. If you must, know you are mutating runtime.","multi":false},{"id":"sla-t13","title":"OLA vs SLA vs UC","difficulty":"hard","format":"theory","kind":"theory","prompt":"Assignment group internal 15-min acknowledge vs customer 4-hour resolve. Modeling?","options":[{"id":"a","text":"One SLA definition can be both"},{"id":"b","text":"Separate definitions (SLA to customer, OLA to internal team); don’t overload a single contract_sla with mixed audiences"},{"id":"c","text":"OLAs cannot be task_sla"},{"id":"d","text":"UCs replace CMDB"}],"answer":"b","explanation":"CIS vocabulary. Different start/pause/notify. Same task can have both.","multi":false},{"id":"sla-t14","title":"GlideSchedule.isInSchedule","difficulty":"hard","format":"theory","kind":"theory","prompt":"Checking “are we in the SLA schedule now” in a Display BR. Why Display not After?","options":[{"id":"a","text":"After BRs run on form load"},{"id":"b","text":"You need the answer when the form opens, passed via g_scratchpad; After does not run on GET of the form"},{"id":"c","text":"Display BRs cannot query task_sla"},{"id":"d","text":"GlideSchedule is client-only"}],"answer":"b","explanation":"Pattern from community: Display BR + onLoad info message for outside hours. Keep the query tight (current task’s in_progress SLAs only).","multi":false},{"id":"sla-t15","title":"Priority change and multiple definitions","difficulty":"hard","format":"theory","kind":"theory","prompt":"P3 SLA in_progress; user sets P1. What should happen in a well-built instance?","options":[{"id":"a","text":"The P3 SLA always continues as the only clock"},{"id":"b","text":"P3 stop condition should cancel/complete it and P1 definition should attach (possibly retroactive) — if stop conditions are wrong you get two running SLAs or a P3 clock on a P1 ticket"},{"id":"c","text":"Priority cannot be changed after insert"},{"id":"d","text":"All task_sla rows are deleted on any update"}],"answer":"b","explanation":"CIS edge case. Test stop conditions include priority change. Retroactive on the P1 SLA is a business decision.","multi":false}]},{"id":"major_incident","title":"Major Incident","blurb":"Major incident state, communication plans, workbench fields, and related incidents.","questions":[{"id":"mim-01","title":"Query accepted major incidents","difficulty":"easy","kind":"server","prompt":"Query incident where major_incident_state is accepted and active is true. Log number.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\ngr.addQuery('major_incident_state', 'accepted');\ngr.addQuery('active', true);\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"incident"},{"type":"includes","value":"addQuery('major_incident_state', 'accepted')","message":"Accepted MIM"},{"type":"includes","value":"query()","message":"Query"}]},{"id":"mim-02","title":"Propose a major incident","difficulty":"easy","kind":"server","prompt":"Load INC0000450 by number, set major_incident_state to proposed, update.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\nif (gr.get('number', 'INC0000450')) {\n  gr.setValue('major_incident_state', 'proposed');\n  gr.update();\n}","checks":[{"type":"includes","value":"INC0000450","message":"Incident number"},{"type":"includes","value":"setValue('major_incident_state', 'proposed')","message":"Proposed"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"mim-03","title":"Accept MIM sets impact/urgency","difficulty":"intermediate","kind":"business_rule","prompt":"When major_incident_state changes to accepted, set impact 1, urgency 1, and priority 1.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.major_incident_state.changesTo('accepted')) {\n    current.setValue('impact', '1');\n    current.setValue('urgency', '1');\n    current.setValue('priority', '1');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('accepted')","message":"Accepted"},{"type":"includes","value":"setValue('impact', '1')","message":"Impact 1"},{"type":"includes","value":"setValue('urgency', '1')","message":"Urgency 1"},{"type":"includes","value":"setValue('priority', '1')","message":"Priority 1"}]},{"id":"mim-04","title":"Reject proposal","difficulty":"easy","kind":"server","prompt":"For incId, set major_incident_state to rejected and add a work note \"Not a major incident\".","starter":"var incId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var incId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar gr = new GlideRecord('incident');\nif (gr.get(incId)) {\n  gr.setValue('major_incident_state', 'rejected');\n  gr.work_notes = 'Not a major incident';\n  gr.update();\n}","checks":[{"type":"includes","value":"rejected","message":"Rejected"},{"type":"includes","value":"Not a major incident","message":"Work note"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"mim-05","title":"Queue major incident communication event","difficulty":"easy","kind":"business_rule","prompt":"When major_incident_state changes to accepted, queue incident.major.accepted with parm1 = number.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.major_incident_state.changesTo('accepted')) {\n    gs.eventQueue('incident.major.accepted', current, current.getValue('number'), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.eventQueue","message":"eventQueue"},{"type":"includes","value":"incident.major.accepted","message":"Event name"}]},{"id":"mim-06","title":"Link child incidents to MIM","difficulty":"intermediate","kind":"server","prompt":"Query active incidents with matching cmdb_ci ciId excluding parentId. Set parent_incident to parentId and update with setWorkflow(false).","starter":"var parentId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar ciId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var parentId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar ciId = 'cccccccccccccccccccccccccccccccc';\nvar gr = new GlideRecord('incident');\ngr.addQuery('cmdb_ci', ciId);\ngr.addQuery('active', true);\ngr.addQuery('sys_id', '!=', parentId);\ngr.query();\nwhile (gr.next()) {\n  gr.setValue('parent_incident', parentId);\n  gr.setWorkflow(false);\n  gr.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Incidents"},{"type":"includes","value":"cmdb_ci","message":"Same CI"},{"type":"includes","value":"parent_incident","message":"Set parent"},{"type":"includes","value":"setWorkflow(false)","message":"setWorkflow"}]},{"id":"mim-07","title":"Client: communication plan mandatory","difficulty":"easy","kind":"client","prompt":"onChange major_incident_state: if accepted, setMandatory description true (stand-in for communication plan).","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setMandatory('description', newValue == 'accepted');\n}","checks":[{"type":"includes","value":"g_form.setMandatory('description'","message":"Mandatory description"},{"type":"includes","value":"accepted","message":"Accepted"}]},{"id":"mim-08","title":"Count children of a MIM","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate COUNT incident where parent_incident = parentId. Log count.","starter":"var parentId = 'dddddddddddddddddddddddddddddddd';\n","solution":"var parentId = 'dddddddddddddddddddddddddddddddd';\nvar ga = new GlideAggregate('incident');\nga.addQuery('parent_incident', parentId);\nga.addAggregate('COUNT');\nga.query();\nif (ga.next()) {\n  gs.info(ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('incident')","message":"Aggregate"},{"type":"includes","value":"parent_incident","message":"Children"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"}]},{"id":"mim-09","title":"onSubmit: require CAB note for MIM close","difficulty":"easy","kind":"client","prompt":"If major_incident_state is accepted and close_notes empty and state will be 7, block. Check g_form.getValue state == 7 and close_notes.","starter":"function onSubmit() {\n  return true;\n}\n","solution":"function onSubmit() {\n  if (g_form.getValue('major_incident_state') == 'accepted' && g_form.getValue('state') == '7' && !g_form.getValue('close_notes')) {\n    g_form.addErrorMessage('Close notes are required to close a major incident.');\n    return false;\n  }\n  return true;\n}","checks":[{"type":"includes","value":"major_incident_state","message":"MIM state"},{"type":"includes","value":"close_notes","message":"close_notes"},{"type":"includes","value":"return false","message":"Block"}]},{"id":"mim-10","title":"GlideAjax isMajor","difficulty":"intermediate","kind":"script_include","prompt":"MimAjax.isMajor reads sysparm_id, returns \"true\" if major_incident_state is accepted.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var MimAjax = Class.create();\nMimAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  isMajor: function() {\n    var id = this.getParameter('sysparm_id');\n    var gr = new GlideRecord('incident');\n    if (gr.get(id) && gr.getValue('major_incident_state') == 'accepted') {\n      return 'true';\n    }\n    return 'false';\n  },\n  type: 'MimAjax'\n});","checks":[{"type":"includes","value":"isMajor","message":"Method"},{"type":"includes","value":"getParameter('sysparm_id')","message":"sysparm_id"},{"type":"includes","value":"accepted","message":"Accepted"}]},{"id":"mim-11","title":"Encoded query: proposed P1","difficulty":"easy","kind":"server","prompt":"addEncodedQuery major_incident_state=proposed^priority=1 on incident. Log numbers.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\ngr.addEncodedQuery('major_incident_state=proposed^priority=1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"major_incident_state=proposed","message":"Proposed"},{"type":"includes","value":"priority=1","message":"P1"}]},{"id":"mim-12","title":"Resolve children when MIM resolves","difficulty":"intermediate","kind":"business_rule","prompt":"When parent MIM state changes to 6, set child incidents (parent_incident = current) to state 6 with same close_notes, setWorkflow false.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('6')) {\n    var child = new GlideRecord('incident');\n    child.addQuery('parent_incident', current.getUniqueValue());\n    child.addQuery('active', true);\n    child.query();\n    while (child.next()) {\n      child.setValue('state', '6');\n      child.setValue('close_notes', current.getValue('close_notes'));\n      child.setWorkflow(false);\n      child.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('6')","message":"Resolved"},{"type":"includes","value":"parent_incident","message":"Children"},{"type":"regex","value":{"__regex":true,"source":"setValue\\(\\s*['\"]state['\"]\\s*,\\s*['\"]6['\"]\\s*\\)","flags":""},"message":"Resolve children"},{"type":"includes","value":"setWorkflow(false)","message":"setWorkflow"}]},{"id":"mim-13","title":"Assign Major Incident Managers group","difficulty":"easy","kind":"business_rule","prompt":"On accept, set assignment_group to group named \"Major Incident Managers\".","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.major_incident_state.changesTo('accepted')) {\n    var g = new GlideRecord('sys_user_group');\n    if (g.get('name', 'Major Incident Managers')) {\n      current.setValue('assignment_group', g.getUniqueValue());\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"Major Incident Managers","message":"Group name"},{"type":"includes","value":"assignment_group","message":"Assign group"}]},{"id":"mim-14","title":"Timeline work note","difficulty":"easy","kind":"server","prompt":"Append work_notes \"Bridge opened\" to incident incId.","starter":"var incId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\n","solution":"var incId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\nvar gr = new GlideRecord('incident');\nif (gr.get(incId)) {\n  gr.work_notes = 'Bridge opened';\n  gr.update();\n}","checks":[{"type":"includes","value":"Bridge opened","message":"Work note text"},{"type":"includes","value":"work_notes","message":"work_notes"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"mim-15","title":"Prevent cancel of accepted MIM","difficulty":"intermediate","kind":"business_rule","prompt":"If major_incident_state is accepted and state changes to 8 (Canceled), abort unless gs.hasRole(\"major_incident_manager\") or admin.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.getValue('major_incident_state') == 'accepted' && current.state.changesTo('8')) {\n    if (!gs.hasRole('major_incident_manager') && !gs.hasRole('admin')) {\n      gs.addErrorMessage('Only major incident managers can cancel an accepted MIM.');\n      current.setAbortAction(true);\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"accepted","message":"Accepted MIM"},{"type":"includes","value":"changesTo('8')","message":"Canceled"},{"type":"includes","value":"gs.hasRole('major_incident_manager')","message":"Role check"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"mim-16","title":"onLoad: banner for MIM","difficulty":"easy","kind":"client","prompt":"If major_incident_state is accepted, addInfoMessage \"Major incident — follow the communication plan.\"","starter":"function onLoad() {\n\n}\n","solution":"function onLoad() {\n  if (g_form.getValue('major_incident_state') == 'accepted') {\n    g_form.addInfoMessage('Major incident — follow the communication plan.');\n  }\n}","checks":[{"type":"includes","value":"g_form.getValue('major_incident_state')","message":"Read MIM state"},{"type":"includes","value":"g_form.addInfoMessage","message":"Info banner"},{"type":"includes","value":"communication plan","message":"Message text"}]}],"theory":[{"id":"mim-t01","title":"P1 is not MIM","difficulty":"hard","format":"theory","kind":"theory","prompt":"A VP says “every P1 is a major incident.” CIS-ITSM response?","options":[{"id":"a","text":"Agree; set a BR that accepts MIM on priority=1"},{"id":"b","text":"Disagree: MIM is a process (plugin, propose/accept, comms, roles). Priority is impact/urgency. Auto-accepting all P1s floods the MIM workbench and pages the wrong people"},{"id":"c","text":"P1 cannot exist without MIM plugin"},{"id":"d","text":"MIM replaces incident table"}],"answer":"b","explanation":"Criteria-based declaration, not a data value. Some majors start as P2 with massive user impact. Some P1s are contained.","multi":false},{"id":"mim-t02","title":"Plugin stack","difficulty":"hard","format":"theory","kind":"theory","prompt":"major_incident_state is missing on a new PDI. What is the implementation answer?","options":[{"id":"a","text":"Customize the dictionary immediately"},{"id":"b","text":"Activate Incident Management – Major Incident Management (com.snc.incident.mim) which may pull Incident Communications, updates, task-outage — and train major_incident_manager / communications_manager"},{"id":"c","text":"It is only in the Mobile app"},{"id":"d","text":"Rename state 1 to Major"}],"answer":"b","explanation":"CIS: plugin, not a custom field. Know companion plugins for comms.","multi":false},{"id":"mim-t03","title":"Propose vs accept","difficulty":"hard","format":"theory","kind":"theory","prompt":"Anyone with itil can accept a proposed MIM in a customer’s instance. What’s the control failure?","options":[{"id":"a","text":"OOTB itil must accept; that is required"},{"id":"b","text":"Accept should be limited (major_incident_manager); itil may propose. Server UI Action conditions + ACLs, not a hidden button CSS"},{"id":"c","text":"Only admin can propose, never itil"},{"id":"d","text":"Propose and accept are the same state"}],"answer":"b","explanation":"SoD. Interview: name the roles. CSS-hidden UI Actions still callable.","multi":false},{"id":"mim-t04","title":"Communication plan vs work_notes","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why is Incident Communications Management more than work_notes = \"Bridge opened\"?","options":[{"id":"a","text":"work_notes cannot be used on incident"},{"id":"b","text":"Comms plans target audiences/channels/cadence (email, SMS, conference) with templates; work_notes is the technical timeline, not stakeholder comms"},{"id":"c","text":"Communications plugin deletes work_notes"},{"id":"d","text":"You must use SOAP to notify users"}],"answer":"b","explanation":"CIS MIM: communication plans. Don’t invent a custom email BR that CCs the company.","multi":false},{"id":"mim-t05","title":"Children vs parent_incident","difficulty":"hard","format":"theory","kind":"theory","prompt":"Attaching 400 child incidents with a loop of update() without setWorkflow(false). What happens?","options":[{"id":"a","text":"Nothing; 400 is fine"},{"id":"b","text":"You can blow the transaction quota, fire 400× notifications/SLA re-evaluations, and recurse if children BRs update the parent"},{"id":"c","text":"parent_incident cannot be set by script"},{"id":"d","text":"Children must be problems"}],"answer":"b","explanation":"Batch, setWorkflow(false) if process allows, or async. Also exclude the parent sys_id in the query.","multi":false},{"id":"mim-t06","title":"Post-incident review","difficulty":"hard","format":"theory","kind":"theory","prompt":"When is a Problem created from MIM in a mature process?","options":[{"id":"a","text":"Never; MIM closure is enough"},{"id":"b","text":"After restore, PIR often yields a Problem for permanent fix — don’t keep the MIM open for weeks of RCA if the process splits restore vs cause"},{"id":"c","text":"Automatically via IRE"},{"id":"d","text":"Only if there were no child incidents"}],"answer":"b","explanation":"CIS: PIR is a MIM topic. Problem is the RCA vehicle. Linking is the data model.","multi":false},{"id":"mim-t07","title":"Outage vs incident","difficulty":"hard","format":"theory","kind":"theory","prompt":"Task-outage plugin. Why link an outage record instead of only the MIM incident?","options":[{"id":"a","text":"Outages replace CIs"},{"id":"b","text":"Outage captures service/window/affected CIs for reporting (availability) distinct from the incident workflow"},{"id":"c","text":"Outage is a knowledge article type"},{"id":"d","text":"You cannot relate CIs to incidents"}],"answer":"b","explanation":"CIS plugin list includes task-outage. Availability KPIs ≠ incident count.","multi":false},{"id":"mim-t08","title":"Workspace vs classic form","difficulty":"hard","format":"theory","kind":"theory","prompt":"A Display BR sets g_scratchpad on incident, but the MIM workspace widget doesn’t see it. Why?","options":[{"id":"a","text":"g_scratchpad is illegal on incident"},{"id":"b","text":"Workspaces/UI Builder components do not consume classic g_scratchpad the way native forms + Client Scripts do; you need Data Resources / server scripts for that UI"},{"id":"c","text":"Workspaces cannot show incidents"},{"id":"d","text":"You must use SOAP in the widget"}],"answer":"b","explanation":"Family/UI interview. Classic techniques don’t automatically port to Configurable Workspace.","multi":false},{"id":"mim-t09","title":"Reject proposed","difficulty":"hard","format":"theory","kind":"theory","prompt":"Reject should do what to priority?","options":[{"id":"a","text":"Always set priority to 5"},{"id":"b","text":"Leave priority as calculated; rejection is process, not a priority rewrite — unless you have an explicit policy"},{"id":"c","text":"Delete the incident"},{"id":"d","text":"Convert to sc_request"}],"answer":"b","explanation":"Don’t couple MIM reject to priority=4 in a BR “to be helpful.” You’ll fight the matrix.","multi":false},{"id":"mim-t10","title":"Assign to me UI Action","difficulty":"hard","format":"theory","kind":"theory","prompt":"CIS notes mention Assign to me logic on incident. Why mention it in a MIM interview?","options":[{"id":"a","text":"It always assigns the major_incident_manager group"},{"id":"b","text":"It has specific OOTB logic (group membership, already assigned, etc.) that can surprise MIM bridges if you overrode the UI Action globally"},{"id":"c","text":"It only exists on change_request"},{"id":"d","text":"It bypasses ACLs always"}],"answer":"b","explanation":"Know OOTB UI Actions before customizing. Global overrides affect MIM too.","multi":false},{"id":"mim-t11","title":"Event vs Flow for pages","difficulty":"hard","format":"theory","kind":"theory","prompt":"Paging on-call on MIM accept. Prefer?","options":[{"id":"a","text":"gs.sleep in a Before BR until someone picks up"},{"id":"b","text":"Event/Flow/On-Call / Notify after accept — not a synchronous REST wait in Before that holds the incident lock"},{"id":"c","text":"Client getXMLWait in onLoad"},{"id":"d","text":"Discovery schedule"}],"answer":"b","explanation":"Same async lesson as integrations. Before + 8s HTTP is how you get form timeouts during an outage.","multi":false},{"id":"mim-t12","title":"Security of communication templates","difficulty":"hard","format":"theory","kind":"theory","prompt":"A comms template includes ${incident.description} and a user stuffed credentials in the description. Risk?","options":[{"id":"a","text":"Templates cannot expand fields"},{"id":"b","text":"Mass notification will leak the description to a wide audience — templates need field choice + maybe a sanitized comms field"},{"id":"c","text":"Description is never sent in email OOTB and cannot be"},{"id":"d","text":"Only SOAP templates have this issue"}],"answer":"b","explanation":"MIM comms are a data-leak channel. Interview security angle.","multi":false},{"id":"mim-t13","title":"Child resolve cascade","difficulty":"hard","format":"theory","kind":"theory","prompt":"Parent resolved copies close_notes to children with setWorkflow(false). Callers of children never got “resolved” email. Expected?","options":[{"id":"a","text":"No, setWorkflow(false) still sends email"},{"id":"b","text":"Yes; skipping engines skips notifications. If callers must be told, send a controlled event after, or don’t skip workflow on the comment/email path"},{"id":"c","text":"Children cannot have callers"},{"id":"d","text":"Email always reads close_notes via Discovery"}],"answer":"b","explanation":"Trade-off you must state. Silent child close is a CX defect.","multi":false},{"id":"mim-t14","title":"Major vs high priority SLA","difficulty":"hard","format":"theory","kind":"theory","prompt":"Accepted MIM is P2. Response SLA is still the P2 definition. Problem?","options":[{"id":"a","text":"MIM always forces P1 SLAs OOTB with no config"},{"id":"b","text":"If the contract says majors get P1 clocks, you need SLA conditions on major_incident_state — it will not happen just because MIM is accepted"},{"id":"c","text":"SLAs cannot read major_incident_state"},{"id":"d","text":"You must delete task_sla manually every time"}],"answer":"b","explanation":"Process vs data again. Configure SLA definitions for MIM, or accept that P2 majors keep P2 clocks.","multi":false},{"id":"mim-t15","title":"Who can cancel accepted MIM","difficulty":"hard","format":"theory","kind":"theory","prompt":"itil user sets state=Canceled on an accepted MIM via Table API. Your UI Action was hidden. Fix?","options":[{"id":"a","text":"Hide it harder with CSS"},{"id":"b","text":"ACL + Before BR on state/major_incident_state; UI is not a security boundary"},{"id":"c","text":"Table API cannot update incident"},{"id":"d","text":"Canceled is not a state"}],"answer":"b","explanation":"Same as emergency change. Server enforcement.","multi":false}]},{"id":"integrations","title":"Integrations","blurb":"Outbound REST/SOAP, Scripted REST APIs, import sets, MID Server, and JSON payloads.","questions":[{"id":"int-01","title":"Outbound REST GET","difficulty":"easy","kind":"integration","prompt":"Create sn_ws.RESTMessageV2, setHttpMethod GET, setEndpoint https://api.example.com/incidents, execute, log
