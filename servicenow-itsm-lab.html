e();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('change_task')","message":"change_task"},{"type":"includes","value":"change_request","message":"Parent change"},{"type":"includes","value":"setWorkflow(false)","message":"setWorkflow false"},{"type":"includes","value":"update()","message":"Update tasks"}]},{"id":"chg-10","title":"Count changes on a CI last 30 days","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate COUNT of change_request where cmdb_ci = ciId and sys_created_on is on or after gs.daysAgo(30). Log the count.","starter":"var ciId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var ciId = 'cccccccccccccccccccccccccccccccc';\nvar ga = new GlideAggregate('change_request');\nga.addQuery('cmdb_ci', ciId);\nga.addQuery('sys_created_on', '>=', gs.daysAgo(30));\nga.addAggregate('COUNT');\nga.query();\nif (ga.next()) {\n  gs.info(ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('change_request')","message":"Aggregate changes"},{"type":"includes","value":"cmdb_ci","message":"Filter CI"},{"type":"includes","value":"gs.daysAgo(30)","message":"Last 30 days"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"}]},{"id":"chg-11","title":"Queue change.approval.required","difficulty":"easy","kind":"business_rule","prompt":"When state changes to Assess (2), queue change.approval.required with parm1 = assignment_group display value.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('2')) {\n    gs.eventQueue('change.approval.required', current, current.assignment_group.getDisplayValue(), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('2')","message":"Assess state"},{"type":"includes","value":"gs.eventQueue","message":"Queue event"},{"type":"includes","value":"change.approval.required","message":"Event name"}]},{"id":"chg-12","title":"Risk calculation stub","difficulty":"intermediate","kind":"business_rule","prompt":"If impact is 1, set risk to high. Else if impact is 2, set risk to moderate. Else set risk to low.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var impact = current.getValue('impact');\n  if (impact == '1') {\n    current.setValue('risk', 'high');\n  } else if (impact == '2') {\n    current.setValue('risk', 'moderate');\n  } else {\n    current.setValue('risk', 'low');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"getValue('impact')","message":"Read impact"},{"type":"includes","value":"setValue('risk', 'high')","message":"High risk"},{"type":"includes","value":"setValue('risk', 'moderate')","message":"Moderate"},{"type":"includes","value":"setValue('risk', 'low')","message":"Low"}]},{"id":"chg-13","title":"GlideAjax: isChangeBlackout","difficulty":"intermediate","kind":"script_include","prompt":"ChangeAjax.inBlackout reads sysparm_start. If it contains \"2026-12-25\" return \"true\" else \"false\". (Simulated blackout check.)","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var ChangeAjax = Class.create();\nChangeAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  inBlackout: function() {\n    var start = this.getParameter('sysparm_start') || '';\n    return start.indexOf('2026-12-25') >= 0 ? 'true' : 'false';\n  },\n  type: 'ChangeAjax'\n});","checks":[{"type":"includes","value":"AbstractAjaxProcessor","message":"Ajax processor"},{"type":"includes","value":"inBlackout","message":"Method name"},{"type":"includes","value":"getParameter('sysparm_start')","message":"Read start"},{"type":"includes","value":"2026-12-25","message":"Blackout date"}]},{"id":"chg-14","title":"onSubmit: CAB notes when high risk","difficulty":"easy","kind":"client","prompt":"If risk is high and cab_recommendation is empty, addErrorMessage and return false.","starter":"function onSubmit() {\n  return true;\n}\n","solution":"function onSubmit() {\n  if (g_form.getValue('risk') == 'high' && !g_form.getValue('cab_recommendation')) {\n    g_form.addErrorMessage('CAB recommendation is required for high risk changes.');\n    return false;\n  }\n  return true;\n}","checks":[{"type":"includes","value":"g_form.getValue('risk')","message":"Read risk"},{"type":"includes","value":"high","message":"High risk"},{"type":"includes","value":"cab_recommendation","message":"CAB recommendation"},{"type":"includes","value":"return false","message":"Block submit"}]},{"id":"chg-15","title":"Encoded query: scheduled tonight","difficulty":"intermediate","kind":"server","prompt":"Query change_request with addEncodedQuery work_startONToday^state=2. Log numbers.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('change_request');\ngr.addEncodedQuery('work_startONToday^state=2');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"work_startONToday","message":"Work start today"}]},{"id":"chg-16","title":"Link backout plan comments","difficulty":"easy","kind":"business_rule","prompt":"When backout_plan changes, copy its latest journal/text into comments. If it is a string field, assign current.comments = current.backout_plan.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.backout_plan.changes()) {\n    current.comments = current.getValue('backout_plan');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"backout_plan.changes()","message":"When backout_plan changes"},{"type":"oneOf","values":["current.comments","setValue('comments'"],"message":"Write comments"}]}],"theory":[{"id":"chg-t01","title":"Change model vs type","difficulty":"hard","format":"theory","kind":"theory","prompt":"CIS-ITSM: What is the modern distinction between change type (standard/normal/emergency) and a change model?","options":[{"id":"a","text":"They are identical; model is a deprecated synonym for type"},{"id":"b","text":"Type is a coarse classification; a change model is the configurable lifecycle (states, UI, approvals, risk) used to implement that process — standard changes are often models/templates in a catalog, not just type=standard"},{"id":"c","text":"Change models only exist for Release Management"},{"id":"d","text":"Emergency changes cannot use a model"}],"answer":"b","explanation":"Tokyo+ interviews: Change Models drive the experience. “Standard” in ITIL is pre-authorized repeatable work — in Now that is typically a Standard Change template/catalog item that creates a change with a model, not a user freely setting type=standard on a blank record.","multi":false},{"id":"chg-t02","title":"Conflict detection","difficulty":"hard","format":"theory","kind":"theory","prompt":"Two changes share a CI and overlapping planned windows. Where does ServiceNow detect this and what is it not?","options":[{"id":"a","text":"It is an IRE duplicate CI merge"},{"id":"b","text":"Change conflict / collision detection (affected CIs, services, windows) — a warning/process control, not a database unique index that blocks insert by default in all configurations"},{"id":"c","text":"It is only an email from CAB"},{"id":"d","text":"GlideRecord.addQuery cannot see dates, so conflicts are impossible to script"}],"answer":"b","explanation":"CIS: know conflict detection exists on the change form/related lists, uses CI relationships and schedule, and is configurable. Do not confuse with CMDB identification. Emergency changes may still conflict — process might override.","multi":false},{"id":"chg-t03","title":"Risk calculator vs assessment","difficulty":"hard","format":"theory","kind":"theory","prompt":"Risk is High even though impact is 3. What should an implementer inspect?","options":[{"id":"a","text":"Only the client script that sets risk = impact"},{"id":"b","text":"Change risk conditions, risk assessment questionnaire scores, properties, and whether a BR/flow overwrites the calculated risk after assess"},{"id":"c","text":"MID Server ECC queue"},{"id":"d","text":"Knowledge user criteria"}],"answer":"b","explanation":"OOTB risk is not a single field mapping. Risk Assessment (questions) plus condition-based risk values plus manual override. Interview: never hard-code risk in a BR if the customer uses the assessment engine.","multi":false},{"id":"chg-t04","title":"Emergency vs Standard authorization","difficulty":"hard","format":"theory","kind":"theory","prompt":"Who should be allowed to create Emergency changes, and what happens to CAB?","options":[{"id":"a","text":"Any itil user; CAB is skipped with no audit"},{"id":"b","text":"A tight role (change manager / ECAB path): CAB may be bypassed for authorization speed, but post-implementation review / retrospective CAB is the ITIL/Now expectation"},{"id":"c","text":"Only mid_server users"},{"id":"d","text":"Emergency is just Normal with type flipped in a client script"}],"answer":"b","explanation":"Emergency is not “no governance.” It is an alternate approval path (CAB chair/ECAB). Server ACLs/BRs must enforce who can set type/model. Client hiding the choice is insufficient.","multi":false},{"id":"chg-t05","title":"GlideDateTime and TZ","difficulty":"hard","format":"theory","kind":"theory","prompt":"A Before BR compares start_date and end_date with string \u003c comparison on getValue() (UTC internal). The customer is in US/Pacific. What’s the bug?","options":[{"id":"a","text":"There is no bug; internal values are already local"},{"id":"b","text":"Lexical string compare can be OK for identical formats, but mixing getDisplayValue() (user TZ) with getValue() (UTC internal) or ignoring empty dates causes false aborts; GlideDateTime.compareTo is the safe API"},{"id":"c","text":"Dates must be compared only in client scripts"},{"id":"d","text":"end_date is a duration field so compareTo never works"}],"answer":"b","explanation":"Internal glide_date_time is UTC. Display is user TZ. Mixing them is a classic defect. compareTo, or convert both to GlideDateTime. Also gs.nil both dates before compare.","multi":false},{"id":"chg-t06","title":"Standard Change Catalog","difficulty":"hard","format":"theory","kind":"theory","prompt":"A fulfiller sets type=standard on a blank change_request and expects auto-approval. Why might OOTB-style implementations refuse?","options":[{"id":"a","text":"Standard is not a legal type"},{"id":"b","text":"Standard changes are supposed to originate from approved templates (pre-authorized catalog); a free-typed standard is a control bypass"},{"id":"c","text":"Standard changes cannot have CIs"},{"id":"d","text":"Auto-approval requires SOAP"}],"answer":"b","explanation":"CIS: Standard Change Catalog / templates capture CAB pre-approval. Interview answer: don’t let users self-declare standard. Restrict with UI + server.","multi":false},{"id":"chg-t07","title":"change_task types","difficulty":"hard","format":"theory","kind":"theory","prompt":"Implementation, testing, and backout as change_task rows vs one work_note. Why does the exam care?","options":[{"id":"a","text":"change_task is deprecated"},{"id":"b","text":"Tasks are assignable, reportable, and can gate parent state; a single journal cannot prove backout was owned"},{"id":"c","text":"Backout must be a separate change_request always"},{"id":"d","text":"Testing tasks must live on sc_task"}],"answer":"b","explanation":"Close completeness: don’t close the change while implementation tasks are open (BR). Task types (implementation, testing, review) are process evidence for audit.","multi":false},{"id":"chg-t08","title":"CAB workbench","difficulty":"hard","format":"theory","kind":"theory","prompt":"CAB date definitions are used for what implementation purpose?","options":[{"id":"a","text":"To store the CI warranty date"},{"id":"b","text":"To define when CAB meetings occur so changes can be associated to a CAB agenda/date rather than a free-text “Thursday”"},{"id":"c","text":"To pause SLAs on changes"},{"id":"d","text":"To name the MID Server"}],"answer":"b","explanation":"CIS overlooked topic: CAB Workbench, CAB Definition, agenda. Not just “approver_user on sysapproval_approver.”","multi":false},{"id":"chg-t09","title":"Blackout vs maintenance","difficulty":"hard","format":"theory","kind":"theory","prompt":"outside_maintenance / blackout calendars. A change in a blackout still saved. Why?","options":[{"id":"a","text":"Blackout is display-only CSS"},{"id":"b","text":"Conflict/blackout is often a warning unless you add a Data Policy/BR to abort; configuration determines hard vs soft gate"},{"id":"c","text":"Blackouts only apply to standard changes"},{"id":"d","text":"Blackouts are evaluated only by Discovery"}],"answer":"b","explanation":"Implementers must choose warn vs block. Emergency may be allowed in blackout by policy. Don’t assume OOTB hard-stops every window clash.","multi":false},{"id":"chg-t10","title":"Normal change approvals","difficulty":"hard","format":"theory","kind":"theory","prompt":"High-risk Normal change has no approvers generated. Where do you look?","options":[{"id":"a","text":"Only the email properties"},{"id":"b","text":"Approval rules / flow on the change model, assignment group empty, user without approver_user, and whether risk was still Low when the approval activity ran"},{"id":"c","text":"The ECC queue"},{"id":"d","text":"Import set coalesce"}],"answer":"b","explanation":"Timing: if risk is calculated After the approval flow already branched, you get no CAB. Order of BRs vs Flow is an interview favorite.","multi":false},{"id":"chg-t11","title":"Caused by / PRB / INC","difficulty":"hard","format":"theory","kind":"theory","prompt":"change_request.caused_by / parent relationships. A change is the permanent fix for a problem. Correct linking?","options":[{"id":"a","text":"Only email the problem number in short_description"},{"id":"b","text":"Relate the change to the problem (and incidents as needed) so you can report “changes that closed problems” — don’t rely on text"},{"id":"c","text":"Set parent_incident on the change table (that field is on change OOTB as the main key)"},{"id":"d","text":"IRE createOrUpdateCI with class change_request"}],"answer":"b","explanation":"Use reference fields / related lists (varies by family: rfc on problem, caused_by, etc.). Text in short_description is not a CMDB/process link.","multi":false},{"id":"chg-t12","title":"updateMultiple on tasks","difficulty":"hard","format":"theory","kind":"theory","prompt":"Closing leftover change_task with updateMultiple() after parent cancel. Risk?","options":[{"id":"a","text":"updateMultiple cannot set state"},{"id":"b","text":"Engines/BRs on each task may not run as you expect; you may skip notifications that were required; also easy to forget the query filter and close the whole table"},{"id":"c","text":"updateMultiple only works in client scripts"},{"id":"d","text":"It automatically respects ACLs like GlideRecordSecure"}],"answer":"b","explanation":"updateMultiple is a bulk SQL-like update. Combine with setValue then updateMultiple, or loop with setWorkflow(false). Double-check addQuery. Interview: know the API and its foot-guns.","multi":false},{"id":"chg-t13","title":"itil vs change_manager","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why shouldn’t every itil user be change_manager?","options":[{"id":"a","text":"itil cannot open change_request at all OOTB"},{"id":"b","text":"change_manager is a process role for models, properties, CAB configuration — SoD: requesters/fulfillers vs people who can weaken approval"},{"id":"c","text":"change_manager is only for Discovery"},{"id":"d","text":"The roles are equivalent if you have sn_change_write"}],"answer":"b","explanation":"CIS role lists exist for a reason. Granting change_manager to the service desk is how standard-change controls die.","multi":false},{"id":"chg-t14","title":"Schedule vs actual","difficulty":"hard","format":"theory","kind":"theory","prompt":"work_start/work_end vs start_date/end_date (names vary by family). Implementation concern?","options":[{"id":"a","text":"There is only one date pair on change_request"},{"id":"b","text":"Planned window drives conflict/CAB; actual start/end drive KPIs. Copying one onto the other in a BR without process agreement breaks both conflict detection and MTTR-style reports"},{"id":"c","text":"Actual dates are display-only and never stored"},{"id":"d","text":"You should always setWorkflow(false) when setting dates"}],"answer":"b","explanation":"Know planned vs actual. Don’t “helpfully” stamp actual=planned on insert. Don’t run conflict on actuals.","multi":false},{"id":"chg-t15","title":"Flow vs BR for approvals","difficulty":"hard","format":"theory","kind":"theory","prompt":"Customer wants risk-based approvals. Interview preference?","options":[{"id":"a","text":"Always a 2,000-line Before BR generating sysapproval_approver rows"},{"id":"b","text":"Change model / Flow Designer / Approval rules — code only for gaps — so upgrades and CAB workbench keep working"},{"id":"c","text":"Client onSubmit that POSTs to sysapproval_approver via GlideAjax only"},{"id":"d","text":"Import set on each save"}],"answer":"b","explanation":"Configuration over code. Custom BR approvals often skip the workbench and break on family upgrades. Script Includes for reusable predicates, not the whole engine.","multi":false}]},{"id":"request","title":"Request & Catalog","blurb":"Service Catalog requests, RITMs, catalog tasks, variables, and request fulfillment.","questions":[{"id":"req-01","title":"Query open requested items","difficulty":"easy","kind":"server","prompt":"Query sc_req_item where active is true and state is not Closed Complete (3). Log the number of each RITM.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('sc_req_item');\ngr.addQuery('active', true);\ngr.addQuery('state', '!=', '3');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecord('sc_req_item')","message":"sc_req_item"},{"type":"includes","value":"addQuery('active', true)","message":"Active"},{"type":"includes","value":"addQuery('state', '!=', '3')","message":"Not closed complete"},{"type":"includes","value":".next()","message":"Iterate"}]},{"id":"req-02","title":"Create a catalog request and RITM","difficulty":"intermediate","kind":"server","prompt":"Insert sc_request for the current user (requested_for). Then insert sc_req_item linked via request, cat_item sys_id itemId, short_description \"Laptop request\".","starter":"var itemId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var itemId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar req = new GlideRecord('sc_request');\nreq.initialize();\nreq.setValue('requested_for', gs.getUserID());\nvar reqId = req.insert();\nvar ritm = new GlideRecord('sc_req_item');\nritm.initialize();\nritm.setValue('request', reqId);\nritm.setValue('cat_item', itemId);\nritm.setValue('short_description', 'Laptop request');\nritm.insert();","checks":[{"type":"includes","value":"new GlideRecord('sc_request')","message":"Create request"},{"type":"includes","value":"gs.getUserID()","message":"Current user"},{"type":"includes","value":"new GlideRecord('sc_req_item')","message":"Create RITM"},{"type":"includes","value":"cat_item","message":"Set cat_item"},{"type":"includes","value":"Laptop request","message":"Description"},{"type":"includes","value":"insert()","message":"Insert records"}]},{"id":"req-03","title":"Abort RITM close with open catalog tasks","difficulty":"intermediate","kind":"business_rule","prompt":"On sc_req_item, if state changes to Closed Complete (3) and any sc_task for this request_item is still active, abort and add an error.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('3')) {\n    var t = new GlideRecord('sc_task');\n    t.addQuery('request_item', current.getUniqueValue());\n    t.addQuery('active', true);\n    t.setLimit(1);\n    t.query();\n    if (t.hasNext()) {\n      gs.addErrorMessage('Close catalog tasks before closing the requested item.');\n      current.setAbortAction(true);\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('sc_task')","message":"Query sc_task"},{"type":"includes","value":"request_item","message":"Link to RITM"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"},{"type":"includes","value":"gs.addErrorMessage","message":"Error"}]},{"id":"req-04","title":"Set stage to fulfillment","difficulty":"easy","kind":"business_rule","prompt":"When assignment_group is set (changes and not nil), set stage to fulfillment.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.assignment_group.changes() && !current.assignment_group.nil()) {\n    current.setValue('stage', 'fulfillment');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"assignment_group.changes()","message":"Watch assignment_group"},{"type":"includes","value":"setValue('stage', 'fulfillment')","message":"Stage fulfillment"}]},{"id":"req-05","title":"Create a catalog task","difficulty":"easy","kind":"server","prompt":"Insert sc_task for RITM ritmId, short_description \"Procure hardware\", assignment_group looked up by name \"Hardware\".","starter":"var ritmId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var ritmId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar g = new GlideRecord('sys_user_group');\ng.get('name', 'Hardware');\nvar t = new GlideRecord('sc_task');\nt.initialize();\nt.setValue('request_item', ritmId);\nt.setValue('short_description', 'Procure hardware');\nt.setValue('assignment_group', g.getUniqueValue());\nt.insert();","checks":[{"type":"includes","value":"new GlideRecord('sc_task')","message":"sc_task"},{"type":"includes","value":"request_item","message":"Parent RITM"},{"type":"includes","value":"Procure hardware","message":"Description"},{"type":"includes","value":"Hardware","message":"Hardware group"}]},{"id":"req-06","title":"Cart API style: set quantity variable","difficulty":"intermediate","kind":"server","prompt":"Load sc_item_option_mtom is not required. Instead: GlideRecord sc_item_option where request_item = ritmId and item_option_new.name is \"quantity\". Set value to \"2\" and update. Use a join query or two-step query. Simple approach: query sc_item_option_mtom... For this lab, query sc_item_option with addQuery(\"request_item\", ritmId) and addQuery(\"item_option_new.name\", \"quantity\").","starter":"var ritmId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var ritmId = 'cccccccccccccccccccccccccccccccc';\nvar opt = new GlideRecord('sc_item_option');\nopt.addQuery('request_item', ritmId);\nopt.addQuery('item_option_new.name', 'quantity');\nopt.query();\nif (opt.next()) {\n  opt.setValue('value', '2');\n  opt.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('sc_item_option')","message":"Variable value table"},{"type":"includes","value":"quantity","message":"quantity variable"},{"type":"includes","value":"setValue('value', '2')","message":"Set quantity 2"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"req-07","title":"Client: hide delivery_address for pickup","difficulty":"easy","kind":"client","prompt":"onChange of delivery_method: if newValue is pickup, hide delivery_address; otherwise show it.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setDisplay('delivery_address', newValue != 'pickup');\n}","checks":[{"type":"includes","value":"g_form.setDisplay('delivery_address'","message":"Toggle delivery_address"},{"type":"includes","value":"pickup","message":"Pickup method"}]},{"id":"req-08","title":"Close request when all RITMs close","difficulty":"intermediate","kind":"server","prompt":"For request reqId, if no active sc_req_item remain, set the sc_request state to Closed Complete (3) and update.","starter":"var reqId = 'dddddddddddddddddddddddddddddddd';\n","solution":"var reqId = 'dddddddddddddddddddddddddddddddd';\nvar ritm = new GlideRecord('sc_req_item');\nritm.addQuery('request', reqId);\nritm.addQuery('active', true);\nritm.setLimit(1);\nritm.query();\nif (!ritm.hasNext()) {\n  var req = new GlideRecord('sc_request');\n  if (req.get(reqId)) {\n    req.setValue('request_state', 'closed_complete');\n    req.update();\n  }\n}","checks":[{"type":"includes","value":"new GlideRecord('sc_req_item')","message":"Check RITMs"},{"type":"includes","value":"new GlideRecord('sc_request')","message":"Update request"},{"type":"oneOf","values":["closed_complete","setValue('state', '3')","setValue('request_state'"],"message":"Close the request"},{"type":"includes","value":"update()","message":"Save request"}]},{"id":"req-09","title":"Event sc.request.opened","difficulty":"easy","kind":"business_rule","prompt":"On insert of sc_request, queue sc.request.opened with parm1 = requested_for display value.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  gs.eventQueue('sc.request.opened', current, current.requested_for.getDisplayValue(), '');\n})(current, previous);","checks":[{"type":"includes","value":"gs.eventQueue","message":"eventQueue"},{"type":"includes","value":"sc.request.opened","message":"Event name"},{"type":"includes","value":"requested_for","message":"Parm from requested_for"}]},{"id":"req-10","title":"Count RITMs per catalog item","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate sc_req_item COUNT grouped by cat_item. Log cat_item and count.","starter":"// Write your ServiceNow script below\n","solution":"var ga = new GlideAggregate('sc_req_item');\nga.addAggregate('COUNT');\nga.groupBy('cat_item');\nga.query();\nwhile (ga.next()) {\n  gs.info(ga.getValue('cat_item') + ' ' + ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('sc_req_item')","message":"Aggregate RITMs"},{"type":"includes","value":"groupBy('cat_item')","message":"Group by cat_item"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"},{"type":"includes","value":"getAggregate","message":"Read count"}]},{"id":"req-11","title":"GlideAjax: getItemPrice","difficulty":"intermediate","kind":"script_include","prompt":"CatalogAjax.getPrice reads sysparm_item, loads sc_cat_item, returns price field.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var CatalogAjax = Class.create();\nCatalogAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  getPrice: function() {\n    var id = this.getParameter('sysparm_item');\n    var item = new GlideRecord('sc_cat_item');\n    if (item.get(id)) {\n      return item.getValue('price');\n    }\n    return '0';\n  },\n  type: 'CatalogAjax'\n});","checks":[{"type":"includes","value":"getPrice","message":"getPrice"},{"type":"includes","value":"getParameter('sysparm_item')","message":"sysparm_item"},{"type":"includes","value":"new GlideRecord('sc_cat_item')","message":"Catalog item"},{"type":"includes","value":"getValue('price')","message":"Return price"}]},{"id":"req-12","title":"onSubmit: quantity max 5","difficulty":"easy","kind":"client","prompt":"If quantity is greater than 5, showError on quantity and return false. Use parseInt.","starter":"function onSubmit() {\n  return true;\n}\n","solution":"function onSubmit() {\n  var qty = parseInt(g_form.getValue('quantity'), 10);\n  if (qty > 5) {\n    g_form.showFieldMsg('quantity', 'Maximum quantity is 5', 'error');\n    return false;\n  }\n  return true;\n}","checks":[{"type":"includes","value":"g_form.getValue('quantity')","message":"Read quantity"},{"type":"includes","value":"parseInt","message":"parseInt"},{"type":"includes","value":"return false","message":"Block"},{"type":"includes","value":"showFieldMsg","message":"Field error"}]},{"id":"req-13","title":"Copy RITM comments to request","difficulty":"easy","kind":"business_rule","prompt":"When comments change on sc_req_item, set the parent sc_request comments to the same text (load request GlideRecord and update with setWorkflow false).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.comments.changes()) {\n    var req = new GlideRecord('sc_request');\n    if (req.get(current.getValue('request'))) {\n      req.comments = current.comments.getJournalEntry(1);\n      req.setWorkflow(false);\n      req.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('sc_request')","message":"Load request"},{"type":"includes","value":"comments","message":"Copy comments"},{"type":"includes","value":"setWorkflow(false)","message":"Avoid loops"}]},{"id":"req-14","title":"Encoded query: VIP requested_for","difficulty":"intermediate","kind":"server","prompt":"Query sc_request with addEncodedQuery requested_for.vip=true^active=true. Log numbers.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('sc_request');\ngr.addEncodedQuery('requested_for.vip=true^active=true');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecord('sc_request')","message":"sc_request"},{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"requested_for.vip=true","message":"VIP"}]},{"id":"req-15","title":"Cancel leftover tasks","difficulty":"intermediate","kind":"server","prompt":"For RITM ritmId, set all active sc_task state to Closed Incomplete (4) with setWorkflow(false).","starter":"var ritmId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\n","solution":"var ritmId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\nvar t = new GlideRecord('sc_task');\nt.addQuery('request_item', ritmId);\nt.addQuery('active', true);\nt.query();\nwhile (t.next()) {\n  t.setValue('state', '4');\n  t.setWorkflow(false);\n  t.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('sc_task')","message":"sc_task"},{"type":"includes","value":"request_item","message":"RITM"},{"type":"regex","value":{"__regex":true,"source":"setValue\\(\\s*['\"]state['\"]\\s*,\\s*['\"]4['\"]\\s*\\)","flags":""},"message":"State 4"},{"type":"includes","value":"setWorkflow(false)","message":"setWorkflow"}]},{"id":"req-16","title":"Set approval state","difficulty":"easy","kind":"server","prompt":"Load sysapproval_approver by sys_id appId and set state to approved, then update.","starter":"var appId = 'ffffffffffffffffffffffffffffffff';\n","solution":"var appId = 'ffffffffffffffffffffffffffffffff';\nvar app = new GlideRecord('sysapproval_approver');\nif (app.get(appId)) {\n  app.setValue('state', 'approved');\n  app.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('sysapproval_approver')","message":"Approver table"},{"type":"includes","value":"setValue('state', 'approved')","message":"Approved"},{"type":"includes","value":"update()","message":"Update"}]}],"theory":[{"id":"req-t01","title":"REQ / RITM / TASK","difficulty":"hard","format":"theory","kind":"theory","prompt":"An order guide creates one REQ with three items. Two items are fulfilled; one is waiting on approval. What is the correct state model thinking?","options":[{"id":"a","text":"The REQ must be Closed Complete because most items are done"},{"id":"b","text":"REQ stays open while any RITM is active; each RITM/sc_task has its own state/stage; closing the REQ while a RITM is in approval is a process bug"},{"id":"c","text":"sc_task always closes the REQ directly, skipping RITM"},{"id":"d","text":"Order guides cannot create multiple RITMs"}],"answer":"b","explanation":"CIS request fulfillment: Request is the cart header. RITMs are independently fulfilled (often different groups). Stage on RITM is not the same as state. Don’t auto-close REQ on first RITM complete.","multi":false},{"id":"req-t02","title":"Cart API vs GlideRecord insert","difficulty":"hard","format":"theory","kind":"theory","prompt":"A Scripted REST “order a laptop” inserts sc_request and sc_req_item with GlideRecord but variables and approvals never appear. Why?","options":[{"id":"a","text":"REST cannot create catalog records"},{"id":"b","text":"Raw inserts skip Cart/Record Producer/Flow processing (price, variables, approvals, requested_for cascade). Use CartJS / Cart API / Flow / the Service Catalog REST APIs"},{"id":"c","text":"You must set number manually to REQ1"},{"id":"d","text":"Variables only exist on incident"}],"answer":"b","explanation":"Community classic: GlideRecord into sc_req_item does not run the catalog engine. Missing sc_item_option rows, no workflow, wrong stage. Interview: name CartJS (or current family equivalent) and why.","multi":false},{"id":"req-t03","title":"Variable storage","difficulty":"hard","format":"theory","kind":"theory","prompt":"You need the “quantity” value in a Business Rule on sc_task. Naive current.quantity fails. Correct model?","options":[{"id":"a","text":"quantity is always on sc_task OOTB"},{"id":"b","text":"Variables are item_option_new definitions; values are sc_item_option / sc_item_option_mtom linked to the RITM — query those or use the Variable API / ritm.variables.quantity in server scripts where supported"},{"id":"c","text":"They are only in g_form and never stored"},{"id":"d","text":"They are stored in ecc_queue"}],"answer":"b","explanation":"Don’t add a custom quantity field on sc_task unless you copy it. Multi-row variables are even more tables (sc_multi_row_question_answer). Interviewers fail people who “addQuery quantity on sc_task.”","multi":false},{"id":"req-t04","title":"User criteria vs ACL","difficulty":"hard","format":"theory","kind":"theory","prompt":"A user cannot see a catalog item. Catalog client says “ACL is fine, they have itil.” Next checks?","options":[{"id":"a","text":"Only snc_read on sc_cat_item"},{"id":"b","text":"User Criteria on the item/category/catalog (Available For / Not Available For), including both match and not-match, and whether “Match All” is set — this is separate from table ACLs"},{"id":"c","text":"MID Server status"},{"id":"d","text":"Whether the item is a change model"}],"answer":"b","explanation":"CIS: user criteria is the catalog visibility engine. itil does not mean every item. “Not Available For” a group the user belongs to hides the item even if Available For is Everyone.","multi":false},{"id":"req-t05","title":"Approval on RITM vs REQ","difficulty":"hard","format":"theory","kind":"theory","prompt":"Cost-based approval: $50 item vs $5,000 item on the same REQ. Where should the approval sit?","options":[{"id":"a","text":"Only on the REQ so one manager approves the cart total once, always"},{"id":"b","text":"Usually on the RITM (or a mix): items have different owners/cost; a single REQ approval can under- or over-control. Know your Flow is bound to which table"},{"id":"c","text":"Approvals can only be on sc_task"},{"id":"d","text":"Catalog items cannot have approvals"}],"answer":"b","explanation":"Implementation choice. Cart-level approval is simpler; item-level is correct for different CIs/cost centers. If Flow triggers on sc_request, expensive items can slip through a cheap-cart rule.","multi":false},{"id":"req-t06","title":"requested_for cascade","difficulty":"hard","format":"theory","kind":"theory","prompt":"You change requested_for on the REQ after insert. RITM still shows the old user. Why?","options":[{"id":"a","text":"requested_for exists only on RITM, never REQ"},{"id":"b","text":"OOTB may copy requested_for to RITM on insert but not keep them in sync unless a BR/flow does; don’t assume cascade"},{"id":"c","text":"The platform always syncs them in Display BRs only"},{"id":"d","text":"You must use SOAP to sync"}],"answer":"b","explanation":"Data model trap. Test the family behavior; many customers add a BR. Notifications key off different fields on REQ vs RITM.","multi":false},{"id":"req-t07","title":"Order guides","difficulty":"hard","format":"theory","kind":"theory","prompt":"What problem do order guides solve that a single catalog item with 40 variables does not?","options":[{"id":"a","text":"They remove the need for sc_task"},{"id":"b","text":"They bundle multiple items with rule-based inclusion (e.g. laptop + headset + access) as separate RITMs with separate fulfillment"},{"id":"c","text":"They replace the CMDB"},{"id":"d","text":"They are only for knowledge"}],"answer":"b","explanation":"CIS request patterns: order guide vs record producer vs item. Record producer targets an arbitrary table (often incident). Order guide = multiple items.","multi":false},{"id":"req-t08","title":"Record producer vs catalog item","difficulty":"hard","format":"theory","kind":"theory","prompt":"HR wants “Report an issue” to create an incident, not a RITM. Correct artifact?","options":[{"id":"a","text":"sc_cat_item that fulfills to sc_task only"},{"id":"b","text":"Record Producer (or similar) targeting incident — not a fulfillment item that creates REQ/RITM unless you build a custom flow to convert"},{"id":"c","text":"Standard change template"},{"id":"d","text":"Import set on kb_knowledge"}],"answer":"b","explanation":"Interview: producers vs items. Using a generic item and then a BR that inserts incident and cancels the RITM is a hack that breaks reporting.","multi":false},{"id":"req-t09","title":"sc_task generation","difficulty":"hard","format":"theory","kind":"theory","prompt":"A RITM sits in fulfillment with zero catalog tasks. Typical causes?","options":[{"id":"a","text":"sc_task is not a real table"},{"id":"b","text":"No workflow/flow/execution running, flow error, approval not complete so fulfillment never started, or the item is a producer not a fulfillment item"},{"id":"c","text":"You need a MID Server to create tasks"},{"id":"d","text":"Tasks only generate if quantity > 5"}],"answer":"b","explanation":"Debug: workflow context, Flow execution, approval state, catalog item process engine (flow vs workflow). Don’t write a BR that inserts sc_task on every RITM unless you own that design.","multi":false},{"id":"req-t10","title":"Maintain item vs catch-all BR","difficulty":"hard","format":"theory","kind":"theory","prompt":"Every catalog item needs “if location is London, assignment_group = EU Desk.” Prefer?","options":[{"id":"a","text":"One global After BR on sc_req_item with 200 if/else item sys_ids"},{"id":"b","text":"Catalog Data Lookup / assignment in the item flow, or a data-driven lookup table, not a giant BR that must change every time a new item goes live"},{"id":"c","text":"Client script on the portal only"},{"id":"d","text":"Query BR that rewrites location to empty"}],"answer":"b","explanation":"Upgrade and catalog_editor independence. Hard-coded sys_ids in a BR are an interview smell.","multi":false},{"id":"req-t11","title":"Two-step vs three-step","difficulty":"hard","format":"theory","kind":"theory","prompt":"Some catalogs hide REQ from users (two-step). Implementation impact?","options":[{"id":"a","text":"RITM no longer exists"},{"id":"b","text":"You still have REQ in the database; reporting, approvals, and scripts that assume users open REQ in the native UI will confuse portal-only users"},{"id":"c","text":"sc_request table is dropped"},{"id":"d","text":"Variables move to incident"}],"answer":"b","explanation":"Property-driven checkout. Integrations inserting REQ still need the header. Train fulfillers on which number the customer sees (RITM vs REQ).","multi":false},{"id":"req-t12","title":"GlideAjax price","difficulty":"hard","format":"theory","kind":"theory","prompt":"Showing live price on a catalog client script. Why not GlideRecord the price on the client?","options":[{"id":"a","text":"Price is never on sc_cat_item"},{"id":"b","text":"Client GlideRecord is limited/discouraged; price may need quantity, currency, and discounts computed server-side — GlideAjax or Catalog Data Lookup"},{"id":"c","text":"Prices can only be retrieved via SOAPMessageV2"},{"id":"d","text":"g_form.getValue(\"price\") always works on Service Portal"}],"answer":"b","explanation":"Portal widgets != native g_form. Many APIs differ (g_form vs spUtil). Interview: name the UI you are on.","multi":false},{"id":"req-t13","title":"Closing tasks on cancel","difficulty":"hard","format":"theory","kind":"theory","prompt":"User cancels the RITM. Open sc_task remain Work in Progress. What’s the implementation defect?","options":[{"id":"a","text":"Expected; tasks never follow parent"},{"id":"b","text":"Cancel flow must cascade (BR/flow) to sc_task and possibly REQ; otherwise SLAs and workload reports lie"},{"id":"c","text":"You should delete the user instead"},{"id":"d","text":"Use IRE to retire the tasks"}],"answer":"b","explanation":"Same pattern as change_task. setWorkflow(false) may skip task notifications — decide intentionally.","multi":false},{"id":"req-t14","title":"sysapproval_approver vs asked_to","difficulty":"hard","format":"theory","kind":"theory","prompt":"Approval is “requested” but the manager never got it. Which is NOT the first thing to blame?","options":[{"id":"a","text":"Notification/event for approval.inserted disabled or user notification prefs"},{"id":"b","text":"The GlideRecord API itself cannot insert sysapproval_approver"},{"id":"c","text":"Approval assigned to a group with no members, or user inactive"},{"id":"d","text":"Email properties / SMTP"}],"answer":"b","explanation":"Approvals are records. Events fire notifications. Group approvals need members. Don’t start at “ServiceNow approvals are broken.”","multi":false},{"id":"req-t15","title":"Keep vs skip Cart","difficulty":"hard","format":"theory","kind":"theory","prompt":"High-volume integration creates 20k laptop orders/hour. CartJS per call is slow. Community-aligned pattern?","options":[{"id":"a","text":"20k CartJS calls in one user transaction"},{"id":"b","text":"Stage into an import set / queue table, transform asynchronously to catalog APIs or a dedicated fulfillment table; do not run full catalog engine inline per REST thread"},{"id":"c","text":"updateMultiple on sc_cat_item"},{"id":"d","text":"Only SOAP can scale"}],"answer":"b","explanation":"Community: Scripted REST should be thin. Import set + transform or async events. Per-row import sets can still explode — batch into one import set if you go that route.","multi":false}]},{"id":"knowledge","title":"Knowledge Management","blurb":"Author, publish, retire, and search knowledge articles used by ITSM.","questions":[{"id":"kb-01","title":"Query published articles in a KB","difficulty":"easy","kind":"server","prompt":"Query kb_knowledge where workflow_state is published and kb_knowledge_base name is \"IT\". Use addQuery with a join or encoded query kb_knowledge_base.name=IT. Log number and short_description.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('kb_knowledge');\ngr.addQuery('workflow_state', 'published');\ngr.addQuery('kb_knowledge_base.name', 'IT');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number') + ' ' + gr.getValue('short_description'));\n}","checks":[{"type":"includes","value":"new GlideRecord('kb_knowledge')","message":"kb_knowledge"},{"type":"includes","value":"addQuery('workflow_state', 'published')","message":"Published"},{"type":"includes","value":"kb_knowledge_base","message":"Knowledge base"},{"type":"includes","value":"IT","message":"IT knowledge base"}]},{"id":"kb-02","title":"Create a draft article","difficulty":"easy","kind":"server","prompt":"Insert kb_knowledge with short_description \"Reset VPN client\", text \"Reinstall the VPN profile.\", workflow_state draft, and kb_knowledge_base looked up by title/name \"IT\". Use get on kb_knowledge_base table (name field).","starter":"// Write your ServiceNow script below\n","solution":"var kb = new GlideRecord('kb_knowledge_base');\nkb.get('name', 'IT');\nvar art = new GlideRecord('kb_knowledge');\nart.initialize();\nart.setValue('short_description', 'Reset VPN client');\nart.setValue('text', 'Reinstall the VPN profile.');\nart.setValue('workflow_state', 'draft');\nart.setValue('kb_knowledge_base', kb.getUniqueValue());\nart.insert();","checks":[{"type":"includes","value":"new GlideRecord('kb_knowledge')","message":"Create article"},{"type":"includes","value":"Reset VPN client","message":"Title"},{"type":"includes","value":"draft","message":"Draft state"},{"type":"includes","value":"kb_knowledge_base","message":"Set KB"}]},{"id":"kb-03","title":"Retire expired articles","difficulty":"intermediate","kind":"server","prompt":"Query kb_knowledge where valid_to is before gs.nowDateTime() and workflow_state is published. Set workflow_state to retired and update each with setWorkflow(false).","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('kb_knowledge');\ngr.addQuery('workflow_state', 'published');\ngr.addQuery('valid_to', '\u003c', gs.nowDateTime());\ngr.query();\nwhile (gr.next()) {\n  gr.setValue('workflow_state', 'retired');\n  gr.setWorkflow(false);\n  gr.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('kb_knowledge')","message":"Articles"},{"type":"includes","value":"valid_to","message":"Expiration"},{"type":"includes","value":"retired","message":"Retire"},{"type":"includes","value":"setWorkflow(false)","message":"Skip extra workflow"}]},{"id":"kb-04","title":"Increment helpful count","difficulty":"easy","kind":"server","prompt":"Load article by sys_id kbId. Increment helpful_count by 1 (parseInt) and update.","starter":"var kbId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var kbId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar gr = new GlideRecord('kb_knowledge');\nif (gr.get(kbId)) {\n  var n = parseInt(gr.getValue('helpful_count') || '0', 10);\n  gr.setValue('helpful_count', n + 1);\n  gr.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('kb_knowledge')","message":"Load article"},{"type":"includes","value":"helpful_count","message":"helpful_count"},{"type":"includes","value":"parseInt","message":"parseInt"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"kb-05","title":"Abort publish without text","difficulty":"intermediate","kind":"business_rule","prompt":"If workflow_state changes to published and text is empty, abort and add an error.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.workflow_state.changesTo('published') && current.text.nil()) {\n    gs.addErrorMessage('Article body is required to publish.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('published')","message":"Publishing"},{"type":"oneOf","values":["text.nil()","getValue('text')"],"message":"Check text"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"kb-06","title":"Link article to incident","difficulty":"easy","kind":"server","prompt":"Set incident incId field knowledge to kbId (or caused_by / knowledge depending on instance). Use setValue(\"knowledge\", kbId) on incident and update.","starter":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar kbId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar kbId = 'cccccccccccccccccccccccccccccccc';\nvar inc = new GlideRecord('incident');\nif (inc.get(incId)) {\n  inc.setValue('knowledge', kbId);\n  inc.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Incident"},{"type":"includes","value":"setValue('knowledge'","message":"Set knowledge"},{"type":"includes","value":"kbId","message":"Use kbId"}]},{"id":"kb-07","title":"Record kb_feedback","difficulty":"easy","kind":"server","prompt":"Insert kb_feedback for article kbId with used_count not needed: set article, user gs.getUserID(), and commented true, comments \"Fixed my issue\".","starter":"var kbId = 'dddddddddddddddddddddddddddddddd';\n","solution":"var kbId = 'dddddddddddddddddddddddddddddddd';\nvar fb = new GlideRecord('kb_feedback');\nfb.initialize();\nfb.setValue('article', kbId);\nfb.setValue('user', gs.getUserID());\nfb.setValue('commented', true);\nfb.setValue('comments', 'Fixed my issue');\nfb.insert();","checks":[{"type":"includes","value":"new GlideRecord('kb_feedback')","message":"kb_feedback"},{"type":"includes","value":"article","message":"Article"},{"type":"includes","value":"Fixed my issue","message":"Comment"},{"type":"includes","value":"gs.getUserID()","message":"Current user"}]},{"id":"kb-08","title":"Client: category mandatory on publish","difficulty":"easy","kind":"client","prompt":"onChange workflow_state: if newValue is published, setMandatory topic or kb_category. Use field kb_category.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setMandatory('kb_category', newValue == 'published');\n}","checks":[{"type":"includes","value":"g_form.setMandatory('kb_category'","message":"kb_category mandatory"},{"type":"includes","value":"published","message":"When published"}]},{"id":"kb-09","title":"Search encoded query","difficulty":"intermediate","kind":"server","prompt":"addEncodedQuery workflow_state=published^short_descriptionLIKEVPN on kb_knowledge, orderByDesc sys_view_count, setLimit 5, log numbers.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('kb_knowledge');\ngr.addEncodedQuery('workflow_state=published^short_descriptionLIKEVPN');\ngr.orderByDesc('sys_view_count');\ngr.setLimit(5);\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"short_descriptionLIKEVPN","message":"LIKE VPN"},{"type":"includes","value":"orderByDesc('sys_view_count')","message":"Popular first"},{"type":"includes","value":"setLimit(5)","message":"Limit 5"}]},{"id":"kb-10","title":"GlideAjax canReadArticle","difficulty":"intermediate","kind":"script_include","prompt":"KBAjax.canRead: load kb_knowledge by sysparm_id, return \"true\" if canRead() else \"false\".","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var KBAjax = Class.create();\nKBAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  canRead: function() {\n    var id = this.getParameter('sysparm_id');\n    var gr = new GlideRecord('kb_knowledge');\n    if (gr.get(id) && gr.canRead()) {\n      return 'true';\n    }\n    return 'false';\n  },\n  type: 'KBAjax'\n});","checks":[{"type":"includes","value":"canRead","message":"canRead"},{"type":"includes","value":"getParameter('sysparm_id')","message":"sysparm_id"},{"type":"includes","value":"new GlideRecord('kb_knowledge')","message":"Article"},{"type":"includes","value":".canRead()","message":"ACL canRead"}]},{"id":"kb-11","title":"Event kb.published","difficulty":"easy","kind":"business_rule","prompt":"When workflow_state changes to published, queue kb.published with parm1 = number.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.workflow_state.changesTo('published')) {\n    gs.eventQueue('kb.published', current, current.getValue('number'), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.eventQueue","message":"eventQueue"},{"type":"includes","value":"kb.published","message":"Event"},{"type":"includes","value":"getValue('number')","message":"Number parm"}]},{"id":"kb-12","title":"Copy article to a new draft","difficulty":"intermediate","kind":"server","prompt":"Load kbId, insert a new kb_knowledge copying short_description and text, set workflow_state draft, short_description prefix \"Copy of \".","starter":"var kbId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\n","solution":"var kbId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\nvar src = new GlideRecord('kb_knowledge');\nif (src.get(kbId)) {\n  var copy = new GlideRecord('kb_knowledge');\n  copy.initialize();\n  copy.setValue('short_description', 'Copy of ' + src.getValue('short_description'));\n  copy.setValue('text', src.getValue('text'));\n  copy.setValue('workflow_state', 'draft');\n  copy.setValue('kb_knowledge_base', src.getValue('kb_knowledge_base'));\n  copy.insert();\n}","checks":[{"type":"includes","value":"Copy of ","message":"Prefix"},{"type":"includes","value":"setValue('text'","message":"Copy text"},{"type":"includes","value":"draft","message":"Draft"},{"type":"includes","value":"insert()","message":"Insert copy"}]},{"id":"kb-13","title":"onLoad: read-only published body","difficulty":"easy","kind":"client","prompt":"If workflow_state is published, setReadOnly text to true.","starter":"function onLoad() {\n\n}\n","solution":"function onLoad() {\n  if (g_form.getValue('workflow_state') == 'published') {\n    g_form.setReadOnly('text', true);\n  }\n}","checks":[{"type":"includes","value":"g_form.getValue('workflow_state')","message":"Read state"},{"type":"includes","value":"g_form.setReadOnly('text', true)","message":"Lock text"}]},{"id":"kb-14","title":"Count articles by author","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate COUNT on kb_knowledge groupBy author. Log author and count.","starter":"// Write your ServiceNow script below\n","solution":"var ga = new GlideAggregate('kb_knowledge');\nga.addAggregate('COUNT');\nga.groupBy('author');\nga.query();\nwhile (ga.next()) {\n  gs.info(ga.getValue('author') + ' ' + ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('kb_knowledge')","message":"Aggregate"},{"type":"includes","value":"groupBy('author')","message":"By author"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"}]},{"id":"kb-15","title":"Set valid_to 90 days out","difficulty":"intermediate","kind":"business_rule","prompt":"On insert, if valid_to is empty, set it to now plus 90 days using GlideDateTime addDaysUTC(90).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.valid_to.nil()) {\n    var gdt = new GlideDateTime();\n    gdt.addDaysUTC(90);\n    current.setValue('valid_to', gdt.getValue());\n  }\n})(current, previous);","checks":[{"type":"includes","value":"GlideDateTime","message":"GlideDateTime"},{"type":"includes","value":"addDaysUTC(90)","message":"Plus 90 days"},{"type":"includes","value":"valid_to","message":"Set valid_to"}]},{"id":"kb-16","title":"Prevent delete of published","difficulty":"easy","kind":"business_rule","prompt":"Before delete: if workflow_state is published, abort and add an error.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.getValue('workflow_state') == 'published') {\n    gs.addErrorMessage('Retire the article instead of deleting it.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"published","message":"Published check"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"},{"type":"includes","value":"gs.addErrorMessage","message":"Error"}]}],"theory":[{"id":"kb-t01","title":"kb_knowledge does not extend task","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why does that CIS note matter when writing a “close task when article publishes” integration?","options":[{"id":"a","text":"It does extend task; the note is wrong"},{"id":"b","text":"You cannot assume number/state/assignment_group/SLA fields from task; knowledge uses workflow_state, valid_to, kb_knowledge_base — different APIs and reporting"},{"id":"c","text":"Knowledge cannot be queried with GlideRecord"},{"id":"d","text":"You must store articles on incident"}],"answer":"b","explanation":"CIS-ITSM: kb_knowledge is not a task. Copy-paste incident BR patterns fail (no state 7, no assignment_group unless customized).","multi":false},{"id":"kb-t02","title":"One KB per article","difficulty":"hard","format":"theory","kind":"theory","prompt":"Can a single article belong to two knowledge bases?","options":[{"id":"a","text":"Yes, m2m is OOTB required"},{"id":"b","text":"No — an article is associated to a single kb_knowledge_base; categories nest inside a KB. Duplicate/publish separately or use taxonomy features by family, but don’t assume multi-KB on one row"},{"id":"c","text":"Yes if you set workflow_state twice"},{"id":"d","text":"Only if both KBs have the same manager"}],"answer":"b","explanation":"CIS: “A single article may not be associated with multiple knowledge bases.” Interviewers use this to catch people who treat KB like a tag.","multi":false},{"id":"kb-t03","title":"User criteria vs published","difficulty":"hard","format":"theory","kind":"theory","prompt":"Article is published but employees in Partner portal cannot see it. Likely cause?","options":[{"id":"a","text":"Published always means internet-public"},{"id":"b","text":"Can Read / Cannot Read user criteria, KB criteria, or portal widget instance options — publish is necessary but not sufficient"},{"id":"c","text":"valid_to in the future hides it"},{"id":"d","text":"helpful_count must be > 10"}],"answer":"b","explanation":"Same idea as catalog user criteria. Knowledge_admin seeing it in native UI proves nothing for the portal audience.","multi":false},{"id":"kb-t04","title":"kb_use","difficulty":"hard","format":"theory","kind":"theory","prompt":"What does kb_use actually measure, and what does it not do?","options":[{"id":"a","text":"It is the article body versioning table"},{"id":"b","text":"It tracks views/attaches to tasks (e.g. incidents); it does not close problems or prove the article fixed the root cause"},{"id":"c","text":"It stores transform map history"},{"id":"d","text":"It is a duplicate of sys_view"}],"answer":"b","explanation":"CIS tables: kb_use. Good for “attached to incident” KPIs. Bad as a problem-closure trigger.","multi":false},{"id":"kb-t05","title":"canRead in Script Include","difficulty":"hard","format":"theory","kind":"theory","prompt":"A widget lists published articles via GlideRecord without canRead() and shows HR articles to contractors. Fix?","options":[{"id":"a","text":"addQuery(\"workflow_state\", \"published\") is enough"},{"id":"b","text":"Use GlideRecordSecure or canRead() per row (and still query criteria-aware APIs where available); published is not an ACL"},{"id":"c","text":"gs.hasRole(\"knowledge\") hides HR automatically"},{"id":"d","text":"Client scripts cannot leak knowledge"}],"answer":"b","explanation":"Server widgets/scripted REST are the leak path. User criteria are not always identical to ACLs — test as the contractor.","multi":false},{"id":"kb-t06","title":"Retire vs delete","difficulty":"hard","format":"theory","kind":"theory","prompt":"Legal wants a published article gone from search but retained for eDiscovery. Correct action?","options":[{"id":"a","text":"deleteRecord() immediately"},{"id":"b","text":"Retire (workflow_state retired) / expire valid_to; block delete of published in a BR; deletion is for spam/drafts"},{"id":"c","text":"Set short_description to empty"},{"id":"d","text":"Move the row to ecc_queue"}],"answer":"b","explanation":"Audit: retired articles remain. Search filters on workflow_state. Delete loses history.","multi":false},{"id":"kb-t07","title":"valid_to and retroactive search","difficulty":"hard","format":"theory","kind":"theory","prompt":"A job retires articles where valid_to \u003c gs.nowDateTime() but uses getDisplayValue() in the query. Symptom?","options":[{"id":"a","text":"Perfect TZ handling"},{"id":"b","text":"Display vs internal mismatch; query with GlideDateTime/internal or encoded query javascript:gs.endOfToday() style — otherwise some locales never expire or expire early"},{"id":"c","text":"valid_to cannot be queried"},{"id":"d","text":"You must use SOAP to read dates"}],"answer":"b","explanation":"Same date discipline as change windows. Community is full of “expiry job doesn’t run in EU.”","multi":false},{"id":"kb-t08","title":"Versioning","difficulty":"hard","format":"theory","kind":"theory","prompt":"Authors edit a published article and users briefly see half-written steps. What OOTB-ish control are they missing?","options":[{"id":"a","text":"There is no versioning in ServiceNow knowledge"},{"id":"b","text":"Checkout/version or draft revision workflow so published stays immutable until a new version is approved — don’t update the live row in place without a process"},{"id":"c","text":"setWorkflow(false) on every update"},{"id":"d","text":"Store the body in work_notes of an incident"}],"answer":"b","explanation":"Knowledge versioning (family-dependent UI) exists because in-place edit of published is a production incident. Interview: describe checkout → review → publish.","multi":false},{"id":"kb-t09","title":"Global search vs encoded query","difficulty":"hard","format":"theory","kind":"theory","prompt":"addEncodedQuery(\"short_descriptionLIKEVPN\") misses articles whose VPN steps are only in text HTML. Why?","options":[{"id":"a","text":"LIKE never works on knowledge"},{"id":"b","text":"You searched the wrong field; body is text/html. Full-text/Zing indexing and ts_query APIs differ from field LIKE. Also HTML entities break naive LIKE"},{"id":"c","text":"You must use GlideAggregate"},{"id":"d","text":"Knowledge cannot be queried by text by design"}],"answer":"b","explanation":"Search architecture vs GlideRecord. For KCS, use the search API the portal uses, not a homemade LIKE on short_description.","multi":false},{"id":"kb-t10","title":"kb_category nesting","difficulty":"hard","format":"theory","kind":"theory","prompt":"Categories have parent-child. An article in a child category does not show in a widget that queries kb_category=parent. Why?","options":[{"id":"a","text":"Parent queries always include children OOTB"},{"id":"b","text":"The reference is usually a single category sys_id; you must query the subtree (parent OR child IDs), not assume hierarchical expansion"},{"id":"c","text":"Categories cannot nest"},{"id":"d","text":"Widgets cannot query kb_knowledge"}],"answer":"b","explanation":"CIS: categories nest. Code often doesn’t. Build the descendant list or use the platform knowledge category APIs.","multi":false},{"id":"kb-t11","title":"Display BR on knowledge","difficulty":"hard","format":"theory","kind":"theory","prompt":"A Display BR on kb_knowledge runs a GlideAggregate COUNT of all articles for a badge. Authors report 8-second form loads. Root issue?","options":[{"id":"a","text":"Display BRs are asynchronous and cannot affect load time"},{"id":"b","text":"Display BRs block form render; heavy queries here serialize every article open. Cache, client GlideAjax lazy-load, or drop the badge"},{"id":"c","text":"Use getRowCount on kb_knowledge in the client instead"},{"id":"d","text":"Move the COUNT into a Query BR"}],"answer":"b","explanation":"Developer docs: Display BRs must finish before the user gets the form. They are the wrong place for fleet-wide aggregates.","multi":false},{"id":"kb-t12","title":"Incident.knowledge field","difficulty":"hard","format":"theory","kind":"theory","prompt":"Some instances use knowledge on incident, others m2m / kb_use. Integration copies sys_id into a custom u_kb. Risk?","options":[{"id":"a","text":"No risk if the sys_id looks valid"},{"id":"b","text":"You bypass user criteria, kb_use analytics, and OOTB “used knowledge” related lists — reporting and licensing metrics go wrong"},{"id":"c","text":"Custom fields automatically feed kb_use"},{"id":"d","text":"u_kb is an OOTB mandatory field"}],"answer":"b","explanation":"Integrate with the documented related list/API. Custom references are invisible to ITSM dashboards.","multi":false},{"id":"kb-t13","title":"knowledge_manager vs knowledge","difficulty":"hard","format":"theory","kind":"theory","prompt":"Who should own user criteria on a confidential KB?","options":[{"id":"a","text":"Any itil fulfiller"},{"id":"b","text":"knowledge_admin / knowledge_manager (and user_criteria_admin as designed) — not every article author"},{"id":"c","text":"ecmdb_admin"},{"id":"d","text":"mid_server"}],"answer":"b","explanation":"CIS role list. Over-granting knowledge_admin is how payroll articles leak.","multi":false},{"id":"kb-t14","title":"Workflow_state vs valid_to both set","difficulty":"hard","format":"theory","kind":"theory","prompt":"workflow_state=published AND valid_to in the past. Search still shows it. What did you forget?","options":[{"id":"a","text":"The platform always hides expired published articles with no configuration"},{"id":"b","text":"Expiry is not magic: you need the job/BR/filter that treats valid_to, or search sources that exclude expired — otherwise state stays published"},{"id":"c","text":"valid_to is display-only"},{"id":"d","text":"Zing ignores all dates by design forever"}],"answer":"b","explanation":"Two fields, two engines. Implement the retirement job; don’t assume.","multi":false},{"id":"kb-t15","title":"Scripted REST returning HTML text","difficulty":"hard","format":"theory","kind":"theory","prompt":"You JSON.stringify article.text to a mobile app. XSS/HTML risk?","options":[{"id":"a","text":"JSON.stringify strips all HTML"},{"id":"b","text":"text is HTML; clients must sanitize. Also ACLs: leaking unpublished drafts via a Script Include that ignores canRead is a vulnerability"},{"id":"c","text":"Knowledge text is always plain text OOTB"},{"id":"d","text":"REST cannot return HTML fields"}],"answer":"b","explanation":"Security interview. Sanitize, canRead, don’t expose drafts, watch attachments separately (GlideSysAttachment).","multi":false}]},{"id":"cmdb","title":"CMDB & Configuration","blurb":"Configuration items, relationships, identification, and CI health used by ITSM.","questions":[{"id":"cmdb-01","title":"Query operational servers","difficulty":"easy","kind":"server","prompt":"Query cmdb_ci_server where operational_status is 1 (Operational). Log name.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('cmdb_ci_server');\ngr.addQuery('operational_status', '1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('name'));\n}","checks":[{"type":"includes","value":"new GlideRecord('cmdb_ci_server')","message":"Server CIs"},{"type":"includes","value":"operational_status","message":"Operational status"},{"type":"includes","value":"getValue('name')","message":"Log name"}]},{"id":"cmdb-02","title":"Create an application CI","difficulty":"easy","kind":"server","prompt":"Insert cmdb_ci_appl named \"Payroll Portal\", install_status 1. Log sys_id.","starter":"// Write your ServiceNow script below\n","solution":"var ci = new GlideRecord('cmdb_ci_appl');\nci.initialize();\nci.setValue('name', 'Payroll Portal');\nci.setValue('install_status', '1');\nvar id = ci.insert();\ngs.info(id);","checks":[{"type":"includes","value":"new GlideRecord('cmdb_ci_appl')","message":"Application CI"},{"type":"includes","value":"Payroll Portal","message":"Name"},{"type":"includes","value":"insert()","message":"Insert"}]},{"id":"cmdb-03","title":"Relate app Runs on::Runs server","difficulty":"intermediate","kind":"server","prompt":"Insert cmdb_rel_ci: parent = appId, child = serverId, type = the sys_id of the relationship type looked up from cmdb_rel_type where name is \"Runs on::Runs\". If lookup fails, still set parent and child.","starter":"var appId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar serverId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var appId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar serverId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar type = new GlideRecord('cmdb_rel_type');\ntype.get('name', 'Runs on::Runs');\nvar rel = new GlideRecord('cmdb_rel_ci');\nrel.initialize();\nrel.setValue('parent', appId);\nrel.setValue('child', serverId);\nrel.setValue('type', type.getUniqueValue());\nrel.insert();","checks":[{"type":"includes","value":"new GlideRecord('cmdb_rel_ci')","message":"Relationship table"},{"type":"includes","value":"setValue('parent', appId)","message":"Parent app"},{"type":"includes","value":"setValue('child', serverId)","message":"Child server"},{"type":"includes","value":"Runs on::Runs","message":"Relationship type name"}]},{"id":"cmdb-04","title":"Find CIs missing support group","difficulty":"easy","kind":"server","prompt":"Query cmdb_ci addNullQuery support_group, addActiveQuery or operational, setLimit 50, log names.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('cmdb_ci');\ngr.addNullQuery('support_group');\ngr.setLimit(50);\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('name'));\n}","checks":[{"type":"includes","value":"new GlideRecord('cmdb_ci')","message":"cmdb_ci"},{"type":"includes","value":"addNullQuery('support_group')","message":"Missing support group"},{"type":"includes","value":"setLimit(50)","message":"Limit 50"}]},{"id":"cmdb-05","title":"Set support group from assignment","difficulty":"easy","kind":"business_rule","prompt":"If support_group is empty and assignment_group is not, copy assignment_group to support_group.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.support_group.nil() && !current.assignment_group.nil()) {\n    current.setValue('support_group', current.getValue('assignment_group'));\n  }\n})(current, previous);","checks":[{"type":"includes","value":"support_group","message":"support_group"},{"type":"includes","value":"assignment_group","message":"assignment_group"},{"type":"includes","value":"setValue","message":"Copy the value"}]},{"id":"cmdb-06","title":"IRE identifyCI JSON","difficulty":"intermediate","kind":"server","prompt":"Build a JSON string payload with items array containing className cmdb_ci_linux_server and values name \"lxapp01\". Call IdentificationEngine.identifyCI(payload) and gs.info the result.","starter":"// Write your ServiceNow script below\n","solution":"var payload = JSON.stringify({\n  items: [\n    {\n      className: 'cmdb_ci_linux_server',\n      values: { name: 'lxapp01' }\n    }\n  ]\n});\nvar result = IdentificationEngine.identifyCI(payload);\ngs.info(result);","checks":[{"type":"includes","value":"IdentificationEngine.identifyCI","message":"IRE identifyCI"},{"type":"includes","value":"cmdb_ci_linux_server","message":"Linux server class"},{"type":"includes","value":"lxapp01","message":"CI name"},{"type":"includes","value":"JSON.stringify","message":"JSON payload"}]},{"id":"cmdb-07","title":"Count related incidents for a CI","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate COUNT incident where cmdb_ci = ciId and active true. Log count.","starter":"var ciId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var ciId = 'cccccccccccccccccccccccccccccccc';\nvar ga = new GlideAggregate('incident');\nga.addQuery('cmdb_ci', ciId);\nga.addQuery('active', true);\nga.addAggregate('COUNT');\nga.query();\nif (ga.next()) {\n  gs.info(ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('incident')","message":"Aggregate incidents"},{"type":"includes","value":"cmdb_ci","message":"CI filter"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"}]},{"id":"cmdb-08","title":"Client: serial number mandatory for hardware","difficulty":"easy","kind":"client","prompt":"onLoad on cmdb_ci_hardware: setMandatory serial_number true.","starter":"function onLoad() {\n\n}\n","solution":"function onLoad() {\n  g_form.setMandatory('serial_number', true);\n}","checks":[{"type":"includes","value":"g_form.setMandatory('serial_number', true)","message":"Mandatory serial"}]},{"id":"cmdb-09","title":"Retire CI and related relationships","difficulty":"intermediate","kind":"server","prompt":"Set CI ciId install_status to 7 (Retired). Delete cmdb_rel_ci where parent or child is ciId using two queries or addEncodedQuery parent=ciId^ORchild=ciId then deleteMultiple.","starter":"var ciId = 'dddddddddddddddddddddddddddddddd';\n","solution":"var ciId = 'dddddddddddddddddddddddddddddddd';\nvar ci = new GlideRecord('cmdb_ci');\nif (ci.get(ciId)) {\n  ci.setValue('install_status', '7');\n  ci.update();\n}\nvar rel = new GlideRecord('cmdb_rel_ci');\nrel.addEncodedQuery('parent=' + ciId + '^ORchild=' + ciId);\nrel.deleteMultiple();","checks":[{"type":"includes","value":"setValue('install_status', '7')","message":"Retire status 7"},{"type":"includes","value":"new GlideRecord('cmdb_rel_ci')","message":"Relationships"},{"type":"includes","value":"deleteMultiple()","message":"Delete relationships"},{"type":"includes","value":"^OR","message":"Parent or child"}]},{"id":"cmdb-10","title":"Encoded query: Windows OS","difficulty":"easy","kind":"server","prompt":"Query cmdb_ci_computer addEncodedQuery osLIKEWindows^operational_status=1. Log names.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('cmdb_ci_computer');\ngr.addEncodedQuery('osLIKEWindows^operational_status=1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('name'));\n}","checks":[{"type":"includes","value":"new GlideRecord('cmdb_ci_computer')","message":"Computers"},{"type":"includes","value":"osLIKEWindows","message":"Windows OS"},{"type":"includes","value":"operational_status=1","message":"Operational"}]},{"id":"cmdb-11","title":"GlideAjax getCISupportGroup","difficulty":"intermediate","kind":"script_include","prompt":"CMDBAjax.supportGroup reads sysparm_ci, returns support_group sys_id.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var CMDBAjax = Class.create();\nCMDBAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  supportGroup: function() {\n    var id = this.getParameter('sysparm_ci');\n    var ci = new GlideRecord('cmdb_ci');\n    if (ci.get(id)) {\n      return ci.getValue('support_group');\n    }\n    return '';\n  },\n  type: 'CMDBAjax'\n});","checks":[{"type":"includes","value":"supportGroup","message":"Method"},{"type":"includes","value":"getParameter('sysparm_ci')","message":"sysparm_ci"},{"type":"includes","value":"getValue('support_group')","message":"support_group"}]},{"id":"cmdb-12","title":"Event cmdb.ci.retired","difficulty":"easy","kind":"business_rule","prompt":"When install_status changes to 7, queue cmdb.ci.retired with parm1 = name.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.install_status.changesTo('7')) {\n    gs.eventQueue('cmdb.ci.retired', current, current.getValue('name'), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('7')","message":"Retired"},{"type":"includes","value":"gs.eventQueue","message":"Event"},{"type":"includes","value":"cmdb.ci.retired","message":"Event name"}]},{"id":"cmdb-13","title":"Duplicate name check","difficulty":"intermediate","kind":"business_rule","prompt":"Before insert, query cmdb_ci for the same name. If found, abort with an error.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var gr = new GlideRecord('cmdb_ci');\n  gr.addQuery('name', current.getValue('name'));\n  gr.setLimit(1);\n  gr.query();\n  if (gr.hasNext()) {\n    gs.addErrorMessage('A CI with this name already exists.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('cmdb_ci')","message":"Query CIs"},{"type":"includes","value":"addQuery('name'","message":"Same name"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"cmdb-14","title":"Walk child CIs","difficulty":"intermediate","kind":"server","prompt":"Query cmdb_rel_ci where parent is ciId. For each, load child cmdb_ci and gs.info the child name.","starter":"var ciId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\n","solution":"var ciId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\nvar rel = new GlideRecord('cmdb_rel_ci');\nrel.addQuery('parent', ciId);\nrel.query();\nwhile (rel.next()) {\n  var child = new GlideRecord('cmdb_ci');\n  if (child.get(rel.getValue('child'))) {\n    gs.info(child.getValue('name'));\n  }\n}","checks":[{"type":"includes","value":"new GlideRecord('cmdb_rel_ci')","message":"Relationships"},{"type":"includes","value":"addQuery('parent', ciId)","message":"Children of parent"},{"type":"includes","value":"new GlideRecord('cmdb_ci')","message":"Load child CI"},{"type":"includes","value":"getValue('name')","message":"Log name"}]},{"id":"cmdb-15","title":"createOrUpdateCI","difficulty":"intermediate","kind":"server","prompt":"Call IdentificationEngine.createOrUpdateCI with source \"ServiceNow\" and a JSON payload for cmdb_ci_win_server named \"winapp01\".","starter":"// Write your ServiceNow script below\n","solution":"var payload = JSON.stringify({\n  items: [\n    { className: 'cmdb_ci_win_server', values: { name: 'winapp01' } }\n  ]\n});\nvar result = IdentificationEngine.createOrUpdateCI('ServiceNow', payload);\ngs.info(result);","checks":[{"type":"includes","value":"IdentificationEngine.createOrUpdateCI","message":"createOrUpdateCI"},{"type":"includes","value":"ServiceNow","message":"Source"},{"type":"includes","value":"cmdb_ci_win_server","message":"Windows server"},{"type":"includes","value":"winapp01","message":"Name"}]},{"id":"cmdb-16","title":"onChange: warn if CI retired","difficulty":"easy","kind":"client","prompt":"onChange of cmdb_ci on incident: getReference callback; if operational_status is 6 (Retired) showFieldMsg on cmdb_ci error.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n  g_form.getReference('cmdb_ci', function(ci) {\n    if (ci.operational_status == '6') {\n      g_form.showFieldMsg('cmdb_ci', 'Selected CI is retired', 'error');\n    }\n  });\n}","checks":[{"ty
