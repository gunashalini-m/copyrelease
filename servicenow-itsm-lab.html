<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ServiceNow ITSM Script Lab</title>
  <style>:root {
  --bg: #071412;
  --panel: #0f2420;
  --panel-2: #12302b;
  --line: #1e4a43;
  --text: #e7f2ee;
  --muted: #8fb3ab;
  --accent: #62d84e;
  --accent-2: #81b5a1;
  --danger: #ff6b6b;
  --warn: #f0c14b;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: radial-gradient(1200px 600px at 10% -10%, #143c33 0%, var(--bg) 55%);
  color: var(--text);
  font-family: Inter, system-ui, sans-serif;
}

.app {
  display: grid;
  grid-template-columns: 260px 300px 1fr;
  min-height: 100%;
}

.sidebar,
.mid {
  border-right: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 88%, black);
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 20px 16px 12px;
}

.brand p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.dl {
  color: var(--accent);
  font-size: 12px;
}

.logo {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--accent), #1f8f5f);
  color: #06210f;
  font-weight: 700;
}

.topic-nav {
  display: flex;
  flex-direction: column;
  padding: 8px;
  gap: 6px;
  max-height: calc(100vh - 140px);
  overflow: auto;
}

.nav-heading {
  margin: 10px 8px 2px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.q-kind {
  font-size: 11px;
  text-transform: uppercase;
  color: var(--accent-2);
}

.topic,
.q-item,
.btn {
  border: 0;
  cursor: pointer;
  font: inherit;
}

.topic {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  text-align: left;
  padding: 10px 12px;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
}

.topic:hover,
.q-item:hover {
  background: var(--panel-2);
}

.topic.active,
.q-item.active {
  background: #1a4a3d;
  box-shadow: inset 0 0 0 1px #2f7a64;
}

.topic-count,
.q-diff,
.q-idx {
  color: var(--muted);
  font-size: 12px;
}

.mid-head {
  padding: 20px 16px 8px;
}

.mode-toggle {
  display: flex;
  gap: 8px;
  padding: 0 16px 8px;
}

.mode-toggle .btn.active {
  background: var(--accent);
  color: #06210f;
  font-weight: 600;
}

.theory-box {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 8px 0 0;
}

.theory-option {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  cursor: pointer;
  color: var(--text);
}

.theory-option:hover,
.theory-option.selected {
  border-color: #2f7a64;
  background: #1a4a3d;
}

.theory-option input {
  margin-top: 3px;
}

.progress {
  color: var(--accent-2);
  font-size: 13px;
}

.question-list {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: calc(100vh - 120px);
  overflow: auto;
}

.q-item {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  text-align: left;
}

.q-item.passed .q-idx {
  color: var(--accent);
}

.q-name {
  font-size: 13px;
}

.main {
  padding: 20px 24px 40px;
  min-width: 0;
}

.main-head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
}

.main-head h1 {
  margin: 4px 0 0;
  font-size: 26px;
  letter-spacing: -0.03em;
}

.crumb,
.muted {
  color: var(--muted);
  font-size: 13px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn {
  padding: 8px 12px;
  border-radius: 8px;
  color: var(--text);
}

.btn.ghost {
  background: var(--panel-2);
  box-shadow: inset 0 0 0 1px var(--line);
}

.btn.primary {
  background: var(--accent);
  color: #06210f;
  font-weight: 600;
}

.prompt,
.hint {
  line-height: 1.55;
  max-width: 90ch;
}

.hint {
  color: var(--accent-2);
}

.editor {
  height: min(48vh, 460px);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}

.fallback {
  width: 100%;
  height: 100%;
  background: #0d1f1c;
  color: var(--text);
  border: 0;
  padding: 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
}

.grade-box {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
}

.grade-box.ok {
  border-color: #2f7a64;
}

.grade-box.fail {
  border-color: #7a2f2f;
}

.grade-head {
  font-weight: 600;
  margin-bottom: 8px;
}

.grade-box ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.grade-box li {
  display: flex;
  gap: 10px;
  padding: 6px 0;
  border-top: 1px solid var(--line);
  font-size: 14px;
}

.grade-box li span {
  min-width: 42px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.grade-box li.ok span {
  color: var(--accent);
}

.grade-box li.fail span {
  color: var(--danger);
}

.solution {
  margin-top: 16px;
  background: var(--panel);
  border: 1px dashed var(--accent-2);
  border-radius: 12px;
  padding: 12px 16px;
}

.solution pre {
  overflow: auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  white-space: pre-wrap;
}

@media (max-width: 1100px) {
  .app {
    grid-template-columns: 1fr;
  }

  .question-list {
    max-height: 220px;
  }
}

body { font-family: system-ui, sans-serif; }
.editor {
  position: relative;
  height: min(48vh, 460px);
}
#code {
  width: 100%;
  height: 100%;
  resize: none;
  background: #0d1f1c;
  color: var(--text);
  border: 0;
  padding: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 14px;
  line-height: 1.45;
  outline: none;
}
#ac-menu {
  position: absolute;
  left: 12px;
  bottom: 12px;
  max-height: 220px;
  overflow: auto;
  min-width: 280px;
  background: #12302b;
  border: 1px solid #2f7a64;
  border-radius: 8px;
  box-shadow: var(--shadow);
  z-index: 5;
}
.ac-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--text);
  padding: 8px 10px;
  border: 0;
  font: inherit;
  cursor: pointer;
}
.ac-item span {
  color: var(--muted);
  font-size: 12px;
}
.ac-item.active, .ac-item:hover {
  background: #1a4a3d;
}
.save-note {
  margin: 0 16px 8px;
  font-size: 12px;
  color: var(--muted);
}
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">SN</div>
        <div>
          <strong>ITSM Script Lab</strong>
          <p>Practice · Autocomplete · Instant grade</p>
        </div>
      </div>
      <p class="save-note">Offline file — double-click to open. Progress stays in this browser.</p>
      <div id="topic-nav" class="topic-nav"></div>
    </aside>
    <section class="mid">
      <header class="mid-head">
        <p id="blurb" class="muted"></p>
        <p id="progress-label" class="progress"></p>
      </header>
      <div id="mode-toggle" class="mode-toggle">
        <button type="button" class="btn ghost active" data-mode="code">Code</button>
        <button type="button" class="btn ghost" data-mode="theory">Theory</button>
      </div>
      <div id="question-list" class="question-list"></div>
    </section>
    <main class="main">
      <header class="main-head">
        <div>
          <p id="crumb" class="crumb"></p>
          <h1 id="q-title"></h1>
        </div>
        <div class="actions">
          <button id="next-btn" class="btn ghost" type="button">Next</button>
          <button id="reset-btn" class="btn ghost" type="button">Reset</button>
          <button id="reveal-btn" class="btn ghost" type="button">Show solution</button>
          <button id="apply-btn" class="btn ghost" type="button">Copy solution into editor</button>
          <button id="grade-btn" class="btn primary" type="button">Grade</button>
        </div>
      </header>
      <p id="q-prompt" class="prompt"></p>
      <p id="hint" class="hint" hidden></p>
      <div id="theory-box" class="theory-box" hidden></div>
      <div id="editor" class="editor">
        <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
        <div id="ac-menu" hidden></div>
      </div>
      <section id="grade-results" class="grade-box"></section>
      <section id="solution-pane" class="solution" hidden>
        <h2>Reference solution</h2>
        <pre id="solution-code"></pre>
      </section>
    </main>
  </div>
  <script>
    const TOPICS = [{"id":"incident","title":"Incident Management","blurb":"Query, route, escalate, and close incidents with GlideRecord, Business Rules, and client scripts.","questions":[{"id":"inc-01","title":"Query active Priority 1 incidents","difficulty":"easy","kind":"server","prompt":"Write a server script that queries the incident table for active Priority 1 records and logs each incident number with gs.info.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\ngr.addQuery('active', true);\ngr.addQuery('priority', '1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Create a GlideRecord on incident"},{"type":"includes","value":"addQuery","message":"Filter with addQuery"},{"type":"oneOf","values":["addQuery('active'","addActiveQuery()"],"message":"Limit to active incidents"},{"type":"regex","value":{"__regex":true,"source":"addQuery\\(\\s*['\"]priority['\"]\\s*,\\s*['\"]1['\"]\\s*\\)","flags":""},"message":"Filter priority 1"},{"type":"includes","value":"query()","message":"Call query()"},{"type":"includes","value":".next()","message":"Iterate with next()"},{"type":"includes","value":"gs.info","message":"Log with gs.info"}],"hint":"Use two addQuery calls (or addActiveQuery) then while (gr.next())."},{"id":"inc-02","title":"Create an incident for the current user","difficulty":"easy","kind":"server","prompt":"Insert a new incident: short_description \"Email outage\", caller_id = the current user, impact 2, urgency 2. Insert and log the new number.","starter":"// Write your ServiceNow script below\n","solution":"var inc = new GlideRecord('incident');\ninc.initialize();\ninc.setValue('short_description', 'Email outage');\ninc.setValue('caller_id', gs.getUserID());\ninc.setValue('impact', '2');\ninc.setValue('urgency', '2');\ninc.insert();\ngs.info(inc.getValue('number'));","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Use the incident table"},{"type":"oneOf","values":["initialize()","newRecord()"],"message":"Initialize a new record"},{"type":"includes","value":"short_description","message":"Set short_description"},{"type":"includes","value":"Email outage","message":"Use the specified short description"},{"type":"includes","value":"caller_id","message":"Set caller_id"},{"type":"includes","value":"gs.getUserID()","message":"Caller is the current user"},{"type":"includes","value":"impact","message":"Set impact"},{"type":"includes","value":"urgency","message":"Set urgency"},{"type":"includes","value":"insert()","message":"Insert the record"}],"hint":"initialize(), setValue for each field, then insert()."},{"id":"inc-03","title":"Business Rule: abort close without close notes","difficulty":"intermediate","kind":"business_rule","prompt":"On incident, when state changes to Closed (7), abort the action if close_notes is empty and add an error message telling the user to enter close notes.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('7') && current.close_notes.nil()) {\n    gs.addErrorMessage('Enter close notes before closing the incident.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"oneOf","values":["changesTo('7')","changesTo(7)","getValue('state')"],"message":"Detect close (state 7)"},{"type":"oneOf","values":["close_notes.nil()","gs.nil(current.close_notes)","getValue('close_notes')"],"message":"Check close_notes"},{"type":"includes","value":"gs.addErrorMessage","message":"Show an error message"},{"type":"includes","value":"setAbortAction(true)","message":"Abort the update"}],"hint":"current.state.changesTo('7') and current.close_notes.nil()."},{"id":"inc-04","title":"Auto-assign Service Desk group","difficulty":"easy","kind":"business_rule","prompt":"Before insert on incident: if assignment_group is empty, set it to the sys_user_group whose name is \"Service Desk\".","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.assignment_group.nil()) {\n    var grp = new GlideRecord('sys_user_group');\n    if (grp.get('name', 'Service Desk')) {\n      current.setValue('assignment_group', grp.getUniqueValue());\n    }\n  }\n})(current, previous);","checks":[{"type":"oneOf","values":["assignment_group.nil()","gs.nil(current.assignment_group)"],"message":"Check empty assignment_group"},{"type":"includes","value":"new GlideRecord('sys_user_group')","message":"Look up sys_user_group"},{"type":"includes","value":"Service Desk","message":"Find the Service Desk group"},{"type":"includes","value":"assignment_group","message":"Set assignment_group"},{"type":"oneOf","values":["getUniqueValue()","grp.sys_id","grp.getValue('sys_id')"],"message":"Use the group sys_id"}],"hint":"grp.get('name', 'Service Desk') then set assignment_group."},{"id":"inc-05","title":"Copy work notes into additional comments","difficulty":"easy","kind":"business_rule","prompt":"When work_notes changes on an incident, append the same text to additional_comments (comments).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.work_notes.changes()) {\n    current.comments = current.work_notes.getJournalEntry(1);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"work_notes.changes()","message":"Run when work_notes changes"},{"type":"oneOf","values":["current.comments","setValue('comments'","setValue('additional_comments'"],"message":"Write additional comments"},{"type":"oneOf","values":["getJournalEntry","work_notes"],"message":"Use the work notes value"}],"hint":"Journal fields: getJournalEntry(1) for the latest entry."},{"id":"inc-06","title":"Count open incidents for a CI","difficulty":"intermediate","kind":"server","prompt":"Given a CI sys_id in variable ciId, use GlideAggregate to count active incidents where cmdb_ci equals that CI. Log the count.","starter":"var ciId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var ciId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar ga = new GlideAggregate('incident');\nga.addQuery('cmdb_ci', ciId);\nga.addQuery('active', true);\nga.addAggregate('COUNT');\nga.query();\nif (ga.next()) {\n  gs.info(ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('incident')","message":"Use GlideAggregate on incident"},{"type":"includes","value":"cmdb_ci","message":"Filter on cmdb_ci"},{"type":"includes","value":"ciId","message":"Use the provided CI sys_id"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT aggregate"},{"type":"includes","value":"getAggregate","message":"Read the aggregate"},{"type":"includes","value":"gs.info","message":"Log the result"}],"hint":"addAggregate('COUNT') then getAggregate('COUNT')."},{"id":"inc-07","title":"Client script: mandatory description on P1","difficulty":"easy","kind":"client","prompt":"onChange of priority: if the new value is 1, make description mandatory; otherwise not mandatory.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setMandatory('description', newValue == '1');\n}","checks":[{"type":"includes","value":"g_form.setMandatory","message":"Use g_form.setMandatory"},{"type":"includes","value":"description","message":"Target the description field"},{"type":"oneOf","values":["newValue == '1'","newValue === '1'","newValue == 1","newValue === '1'"],"message":"When priority is 1"}],"hint":"g_form.setMandatory('description', newValue == '1')."},{"id":"inc-08","title":"Escalate to a major incident","difficulty":"intermediate","kind":"server","prompt":"Load incident INC0000001 by number. Set major_incident_state to \"accepted\", impact to 1, urgency to 1, and update the record.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\nif (gr.get('number', 'INC0000001')) {\n  gr.setValue('major_incident_state', 'accepted');\n  gr.setValue('impact', '1');\n  gr.setValue('urgency', '1');\n  gr.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Query incident"},{"type":"includes","value":"INC0000001","message":"Look up INC0000001"},{"type":"includes","value":"major_incident_state","message":"Set major incident state"},{"type":"includes","value":"accepted","message":"Accepted major incident"},{"type":"includes","value":"update()","message":"Save the record"}],"hint":"gr.get('number', 'INC0000001')."},{"id":"inc-09","title":"Reopen a resolved incident","difficulty":"easy","kind":"server","prompt":"For a given incident sys_id in incId, if state is Resolved (6), set state to In Progress (2), clear resolved_at, and update.","starter":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar gr = new GlideRecord('incident');\nif (gr.get(incId) && gr.getValue('state') == '6') {\n  gr.setValue('state', '2');\n  gr.setValue('resolved_at', '');\n  gr.update();\n}","checks":[{"type":"includes","value":".get(","message":"Load by sys_id"},{"type":"oneOf","values":["getValue('state')","gr.state"],"message":"Read state"},{"type":"regex","value":{"__regex":true,"source":"setValue\\(\\s*['\"]state['\"]\\s*,\\s*['\"]2['\"]\\s*\\)|state\\s*=\\s*['\"]2['\"]","flags":""},"message":"Set state to 2"},{"type":"includes","value":"resolved_at","message":"Clear resolved_at"},{"type":"includes","value":"update()","message":"Update"}],"hint":"Check state == 6 before setting state to 2."},{"id":"inc-10","title":"Queue an incident assigned event","difficulty":"intermediate","kind":"business_rule","prompt":"When assigned_to changes to a non-empty value, queue event incident.assigned with parm1 = assigned_to user name and parm2 = incident number.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.assigned_to.changes() && !current.assigned_to.nil()) {\n    gs.eventQueue(\n      'incident.assigned',\n      current,\n      current.assigned_to.getDisplayValue(),\n      current.getValue('number')\n    );\n  }\n})(current, previous);","checks":[{"type":"includes","value":"assigned_to.changes()","message":"Watch assigned_to"},{"type":"includes","value":"gs.eventQueue","message":"Queue an event"},{"type":"includes","value":"incident.assigned","message":"Event name incident.assigned"},{"type":"includes","value":"current","message":"Pass the incident record"}],"hint":"gs.eventQueue(name, current, parm1, parm2)."},{"id":"inc-11","title":"GlideAjax: open incident count","difficulty":"intermediate","kind":"script_include","prompt":"Client-callable Script Include IncidentUtilsAjax with method getOpenCount. Read sysparm_caller, count active incidents for that caller_id, return the count as a string.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var IncidentUtilsAjax = Class.create();\nIncidentUtilsAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  getOpenCount: function() {\n    var caller = this.getParameter('sysparm_caller');\n    var ga = new GlideAggregate('incident');\n    ga.addQuery('caller_id', caller);\n    ga.addQuery('active', true);\n    ga.addAggregate('COUNT');\n    ga.query();\n    return ga.next() ? ga.getAggregate('COUNT') : '0';\n  },\n  type: 'IncidentUtilsAjax'\n});","checks":[{"type":"includes","value":"AbstractAjaxProcessor","message":"Extend AbstractAjaxProcessor"},{"type":"includes","value":"getOpenCount","message":"Implement getOpenCount"},{"type":"includes","value":"getParameter('sysparm_caller')","message":"Read sysparm_caller"},{"type":"oneOf","values":["GlideAggregate","GlideRecord"],"message":"Query incidents"},{"type":"includes","value":"caller_id","message":"Filter by caller"}],"hint":"this.getParameter('sysparm_caller') then GlideAggregate COUNT."},{"id":"inc-12","title":"Parent incident close child incidents","difficulty":"intermediate","kind":"business_rule","prompt":"After update: if this incident is a parent (parent_incident is empty) and state changes to Closed (7), close all child incidents whose parent_incident is this record (state 7, close_code \"Closed/Resolved by parent\"). Use updateMultiple or a loop with setWorkflow(false) to avoid recursion.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.parent_incident.nil() && current.state.changesTo('7')) {\n    var child = new GlideRecord('incident');\n    child.addQuery('parent_incident', current.getUniqueValue());\n    child.addQuery('active', true);\n    child.query();\n    while (child.next()) {\n      child.setValue('state', '7');\n      child.setValue('close_code', 'Closed/Resolved by parent');\n      child.setWorkflow(false);\n      child.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Query child incidents"},{"type":"includes","value":"parent_incident","message":"Match parent_incident"},{"type":"regex","value":{"__regex":true,"source":"setValue\\(\\s*['\"]state['\"]\\s*,\\s*['\"]7['\"]\\s*\\)|state\\s*=\\s*['\"]7['\"]","flags":""},"message":"Close children (state 7)"},{"type":"includes","value":"close_code","message":"Set close_code"},{"type":"oneOf","values":["setWorkflow(false)","updateMultiple()"],"message":"Avoid recursive engines or use updateMultiple"}],"hint":"Query parent_incident = current.sys_id, then update each child."},{"id":"inc-13","title":"Priority from impact and urgency","difficulty":"intermediate","kind":"business_rule","prompt":"If impact is 1 and urgency is 1, set priority to 1. If either impact or urgency is 1 and the other is 2, set priority to 2. Otherwise leave priority unchanged. Use getValue/setValue.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var impact = current.getValue('impact');\n  var urgency = current.getValue('urgency');\n  if (impact == '1' && urgency == '1') {\n    current.setValue('priority', '1');\n  } else if ((impact == '1' && urgency == '2') || (impact == '2' && urgency == '1')) {\n    current.setValue('priority', '2');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"getValue('impact')","message":"Read impact"},{"type":"includes","value":"getValue('urgency')","message":"Read urgency"},{"type":"includes","value":"setValue('priority'","message":"Set priority"},{"type":"regex","value":{"__regex":true,"source":"priority['\"]\\s*,\\s*['\"]1['\"]","flags":""},"message":"Set priority 1 for 1/1"},{"type":"regex","value":{"__regex":true,"source":"priority['\"]\\s*,\\s*['\"]2['\"]","flags":""},"message":"Set priority 2 for mixed 1 and 2"}],"hint":"Compare impact/urgency strings, then setValue('priority', ...)."},{"id":"inc-14","title":"onSubmit: block empty assignment","difficulty":"easy","kind":"client","prompt":"onSubmit client script: if assignment_group is empty, show an error message and return false. Otherwise return true.","starter":"function onSubmit() {\n  return true;\n}\n","solution":"function onSubmit() {\n  if (!g_form.getValue('assignment_group')) {\n    g_form.addErrorMessage('Assignment group is required.');\n    return false;\n  }\n  return true;\n}","checks":[{"type":"includes","value":"g_form.getValue('assignment_group')","message":"Read assignment_group"},{"type":"includes","value":"g_form.addErrorMessage","message":"Show an error"},{"type":"includes","value":"return false","message":"Block submit"},{"type":"includes","value":"return true","message":"Allow submit when valid"}],"hint":"Return false to cancel submit."},{"id":"inc-15","title":"Encoded query: VIP P2 opened today","difficulty":"intermediate","kind":"server","prompt":"Query incidents with addEncodedQuery for caller_id.vip=true^priority=2^opened_atONToday. Order by opened_at descending. Log numbers.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\ngr.addEncodedQuery('caller_id.vip=true^priority=2^opened_atONToday');\ngr.orderByDesc('opened_at');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Use addEncodedQuery"},{"type":"includes","value":"caller_id.vip=true","message":"VIP caller"},{"type":"includes","value":"priority=2","message":"Priority 2"},{"type":"includes","value":"opened_atONToday","message":"Opened today"},{"type":"includes","value":"orderByDesc","message":"Newest first"},{"type":"includes","value":"opened_at","message":"Sort by opened_at"}],"hint":"Dot-walk caller_id.vip in the encoded query."},{"id":"inc-16","title":"Related incident tasks still open","difficulty":"intermediate","kind":"server","prompt":"For incident sys_id incId, query incident_task where incident matches and state is not Closed (3). If any exist, log \"OPEN_TASKS\" otherwise \"CLEAR\".","starter":"var incId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var incId = 'cccccccccccccccccccccccccccccccc';\nvar task = new GlideRecord('incident_task');\ntask.addQuery('incident', incId);\ntask.addQuery('state', '!=', '3');\ntask.setLimit(1);\ntask.query();\nif (task.hasNext()) {\n  gs.info('OPEN_TASKS');\n} else {\n  gs.info('CLEAR');\n}","checks":[{"type":"includes","value":"new GlideRecord('incident_task')","message":"Query incident_task"},{"type":"includes","value":"incident","message":"Relate to the incident"},{"type":"oneOf","values":["addQuery('state', '!=', '3')","addQuery(\"state\", \"!=\", \"3\")","state!=3"],"message":"Exclude closed state 3"},{"type":"oneOf","values":["hasNext()",".next()"],"message":"Test whether a row exists"},{"type":"includes","value":"OPEN_TASKS","message":"Log OPEN_TASKS"},{"type":"includes","value":"CLEAR","message":"Log CLEAR"}],"hint":"addQuery('state', '!=', '3') and hasNext()."}],"theory":[{"id":"inc-t01","title":"current.update() in a Business Rule","difficulty":"hard","format":"theory","kind":"theory","prompt":"An interviewer asks why an incident Before Business Rule that calls current.update() is dangerous. What is the most accurate answer?","options":[{"id":"a","text":"update() is client-only and will throw on the server"},{"id":"b","text":"It re-triggers insert/update Business Rules on the same record and can recurse until the platform stops it"},{"id":"c","text":"It is required so Display Business Rules can see the new values"},{"id":"d","text":"It skips ACLs, which is always the desired pattern"}],"answer":"b","explanation":"Official guidance: do not use current.update() in a BR. The save that invoked the BR already persists the row; calling update() starts another engine cycle (BRs, workflows, notifications) and can recurse. Use current.setValue() in a Before BR, or an After/Async BR that updates other records. ServiceNow detects recursion and logs it, but you still get extra transactions and race conditions.","multi":false},{"id":"inc-t02","title":"Display BR vs GlideAjax","difficulty":"hard","format":"theory","kind":"theory","prompt":"You need the count of the caller’s open incidents on the incident form. The count must be available as soon as the form loads, without an extra round trip after onLoad. Best pattern?","options":[{"id":"a","text":"Client-side GlideRecord in onLoad (getXMLWait)"},{"id":"b","text":"Display Business Rule that sets g_scratchpad.openCount, then an onLoad Client Script reads g_scratchpad"},{"id":"c","text":"After Business Rule that gs.addInfoMessage the count"},{"id":"d","text":"Query Business Rule that injects the count into every list query"}],"answer":"b","explanation":"Display BRs run server-side when the form is loaded and exist to populate g_scratchpad for client scripts. That is the documented way to pass server data that is not on the form. GlideAjax is better when the value must refresh after field changes. Client GlideRecord / getXMLWait is a performance and security anti-pattern. After BRs do not run on form load. Query BRs alter list/database queries, not form scratchpad.","multi":false},{"id":"inc-t03","title":"Query Business Rules","difficulty":"hard","format":"theory","kind":"theory","prompt":"A Query Business Rule on incident adds addQuery(\"active\", true) for users without itil_admin. What is the interview-critical implication?","options":[{"id":"a","text":"It only affects the native UI list; GlideRecord in Script Includes still sees inactive incidents"},{"id":"b","text":"It is appended to queries (including many GlideRecord queries) so scripts running as that user may silently miss inactive rows"},{"id":"c","text":"It replaces ACLs so you no longer need incident.read"},{"id":"d","text":"It runs only for encoded queries typed in the filter bar"}],"answer":"b","explanation":"Query BRs modify the query before it executes. They apply more broadly than “the list UI,” including server scripts that query as the user. That is why they are powerful and dangerous: reports, related lists, and integrations can hide records unexpectedly. They are not a substitute for ACLs. Always combine with conditions so they do not fire for system/integration accounts that must see all rows.","multi":false},{"id":"inc-t04","title":"GlideRecordSecure","difficulty":"hard","format":"theory","kind":"theory","prompt":"A Scripted REST API uses GlideRecord(\"incident\") as the authenticated user and returns records the user cannot open in the UI. Why?","options":[{"id":"a","text":"REST always runs as admin"},{"id":"b","text":"Ordinary GlideRecord does not enforce the same end-user ACL semantics; use GlideRecordSecure or explicit canRead/canWrite checks when the script must honor the caller"},{"id":"c","text":"You forgot setWorkflow(false)"},{"id":"d","text":"Encoded queries bypass ACLs but addQuery does not"}],"answer":"b","explanation":"Interview staple: GlideRecord in server scripts often runs with elevated/script rights depending on context. GlideRecordSecure applies ACLs as the current user. Table API / UI already go through ACLs; custom Scripted REST that uses raw GlideRecord can leak data. Never assume “the user is logged in, therefore ACLs apply to my script.”","multi":false},{"id":"inc-t05","title":"Counting at scale","difficulty":"hard","format":"theory","kind":"theory","prompt":"A dashboard script does var gr = new GlideRecord(\"incident\"); gr.addQuery(\"active\", true); gr.query(); gs.info(gr.getRowCount()). Why is this a CIS/community performance fail?","options":[{"id":"a","text":"getRowCount() is not a real method"},{"id":"b","text":"GlideRecord.getRowCount() can force the platform to retrieve/count in a way that does not scale; GlideAggregate COUNT (or a report/PA indicator) is the documented approach"},{"id":"c","text":"You must use chooseWindow() first or getRowCount returns -1"},{"id":"d","text":"Only client scripts may count records"}],"answer":"b","explanation":"ServiceNow community best practice: do not use GlideRecord to count. GlideAggregate uses the database aggregate path. getRowCount() is associated with loading/counting the result set and is a classic interview trap versus addAggregate(\"COUNT\"). Also setLimit when you only need existence (hasNext).","multi":false},{"id":"inc-t06","title":"N+1 GlideRecord","difficulty":"hard","format":"theory","kind":"theory","prompt":"A scheduled job loops 5,000 incidents and inside the loop queries cmdb_ci by sys_id. What is the expected production failure mode and fix?","options":[{"id":"a","text":"It is O(1) because sys_id is indexed, so no change is needed"},{"id":"b","text":"It can hit the ~5 minute transaction quota; collect CI sys_ids and query once with addQuery(\"sys_id\", \"IN\", ids) (or cache in a map)"},{"id":"c","text":"Move the inner query to a Client Script so it does not count against the quota"},{"id":"d","text":"Replace both queries with g_form.getReference"}],"answer":"b","explanation":"Community “time vs space” guidance: nested GlideRecord is O(N) round-trips. Indexed lookups still pay handshake cost. Batch with IN, or build a hash map. For worker jobs, also consider setWorkflow(false)/autoSysFields(false) only when skipping engines is safe. Client APIs are irrelevant in a scheduled job.","multi":false},{"id":"inc-t07","title":"Priority vs major incident","difficulty":"hard","format":"theory","kind":"theory","prompt":"CIS-ITSM-style: A P1 incident is created. Must it be a Major Incident?","options":[{"id":"a","text":"Yes; OOTB P1 always sets major_incident_state=accepted"},{"id":"b","text":"No. Priority is a data value from impact/urgency; Major Incident is a separate process designation (plugin, roles, communications) and may even apply to a non-P1"},{"id":"c","text":"Yes if the CI is in the application service table"},{"id":"d","text":"Only if the caller is VIP"}],"answer":"b","explanation":"Implementation exam trap: P1 ≠ MIM. Activate com.snc.incident.mim, use propose/accept, communication plans, major_incident_manager — not just priority=1. Conversely, an accepted MIM is usually high impact but the process is explicit.","multi":false},{"id":"inc-t08","title":"UI Policy vs Data Policy vs Client Script","difficulty":"hard","format":"theory","kind":"theory","prompt":"Security interview: A client script sets description mandatory for P1, but import sets and Table API still insert P1 incidents with a blank description. What did the implementer miss?","options":[{"id":"a","text":"Client scripts run on the Table API if you check \"Global\""},{"id":"b","text":"UI/Client rules do not enforce server/API paths; use a Data Policy (or Before BR / dictionary) so all channels are validated"},{"id":"c","text":"They needed g_form.setMandatory in an onSubmit as well"},{"id":"d","text":"Import sets ignore Data Policies too, so only Transform Scripts work"}],"answer":"b","explanation":"Configuration-first interview answer: UI Policy/Client Script = UX. Data Policy can apply to UI and/or web services. Before BR/AbortAction covers all GlideRecord. Transform maps have their own ignore/error flags. Never claim the platform is secure because the form is mandatory.","multi":false},{"id":"inc-t09","title":"Assignment rules and order","difficulty":"hard","format":"theory","kind":"theory","prompt":"Incidents for a CI should go to the CI support group, but some tickets still land on Service Desk. CIS-ITSM implementation thinking: what do you check first besides “is there an assignment rule”?","options":[{"id":"a","text":"Only the client onChange of cmdb_ci"},{"id":"b","text":"Rule order (first match), whether cmdb_ci is populated at insert, CI support_group data quality, and that a later BR/flow is not overwriting assignment_group"},{"id":"c","text":"Delete all Data Policies on assignment_group"},{"id":"d","text":"Assignment rules cannot use CI fields"}],"answer":"b","explanation":"Assignment rules evaluate in order; empty CI at insert (caller-created records) skips CI conditions. Dirty CMDB (empty support_group) fails the rule. After rules, lookup rules, flows, and BRs can overwrite. Interviewers want the full chain, not the module name.","multi":false},{"id":"inc-t10","title":"async vs after BR","difficulty":"hard","format":"theory","kind":"theory","prompt":"You must notify a mid-server integration after an incident is committed, but the HTTP call can take 8 seconds. Which BR \"When\" value is appropriate and why?","options":[{"id":"a","text":"before — so the REST call can setAbortAction if the remote side fails"},{"id":"b","text":"async — the user transaction is not blocked; the job runs after commit on a worker (eventual consistency)"},{"id":"c","text":"display — Display BRs are the only ones allowed to call RESTMessageV2"},{"id":"d","text":"after — after BRs are guaranteed not to count against the 5-minute quota"}],"answer":"b","explanation":"Before + outbound REST delays/fails the user save and can hold locks. After still runs in the user session before the response. Async (or eventQueue + Script Action / Flow) is the documented pattern for slow I/O. Display is form-load only. After is still synchronous to the transaction from the user’s perspective for that request’s remaining work.","multi":false},{"id":"inc-t11","title":"Journal fields","difficulty":"hard","format":"theory","kind":"theory","prompt":"In a Before BR, current.work_notes = \"x\" vs current.work_notes.setJournalEntry(\"x\"). A developer reads getJournalEntry(1) in the same Before BR and gets unexpected results. Why is this subtle?","options":[{"id":"a","text":"Journal fields cannot be set in Before BRs at all"},{"id":"b","text":"Journal writes are special; the in-memory current object / database journal lines may not round-trip like a normal string field in the same execution, so copying “latest journal” in the same BR is a common bug"},{"id":"c","text":"getJournalEntry only works in Client Scripts"},{"id":"d","text":"work_notes is encrypted and getJournalEntry always returns empty for itil"}],"answer":"b","explanation":"Community/interview: additional comments and work notes are journal_input. Setting them queues an entry; reading getJournalEntry(1) in the same before script often does not see the line you just assigned the way a normal field would. Prefer After, or copy previous + new value carefully. Do not treat journals as ordinary strings.","multi":false},{"id":"inc-t12","title":"setWorkflow(false) and autoSysFields(false)","difficulty":"hard","format":"theory","kind":"theory","prompt":"Bulk-closing 2,000 child incidents from a parent. Which statement is true?","options":[{"id":"a","text":"setWorkflow(false) skips BRs/engines/notifications for that GlideRecord operation; autoSysFields(false) additionally skips sys_updated_on/by style auto fields — both are optimizations with audit/process trade-offs"},{"id":"b","text":"setWorkflow(false) permanently disables all BRs on the incident table until reboot"},{"id":"c","text":"autoSysFields(false) is required for ACLs to apply"},{"id":"d","text":"These APIs only work on import set tables"}],"answer":"a","explanation":"Interview bulk-update pattern: query children, setWorkflow(false) to avoid recursive parent/child BRs and email storms; autoSysFields(false) if you must not churn update stamps (data fix). You lose notifications, SLA engine reactions, and audit friendliness. Never use this on interactive user saves as a default.","multi":false},{"id":"inc-t13","title":"GlideAjax sysparm_name","difficulty":"hard","format":"theory","kind":"theory","prompt":"A GlideAjax call returns empty even though the Script Include method exists. Which is the most common platform-correct cause?","options":[{"id":"a","text":"The Script Include is not client-callable, or sysparm_name does not match the method, or the method is not on AbstractAjaxProcessor.prototype"},{"id":"b","text":"GlideAjax cannot return strings, only XML documents you cannot parse"},{"id":"c","text":"You must name the parameter sysparm_id or it is ignored"},{"id":"d","text":"GlideAjax only works for scoped apps in global"}],"answer":"a","explanation":"Checklist: Client callable = true, name matches include, addParam(\"sysparm_name\", \"method\"), method defined on the prototype extending AbstractAjaxProcessor, ACL/sandbox, and scope. Returning from the method becomes the answer for getXMLAnswer. Empty answer is usually configuration, not “GlideAjax is broken.”","multi":false},{"id":"inc-t14","title":"Caller vs opened_by vs watch_list","difficulty":"hard","format":"theory","kind":"theory","prompt":"A VIP’s EA opens an incident for the VIP. Which data model is correct OOTB intent?","options":[{"id":"a","text":"opened_by and caller_id must always be the same user or the form aborts"},{"id":"b","text":"opened_by is who created the record; caller_id is the affected user; watch_list is extra notification recipients — assignment should not assume they are identical"},{"id":"c","text":"watch_list replaces caller_id when VIP is true"},{"id":"d","text":"caller_id is always the assignment group manager"}],"answer":"b","explanation":"Process + reporting: SLA/VIP flags often key off caller_id (affected user), not the fulfiller who clicked New. Notifications: caller, assigned_to, watch_list, assignment group. Interviewers use this to see if you designed for service-desk-on-behalf-of.","multi":false},{"id":"inc-t15","title":"Conditions field on a BR","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why do ServiceNow docs/community insist on filling the Condition field instead of putting if (current.priority == 1) only inside the script?","options":[{"id":"a","text":"Conditions are ignored; they are documentation"},{"id":"b","text":"The condition is evaluated first and can skip loading/running the script entirely, reducing engine cost on every insert/update/query of the table"},{"id":"c","text":"Conditions run on the client; scripts run on the server"},{"id":"d","text":"Without a condition the BR cannot access current"}],"answer":"b","explanation":"Every qualifying DB operation evaluates BRs on that table. An empty condition means the script is a candidate every time. Filter in the condition builder (and Filter Conditions) so high-volume incident updates do not parse JS. Still keep script-level guards for race-y field changes.","multi":false}]},{"id":"problem","title":"Problem Management","blurb":"Create problems from incidents, investigate root cause, and close with known errors.","questions":[{"id":"prb-01","title":"Query new problems without assignee","difficulty":"easy","kind":"server","prompt":"Query problem records in state New (1) where assigned_to is empty. Log each number.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('problem');\ngr.addQuery('state', '1');\ngr.addNullQuery('assigned_to');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecord('problem')","message":"Use the problem table"},{"type":"regex","value":{"__regex":true,"source":"addQuery\\(\\s*['\"]state['\"]\\s*,\\s*['\"]1['\"]\\s*\\)","flags":""},"message":"State New (1)"},{"type":"oneOf","values":["addNullQuery('assigned_to')","assigned_toISEMPTY"],"message":"Unassigned problems"},{"type":"includes","value":"query()","message":"Execute query"},{"type":"includes","value":".next()","message":"Iterate"}]},{"id":"prb-02","title":"Create a problem from an incident","difficulty":"intermediate","kind":"server","prompt":"Load incident by sys_id incId. Create a problem copying short_description and cmdb_ci. Set first_reported_by_incident to the incident sys_id. Insert, then set incident.problem_id to the new problem and update the incident.","starter":"var incId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var incId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar inc = new GlideRecord('incident');\nif (inc.get(incId)) {\n  var prb = new GlideRecord('problem');\n  prb.initialize();\n  prb.setValue('short_description', inc.getValue('short_description'));\n  prb.setValue('cmdb_ci', inc.getValue('cmdb_ci'));\n  prb.setValue('first_reported_by_incident', inc.getUniqueValue());\n  var prbId = prb.insert();\n  inc.setValue('problem_id', prbId);\n  inc.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Load the incident"},{"type":"includes","value":"new GlideRecord('problem')","message":"Create a problem"},{"type":"includes","value":"short_description","message":"Copy short_description"},{"type":"includes","value":"cmdb_ci","message":"Copy CI"},{"type":"includes","value":"first_reported_by_incident","message":"Link first reported incident"},{"type":"includes","value":"problem_id","message":"Set incident.problem_id"},{"type":"includes","value":"insert()","message":"Insert the problem"},{"type":"includes","value":"update()","message":"Update the incident"}]},{"id":"prb-03","title":"Require workaround before assess","difficulty":"intermediate","kind":"business_rule","prompt":"Abort if problem state changes to Assess (2) and workaround is empty. Add an error message.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('2') && current.workaround.nil()) {\n    gs.addErrorMessage('Document a workaround before moving to Assess.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"oneOf","values":["changesTo('2')","changesTo(2)"],"message":"State Assess (2)"},{"type":"oneOf","values":["workaround.nil()","getValue('workaround')"],"message":"Check workaround"},{"type":"includes","value":"gs.addErrorMessage","message":"Error message"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"prb-04","title":"Known error flag","difficulty":"easy","kind":"business_rule","prompt":"When knowledge is associated (known_error becomes true) set cause_notes to \"See related known error article\" if cause_notes is empty.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.known_error.changesTo('true') && current.cause_notes.nil()) {\n    current.setValue('cause_notes', 'See related known error article');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"known_error","message":"Watch known_error"},{"type":"includes","value":"cause_notes","message":"Set cause_notes"},{"type":"includes","value":"See related known error article","message":"Use the specified text"}]},{"id":"prb-05","title":"Related incidents still open","difficulty":"intermediate","kind":"server","prompt":"Count active incidents where problem_id equals prbId using GlideAggregate. Log the count.","starter":"var prbId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var prbId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar ga = new GlideAggregate('incident');\nga.addQuery('problem_id', prbId);\nga.addQuery('active', true);\nga.addAggregate('COUNT');\nga.query();\nif (ga.next()) {\n  gs.info(ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('incident')","message":"Aggregate incidents"},{"type":"includes","value":"problem_id","message":"Filter problem_id"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"},{"type":"includes","value":"getAggregate","message":"Read COUNT"}]},{"id":"prb-06","title":"Create a problem task","difficulty":"easy","kind":"server","prompt":"Insert a problem_task for problem prbId with short_description \"Collect logs\" and state Open (1).","starter":"var prbId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var prbId = 'cccccccccccccccccccccccccccccccc';\nvar task = new GlideRecord('problem_task');\ntask.initialize();\ntask.setValue('problem', prbId);\ntask.setValue('short_description', 'Collect logs');\ntask.setValue('state', '1');\ntask.insert();","checks":[{"type":"includes","value":"new GlideRecord('problem_task')","message":"problem_task table"},{"type":"includes","value":"problem","message":"Link to the problem"},{"type":"includes","value":"Collect logs","message":"Short description"},{"type":"includes","value":"insert()","message":"Insert"}]},{"id":"prb-07","title":"Close problem tasks when problem closes","difficulty":"intermediate","kind":"business_rule","prompt":"When problem state changes to Closed (3), set related problem_task records to Closed Complete (3) with setWorkflow(false).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('3')) {\n    var task = new GlideRecord('problem_task');\n    task.addQuery('problem', current.getUniqueValue());\n    task.addQuery('state', '!=', '3');\n    task.query();\n    while (task.next()) {\n      task.setValue('state', '3');\n      task.setWorkflow(false);\n      task.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('problem_task')","message":"Query problem tasks"},{"type":"includes","value":"problem","message":"Match parent problem"},{"type":"regex","value":{"__regex":true,"source":"setValue\\(\\s*['\"]state['\"]\\s*,\\s*['\"]3['\"]\\s*\\)","flags":""},"message":"Close tasks"},{"type":"includes","value":"setWorkflow(false)","message":"Skip extra engines"}]},{"id":"prb-08","title":"Client: hide workaround until RCA","difficulty":"easy","kind":"client","prompt":"onLoad: if state is New (1), hide field workaround. Otherwise show it.","starter":"function onLoad() {\n\n}\n","solution":"function onLoad() {\n  var state = g_form.getValue('state');\n  g_form.setDisplay('workaround', state != '1');\n}","checks":[{"type":"includes","value":"g_form.getValue('state')","message":"Read state"},{"type":"includes","value":"g_form.setDisplay('workaround'","message":"Toggle workaround display"}]},{"id":"prb-09","title":"Copy problem fix to incidents","difficulty":"intermediate","kind":"server","prompt":"When writing a fix, copy problem fix_notes onto additional comments of all incidents linked via problem_id. Use setWorkflow(false).","starter":"var prbId = 'dddddddddddddddddddddddddddddddd';\nvar fix = 'Restart the listener process';\n","solution":"var prbId = 'dddddddddddddddddddddddddddddddd';\nvar fix = 'Restart the listener process';\nvar inc = new GlideRecord('incident');\ninc.addQuery('problem_id', prbId);\ninc.query();\nwhile (inc.next()) {\n  inc.comments = fix;\n  inc.setWorkflow(false);\n  inc.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Update incidents"},{"type":"includes","value":"problem_id","message":"Linked incidents"},{"type":"oneOf","values":["inc.comments","setValue('comments'","setValue('additional_comments'"],"message":"Write comments"},{"type":"includes","value":"update()","message":"Save"}]},{"id":"prb-10","title":"Duplicate problem check","difficulty":"intermediate","kind":"server","prompt":"Before insert logic: query other problems with the same cmdb_ci and active=true. If any exist, gs.info the existing number and do not insert a duplicate—just log \"DUPLICATE\". If none, insert is assumed to happen elsewhere; log \"UNIQUE\". Use ciId.","starter":"var ciId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\n","solution":"var ciId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\nvar gr = new GlideRecord('problem');\ngr.addQuery('cmdb_ci', ciId);\ngr.addQuery('active', true);\ngr.setLimit(1);\ngr.query();\nif (gr.next()) {\n  gs.info(gr.getValue('number'));\n  gs.info('DUPLICATE');\n} else {\n  gs.info('UNIQUE');\n}","checks":[{"type":"includes","value":"new GlideRecord('problem')","message":"Query problems"},{"type":"includes","value":"cmdb_ci","message":"Same CI"},{"type":"includes","value":"DUPLICATE","message":"Log DUPLICATE"},{"type":"includes","value":"UNIQUE","message":"Log UNIQUE"}]},{"id":"prb-11","title":"Event problem.closed","difficulty":"easy","kind":"business_rule","prompt":"When state changes to Closed (3), queue event problem.closed with parm1 = number.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('3')) {\n    gs.eventQueue('problem.closed', current, current.getValue('number'), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.eventQueue","message":"eventQueue"},{"type":"includes","value":"problem.closed","message":"Event name"},{"type":"includes","value":"getValue('number')","message":"Parm1 is number"}]},{"id":"prb-12","title":"GlideAjax getProblemState","difficulty":"intermediate","kind":"script_include","prompt":"Script Include ProblemAjax.getState reads sysparm_sys_id, loads the problem, returns state.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var ProblemAjax = Class.create();\nProblemAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  getState: function() {\n    var id = this.getParameter('sysparm_sys_id');\n    var gr = new GlideRecord('problem');\n    if (gr.get(id)) {\n      return gr.getValue('state');\n    }\n    return '';\n  },\n  type: 'ProblemAjax'\n});","checks":[{"type":"includes","value":"AbstractAjaxProcessor","message":"Ajax processor"},{"type":"includes","value":"getState","message":"getState method"},{"type":"includes","value":"getParameter('sysparm_sys_id')","message":"Read sysparm_sys_id"},{"type":"includes","value":"new GlideRecord('problem')","message":"Load problem"},{"type":"includes","value":"getValue('state')","message":"Return state"}]},{"id":"prb-13","title":"Assign to Problem Management group","difficulty":"easy","kind":"business_rule","prompt":"If assignment_group is empty, set it from sys_user_group named \"Problem Management\".","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.assignment_group.nil()) {\n    var g = new GlideRecord('sys_user_group');\n    if (g.get('name', 'Problem Management')) {\n      current.setValue('assignment_group', g.getUniqueValue());\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('sys_user_group')","message":"Look up group"},{"type":"includes","value":"Problem Management","message":"Group name"},{"type":"includes","value":"assignment_group","message":"Set assignment_group"}]},{"id":"prb-14","title":"onChange: known error article mandatory","difficulty":"easy","kind":"client","prompt":"onChange of known_error: if true, make knowledge mandatory; else not mandatory.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setMandatory('knowledge', newValue == 'true');\n}","checks":[{"type":"includes","value":"g_form.setMandatory('knowledge'","message":"knowledge mandatory"},{"type":"oneOf","values":["newValue == 'true'","newValue === 'true'","newValue == true"],"message":"When known_error is true"}]},{"id":"prb-15","title":"Encoded query: high priority open problems","difficulty":"intermediate","kind":"server","prompt":"addEncodedQuery priority=1^ORpriority=2^active=true on problem, orderBy priority, log numbers.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('problem');\ngr.addEncodedQuery('priority=1^ORpriority=2^active=true');\ngr.orderBy('priority');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"priority=1","message":"P1"},{"type":"includes","value":"^ORpriority=2","message":"OR P2"},{"type":"includes","value":"active=true","message":"Active"},{"type":"includes","value":"orderBy('priority')","message":"Order by priority"}]},{"id":"prb-16","title":"Prevent delete with related incidents","difficulty":"intermediate","kind":"business_rule","prompt":"Before delete on problem: if any incident has this problem_id, abort and add an error message.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var inc = new GlideRecord('incident');\n  inc.addQuery('problem_id', current.getUniqueValue());\n  inc.setLimit(1);\n  inc.query();\n  if (inc.hasNext()) {\n    gs.addErrorMessage('Cannot delete a problem with related incidents.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Check incidents"},{"type":"includes","value":"problem_id","message":"Match problem_id"},{"type":"includes","value":"setAbortAction(true)","message":"Abort delete"},{"type":"includes","value":"gs.addErrorMessage","message":"Error message"}]}],"theory":[{"id":"prb-t01","title":"Incident vs Problem purpose","difficulty":"hard","format":"theory","kind":"theory","prompt":"A major outage is restored by reboot, but the CI fails every Friday. Interview: what records should exist and why?","options":[{"id":"a","text":"Only keep the incident open until the Friday failure never happens"},{"id":"b","text":"Close/resolve incidents when service is restored; open/maintain a Problem for root cause and a Known Error/workaround so future incidents can be diagnosed faster"},{"id":"c","text":"Convert every incident into a change_request automatically"},{"id":"d","text":"Problems cannot exist while any related incident is active"}],"answer":"b","explanation":"ITIL/ITSM implementation: Incident = restore service. Problem = cause. Workaround lives on the problem (and often a KE article). Closing incidents is correct after restoration; the problem stays open until a permanent fix (often a change). CIS-ITSM expects this split, not “one ticket for everything.”","multi":false},{"id":"prb-t02","title":"Known Error vs Knowledge","difficulty":"hard","format":"theory","kind":"theory","prompt":"What is the precise relationship in ServiceNow ITSM (not just ITIL slogans)?","options":[{"id":"a","text":"Known Error is a separate table that replaces kb_knowledge"},{"id":"b","text":"A Known Error is a Problem in a known-error-like state/flag, typically with a documented workaround and often a knowledge article in the KEDB — knowledge is the communication artifact, the problem is the process record"},{"id":"c","text":"Publishing any KB article automatically creates a problem"},{"id":"d","text":"Known Error articles must not be linked to incidents"}],"answer":"b","explanation":"KEDB is the operational store of workarounds for known errors. In Now, that is problem lifecycle (known_error / knowledge links) plus kb_knowledge visibility via user criteria. Do not invent a second CMDB. Agents attach knowledge to incidents; problem remains the RCA vehicle.","multi":false},{"id":"prb-t03","title":"When to open a problem","difficulty":"hard","format":"theory","kind":"theory","prompt":"CIS-ITSM detection methods: which is the weakest reason to create a Problem?","options":[{"id":"a","text":"Trend analysis: many incidents with the same CI/symptom"},{"id":"b","text":"Post–major incident review identified a systemic cause"},{"id":"c","text":"A single P4 password reset with no recurrence pattern"},{"id":"d","text":"Vendor confirms a defect in a version you cannot patch yet (workaround exists)"}],"answer":"c","explanation":"Problems are for unknown/systemic cause or known defects needing tracking. A one-off service request–like incident is not a problem. Recurring incidents, MIM PIR, and vendor KEDs are textbook triggers.","multi":false},{"id":"prb-t04","title":"problem_id vs first_reported_by_incident","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why does the data model have both incident.problem_id and problem.first_reported_by_incident?","options":[{"id":"a","text":"They are aliases; ServiceNow stores the same sys_id twice for redundancy"},{"id":"b","text":"problem_id on each incident is the many-to-one link; first_reported_by_incident preserves the original reporting incident even after later tickets are attached"},{"id":"c","text":"first_reported_by_incident is the knowledge article"},{"id":"d","text":"problem_id is only used by Change Management"}],"answer":"b","explanation":"Many incidents can point at one problem. The “first reported” reference is historical and should not be overwritten when you relate newer incidents. Reporting on “how the problem was found” uses the first-reported field.","multi":false},{"id":"prb-t05","title":"Problem tasks","difficulty":"hard","format":"theory","kind":"theory","prompt":"A coordinator assigns a RCA task to App and a vendor task to Network. Why not dump both into problem.work_notes only?","options":[{"id":"a","text":"work_notes cannot be used on problem"},{"id":"b","text":"problem_task (extends task) gives independent assignment, SLAs, and state so investigation is trackable; work_notes are not assignable work items"},{"id":"c","text":"Problem tasks replace the problem record when closed"},{"id":"d","text":"Only change_task may be used for RCA"}],"answer":"b","explanation":"CIS-ITSM: problem tasks are first-class work. Interviewers look for SLAs on investigation, not a diary. Closing the parent while tasks are open is a process smell you often block with a BR.","multi":false},{"id":"prb-t06","title":"Closing a problem while incidents are open","difficulty":"hard","format":"theory","kind":"theory","prompt":"Best implementation judgment?","options":[{"id":"a","text":"Always allow it; incidents are unrelated after restore"},{"id":"b","text":"Usually warn or block: either relate/close incidents with the workaround/fix, or keep the problem open — closing hides an unresolved cause from the queue"},{"id":"c","text":"Automatically delete related incidents"},{"id":"d","text":"Move all open incidents to Closed Incomplete via updateMultiple without notes"}],"answer":"b","explanation":"You can technically close a problem with open incidents, but implementation specialists add quality gates: copy fix/workaround, communicate, then close children or leave problem Fix in Progress. Silent close is an audit failure.","multi":false},{"id":"prb-t07","title":"Query BR hiding problems","difficulty":"hard","format":"theory","kind":"theory","prompt":"itil users cannot list Closed problems because of a Query BR. A Script Include generating a KEDB widget also uses GlideRecord as the user. Result?","options":[{"id":"a","text":"Script Includes always run as system and ignore Query BRs"},{"id":"b","text":"The widget will also omit closed known errors unless you query as a privileged account or GlideRecord in a scope that bypasses that BR’s condition"},{"id":"c","text":"Query BRs never apply to problem, only incident"},{"id":"d","text":"addEncodedQuery bypasses Query BRs"}],"answer":"b","explanation":"Same engine as incident Query BRs. KEDB reports that “lose” retired/closed KE articles/problems are often this. Design the BR condition (roles, gs.getSession().isInteractive()) so integrations and widgets still work.","multi":false},{"id":"prb-t08","title":"Workaround vs permanent fix","difficulty":"hard","format":"theory","kind":"theory","prompt":"Incident is restored with a workaround from the problem. The problem should be:","options":[{"id":"a","text":"Closed immediately because service is up"},{"id":"b","text":"Left open (or Known Error) until a change/permanent fix is verified; incidents may close"},{"id":"c","text":"Converted into a standard change automatically"},{"id":"d","text":"Deleted to avoid duplicate CIs"}],"answer":"b","explanation":"Workaround ≠ root cause eliminated. Problem closure criteria = cause addressed and residual risk accepted. Linking rfc/change_request is the usual permanent-fix path.","multi":false},{"id":"prb-t09","title":"Duplicate problems","difficulty":"hard","format":"theory","kind":"theory","prompt":"Two coordinators open problems on the same cmdb_ci the same day. What is the robust check (not just short_description equals)?","options":[{"id":"a","text":"sys_id collision will prevent the second insert"},{"id":"b","text":"Query active problems on the same CI (and optionally normalized short description/category) before insert; optionally a BR abort or relate as duplicate"},{"id":"c","text":"Only email subject uniqueness is supported"},{"id":"d","text":"IRE will merge problems automatically"}],"answer":"b","explanation":"IRE is for CMDB, not problem. Duplicates are process + script/flow. Match CI + active + time window. Relating as duplicate keeps metrics honest.","multi":false},{"id":"prb-t10","title":"Roles","difficulty":"hard","format":"theory","kind":"theory","prompt":"Which role is the specialized problem process owner rather than generic itil?","options":[{"id":"a","text":"catalog_admin"},{"id":"b","text":"problem_manager / problem_coordinator (plus sn_problem_write as applicable)"},{"id":"c","text":"ecmdb_admin"},{"id":"d","text":"mid_server"}],"answer":"b","explanation":"CIS table of roles: problem_admin, problem_manager, problem_coordinator, problem_task analyst. itil can work tickets; process design uses the problem_* roles. Don’t grant admin to “fix the related list.”","multi":false},{"id":"prb-t11","title":"Copying fix to incidents","difficulty":"hard","format":"theory","kind":"theory","prompt":"A BR on problem copies fix_notes to all related incidents with setWorkflow(false). What can still go wrong?","options":[{"id":"a","text":"Nothing; setWorkflow(false) is always safe"},{"id":"b","text":"You skip incident notifications/SLA reactions the business wanted, and you may still recurse if you forget to filter problem_id or run on every problem update"},{"id":"c","text":"setWorkflow(false) deletes journal history"},{"id":"d","text":"Incidents cannot receive comments from server scripts"}],"answer":"b","explanation":"Condition: only when fix_notes changes / state to Resolved. Filter related incidents. Decide whether callers should be notified (maybe setWorkflow true on a second pass). Journals vs comments field choice matters for customer-visible text.","multi":false},{"id":"prb-t12","title":"Assess without workaround","difficulty":"hard","format":"theory","kind":"theory","prompt":"Why do mature implementations abort Assess if workaround is empty?","options":[{"id":"a","text":"Assess is a client-only UI policy with no server analog"},{"id":"b","text":"State model quality gate: you should not claim the problem is understood enough to assess without at least a workaround or explicit “none / investigating” policy"},{"id":"c","text":"The database forbids empty journal fields"},{"id":"d","text":"CAB requires workaround on problems"}],"answer":"b","explanation":"CIS process: New → Assess → Root Cause Analysis → Fix in Progress → Resolved. Empty workaround while broadcasting “we understand it” is a KPI lie. Enforce server-side, not only UI.","multi":false},{"id":"prb-t13","title":"Trend analysis","difficulty":"hard","format":"theory","kind":"theory","prompt":"“Three incidents same CI in seven days create a problem.” Where should that live?","options":[{"id":"a","text":"A Display BR on incident form"},{"id":"b","text":"Scheduled job / Flow / PA indicator + event, not a synchronous After BR that queries the world on every incident insert"},{"id":"c","text":"A UI Action only"},{"id":"d","text":"Discovery sensor"}],"answer":"b","explanation":"After BR on every incident insert that GlideAggregates 7 days of history will not scale. Async detection is the implementation answer. Deduplicate so you don’t open 50 problems.","multi":false},{"id":"prb-t14","title":"kb_use vs problem","difficulty":"hard","format":"theory","kind":"theory","prompt":"kb_use tracks article attach/view. A manager asks why attaching a KE article to an incident did not close the problem. You say:","options":[{"id":"a","text":"kb_use always closes the problem via OOTB BR"},{"id":"b","text":"Using knowledge on an incident does not complete problem RCA; they are related but independent lifecycles"},{"id":"c","text":"kb_use is only for catalog items"},{"id":"d","text":"You must attach the article to the change instead"}],"answer":"b","explanation":"kb_use is telemetry. Problem closure is a human/process decision. Linking knowledge helps the next incident; it is not a state machine for problem.","multi":false},{"id":"prb-t15","title":"Global Business Rule vs Script Include","difficulty":"hard","format":"theory","kind":"theory","prompt":"A “global” BR (table Global) holds a function used by problem scripts. Why do interviews call this a bad 2012 pattern?","options":[{"id":"a","text":"Global BRs cannot access GlideRecord"},{"id":"b","text":"They load broadly with little condition/table scoping; Script Includes load on demand and are the reusable-code vehicle"},{"id":"c","text":"Script Includes cannot be called from BRs"},{"id":"d","text":"Global BRs are the only way to share code in scoped apps"}],"answer":"b","explanation":"Docs: prefer Script Includes over Global BRs. Scoped apps use script includes + exports. Global BRs hurt instance performance and upgrade safety.","multi":false}]},{"id":"change","title":"Change Management","blurb":"Normal, standard, and emergency changes: risk, approvals, scheduling, and tasks.","questions":[{"id":"chg-01","title":"Query emergency changes this week","difficulty":"easy","kind":"server","prompt":"Query change_request where type is emergency and active is true. Log each number.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('change_request');\ngr.addQuery('type', 'emergency');\ngr.addQuery('active', true);\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecord('change_request')","message":"change_request table"},{"type":"includes","value":"addQuery('type', 'emergency')","message":"Emergency type"},{"type":"includes","value":"query()","message":"Query"},{"type":"includes","value":".next()","message":"Iterate"}]},{"id":"chg-02","title":"Create a normal change","difficulty":"easy","kind":"server","prompt":"Insert a change_request: type normal, short_description \"Patch Windows cluster\", risk moderate, impact 2. Log the number after insert.","starter":"// Write your ServiceNow script below\n","solution":"var chg = new GlideRecord('change_request');\nchg.initialize();\nchg.setValue('type', 'normal');\nchg.setValue('short_description', 'Patch Windows cluster');\nchg.setValue('risk', 'moderate');\nchg.setValue('impact', '2');\nchg.insert();\ngs.info(chg.getValue('number'));","checks":[{"type":"includes","value":"new GlideRecord('change_request')","message":"change_request"},{"type":"includes","value":"setValue('type', 'normal')","message":"Type normal"},{"type":"includes","value":"Patch Windows cluster","message":"Description"},{"type":"includes","value":"moderate","message":"Risk moderate"},{"type":"includes","value":"insert()","message":"Insert"}]},{"id":"chg-03","title":"Abort if planned end before start","difficulty":"intermediate","kind":"business_rule","prompt":"If end_date is before start_date, abort and add an error message. Use GlideDateTime compareTo.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var start = new GlideDateTime(current.getValue('start_date'));\n  var end = new GlideDateTime(current.getValue('end_date'));\n  if (!gs.nil(current.start_date) && !gs.nil(current.end_date) && end.compareTo(start) \u003c 0) {\n    gs.addErrorMessage('Planned end must be after planned start.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"GlideDateTime","message":"Use GlideDateTime"},{"type":"includes","value":"start_date","message":"Read start_date"},{"type":"includes","value":"end_date","message":"Read end_date"},{"type":"includes","value":"compareTo","message":"Compare dates"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"chg-04","title":"Standard change skip CAB","difficulty":"easy","kind":"business_rule","prompt":"If type is standard, set cab_required to false.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.getValue('type') == 'standard') {\n    current.setValue('cab_required', false);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"getValue('type')","message":"Read type"},{"type":"includes","value":"standard","message":"Standard changes"},{"type":"includes","value":"cab_required","message":"Set cab_required"}]},{"id":"chg-05","title":"Create implementation change task","difficulty":"easy","kind":"server","prompt":"Insert change_task for change chgId with short_description \"Implement\" and change_task_type implementation.","starter":"var chgId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var chgId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar t = new GlideRecord('change_task');\nt.initialize();\nt.setValue('change_request', chgId);\nt.setValue('short_description', 'Implement');\nt.setValue('change_task_type', 'implementation');\nt.insert();","checks":[{"type":"includes","value":"new GlideRecord('change_task')","message":"change_task"},{"type":"includes","value":"change_request","message":"Parent change"},{"type":"includes","value":"Implement","message":"Short description"},{"type":"includes","value":"implementation","message":"Task type"},{"type":"includes","value":"insert()","message":"Insert"}]},{"id":"chg-06","title":"Unauthorized emergency","difficulty":"intermediate","kind":"business_rule","prompt":"If type changes to emergency and gs.hasRole(\"itil\") is true but gs.hasRole(\"itil_admin\") is false and gs.hasRole(\"admin\") is false, abort with an error (only admins / itil_admin may create emergency here).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.type.changesTo('emergency') && !gs.hasRole('itil_admin') && !gs.hasRole('admin')) {\n    gs.addErrorMessage('Only change admins can submit emergency changes.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('emergency')","message":"Detect emergency"},{"type":"includes","value":"gs.hasRole('itil_admin')","message":"Check itil_admin"},{"type":"includes","value":"gs.hasRole('admin')","message":"Check admin"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"chg-07","title":"Copy CI from request to change","difficulty":"easy","kind":"server","prompt":"Load sc_req_item ritmId and create a change_request copying cmdb_ci and short_description. Set requested_by from the RITM requested_for.","starter":"var ritmId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var ritmId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar ritm = new GlideRecord('sc_req_item');\nif (ritm.get(ritmId)) {\n  var chg = new GlideRecord('change_request');\n  chg.initialize();\n  chg.setValue('cmdb_ci', ritm.getValue('cmdb_ci'));\n  chg.setValue('short_description', ritm.getValue('short_description'));\n  chg.setValue('requested_by', ritm.getValue('requested_for'));\n  chg.insert();\n}","checks":[{"type":"includes","value":"new GlideRecord('sc_req_item')","message":"Load RITM"},{"type":"includes","value":"new GlideRecord('change_request')","message":"Create change"},{"type":"includes","value":"cmdb_ci","message":"Copy CI"},{"type":"includes","value":"requested_by","message":"Set requested_by"},{"type":"includes","value":"requested_for","message":"From requested_for"}]},{"id":"chg-08","title":"Client: conflict message on dates","difficulty":"easy","kind":"client","prompt":"onChange of start_date: if g_form.getValue(\"outside_maintenance\") is true, show a field message on start_date of type warning about CAB overlap. Use showFieldMsg.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n  if (g_form.getValue('outside_maintenance') == 'true') {\n    g_form.showFieldMsg('start_date', 'This window is outside maintenance. Expect CAB discussion.', 'warning');\n  }\n}","checks":[{"type":"includes","value":"g_form.showFieldMsg","message":"showFieldMsg"},{"type":"includes","value":"start_date","message":"On start_date"},{"type":"includes","value":"warning","message":"Warning type"},{"type":"includes","value":"outside_maintenance","message":"Check outside_maintenance"}]},{"id":"chg-09","title":"Close remaining change tasks","difficulty":"intermediate","kind":"business_rule","prompt":"When change state is Closed (3) or Canceled (4), close open change_task (state 3) with setWorkflow(false). Treat any state != 3 as open.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var st = current.getValue('state');\n  if (st == '3' || st == '4') {\n    var t = new GlideRecord('change_task');\n    t.addQuery('change_request', current.getUniqueValue());\n    t.addQuery('state', '!=', '3');\n    t.query();\n    while (t.next()) {\n      t.setValue('state', '3');\n      t.setWorkflow(false);\n      t.updat
