<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ServiceNow ITSM Script Lab</title>
  <style>:root {
  --bg: #071412;
  --panel: #0f2420;
  --panel-2: #12302b;
  --line: #1e4a43;
  --text: #e7f2ee;
  --muted: #8fb3ab;
  --accent: #62d84e;
  --accent-2: #81b5a1;
  --danger: #ff6b6b;
  --warn: #f0c14b;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: radial-gradient(1200px 600px at 10% -10%, #143c33 0%, var(--bg) 55%);
  color: var(--text);
  font-family: Inter, system-ui, sans-serif;
}

.app {
  display: grid;
  grid-template-columns: 260px 300px 1fr;
  min-height: 100%;
}

.sidebar,
.mid {
  border-right: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 88%, black);
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 20px 16px 12px;
}

.brand p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.dl {
  color: var(--accent);
  font-size: 12px;
}

.logo {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--accent), #1f8f5f);
  color: #06210f;
  font-weight: 700;
}

.topic-nav {
  display: flex;
  flex-direction: column;
  padding: 8px;
  gap: 6px;
}

.topic,
.q-item,
.btn {
  border: 0;
  cursor: pointer;
  font: inherit;
}

.topic {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  text-align: left;
  padding: 10px 12px;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
}

.topic:hover,
.q-item:hover {
  background: var(--panel-2);
}

.topic.active,
.q-item.active {
  background: #1a4a3d;
  box-shadow: inset 0 0 0 1px #2f7a64;
}

.topic-count,
.q-diff,
.q-idx {
  color: var(--muted);
  font-size: 12px;
}

.mid-head {
  padding: 20px 16px 8px;
}

.progress {
  color: var(--accent-2);
  font-size: 13px;
}

.question-list {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: calc(100vh - 120px);
  overflow: auto;
}

.q-item {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  text-align: left;
}

.q-item.passed .q-idx {
  color: var(--accent);
}

.q-name {
  font-size: 13px;
}

.main {
  padding: 20px 24px 40px;
  min-width: 0;
}

.main-head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
}

.main-head h1 {
  margin: 4px 0 0;
  font-size: 26px;
  letter-spacing: -0.03em;
}

.crumb,
.muted {
  color: var(--muted);
  font-size: 13px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn {
  padding: 8px 12px;
  border-radius: 8px;
  color: var(--text);
}

.btn.ghost {
  background: var(--panel-2);
  box-shadow: inset 0 0 0 1px var(--line);
}

.btn.primary {
  background: var(--accent);
  color: #06210f;
  font-weight: 600;
}

.prompt,
.hint {
  line-height: 1.55;
  max-width: 90ch;
}

.hint {
  color: var(--accent-2);
}

.editor {
  height: min(48vh, 460px);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}

.fallback {
  width: 100%;
  height: 100%;
  background: #0d1f1c;
  color: var(--text);
  border: 0;
  padding: 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
}

.grade-box {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
}

.grade-box.ok {
  border-color: #2f7a64;
}

.grade-box.fail {
  border-color: #7a2f2f;
}

.grade-head {
  font-weight: 600;
  margin-bottom: 8px;
}

.grade-box ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.grade-box li {
  display: flex;
  gap: 10px;
  padding: 6px 0;
  border-top: 1px solid var(--line);
  font-size: 14px;
}

.grade-box li span {
  min-width: 42px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.grade-box li.ok span {
  color: var(--accent);
}

.grade-box li.fail span {
  color: var(--danger);
}

.solution {
  margin-top: 16px;
  background: var(--panel);
  border: 1px dashed var(--accent-2);
  border-radius: 12px;
  padding: 12px 16px;
}

.solution pre {
  overflow: auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  white-space: pre-wrap;
}

@media (max-width: 1100px) {
  .app {
    grid-template-columns: 1fr;
  }

  .question-list {
    max-height: 220px;
  }
}

body { font-family: system-ui, sans-serif; }
.editor {
  position: relative;
  height: min(48vh, 460px);
}
#code {
  width: 100%;
  height: 100%;
  resize: none;
  background: #0d1f1c;
  color: var(--text);
  border: 0;
  padding: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 14px;
  line-height: 1.45;
  outline: none;
}
#ac-menu {
  position: absolute;
  left: 12px;
  bottom: 12px;
  max-height: 220px;
  overflow: auto;
  min-width: 280px;
  background: #12302b;
  border: 1px solid #2f7a64;
  border-radius: 8px;
  box-shadow: var(--shadow);
  z-index: 5;
}
.ac-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--text);
  padding: 8px 10px;
  border: 0;
  font: inherit;
  cursor: pointer;
}
.ac-item span {
  color: var(--muted);
  font-size: 12px;
}
.ac-item.active, .ac-item:hover {
  background: #1a4a3d;
}
.save-note {
  margin: 0 16px 8px;
  font-size: 12px;
  color: var(--muted);
}
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">SN</div>
        <div>
          <strong>ITSM Script Lab</strong>
          <p>Practice · Autocomplete · Instant grade</p>
        </div>
      </div>
      <p class="save-note">Offline file — double-click to open. Progress stays in this browser.</p>
      <div id="topic-nav" class="topic-nav"></div>
    </aside>
    <section class="mid">
      <header class="mid-head">
        <p id="blurb" class="muted"></p>
        <p id="progress-label" class="progress"></p>
      </header>
      <div id="question-list" class="question-list"></div>
    </section>
    <main class="main">
      <header class="main-head">
        <div>
          <p id="crumb" class="crumb"></p>
          <h1 id="q-title"></h1>
        </div>
        <div class="actions">
          <button id="reset-btn" class="btn ghost" type="button">Reset</button>
          <button id="reveal-btn" class="btn ghost" type="button">Show solution</button>
          <button id="apply-btn" class="btn ghost" type="button">Copy solution into editor</button>
          <button id="grade-btn" class="btn primary" type="button">Grade</button>
        </div>
      </header>
      <p id="q-prompt" class="prompt"></p>
      <p id="hint" class="hint" hidden></p>
      <div id="editor" class="editor">
        <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
        <div id="ac-menu" hidden></div>
      </div>
      <section id="grade-results" class="grade-box"></section>
      <section id="solution-pane" class="solution" hidden>
        <h2>Reference solution</h2>
        <pre id="solution-code"></pre>
      </section>
    </main>
  </div>
  <script>
    const TOPICS = [{"id":"incident","title":"Incident Management","blurb":"Query, route, escalate, and close incidents with GlideRecord, Business Rules, and client scripts.","questions":[{"id":"inc-01","title":"Query active Priority 1 incidents","difficulty":"easy","kind":"server","prompt":"Write a server script that queries the incident table for active Priority 1 records and logs each incident number with gs.info.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\ngr.addQuery('active', true);\ngr.addQuery('priority', '1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Create a GlideRecord on incident"},{"type":"includes","value":"addQuery","message":"Filter with addQuery"},{"type":"oneOf","values":["addQuery('active'","addActiveQuery()"],"message":"Limit to active incidents"},{"type":"regex","value":{"__regex":true,"source":"addQuery\\(\\s*['\"]priority['\"]\\s*,\\s*['\"]1['\"]\\s*\\)","flags":""},"message":"Filter priority 1"},{"type":"includes","value":"query()","message":"Call query()"},{"type":"includes","value":".next()","message":"Iterate with next()"},{"type":"includes","value":"gs.info","message":"Log with gs.info"}],"hint":"Use two addQuery calls (or addActiveQuery) then while (gr.next())."},{"id":"inc-02","title":"Create an incident for the current user","difficulty":"easy","kind":"server","prompt":"Insert a new incident: short_description \"Email outage\", caller_id = the current user, impact 2, urgency 2. Insert and log the new number.","starter":"// Write your ServiceNow script below\n","solution":"var inc = new GlideRecord('incident');\ninc.initialize();\ninc.setValue('short_description', 'Email outage');\ninc.setValue('caller_id', gs.getUserID());\ninc.setValue('impact', '2');\ninc.setValue('urgency', '2');\ninc.insert();\ngs.info(inc.getValue('number'));","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Use the incident table"},{"type":"oneOf","values":["initialize()","newRecord()"],"message":"Initialize a new record"},{"type":"includes","value":"short_description","message":"Set short_description"},{"type":"includes","value":"Email outage","message":"Use the specified short description"},{"type":"includes","value":"caller_id","message":"Set caller_id"},{"type":"includes","value":"gs.getUserID()","message":"Caller is the current user"},{"type":"includes","value":"impact","message":"Set impact"},{"type":"includes","value":"urgency","message":"Set urgency"},{"type":"includes","value":"insert()","message":"Insert the record"}],"hint":"initialize(), setValue for each field, then insert()."},{"id":"inc-03","title":"Business Rule: abort close without close notes","difficulty":"intermediate","kind":"business_rule","prompt":"On incident, when state changes to Closed (7), abort the action if close_notes is empty and add an error message telling the user to enter close notes.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('7') && current.close_notes.nil()) {\n    gs.addErrorMessage('Enter close notes before closing the incident.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"oneOf","values":["changesTo('7')","changesTo(7)","getValue('state')"],"message":"Detect close (state 7)"},{"type":"oneOf","values":["close_notes.nil()","gs.nil(current.close_notes)","getValue('close_notes')"],"message":"Check close_notes"},{"type":"includes","value":"gs.addErrorMessage","message":"Show an error message"},{"type":"includes","value":"setAbortAction(true)","message":"Abort the update"}],"hint":"current.state.changesTo('7') and current.close_notes.nil()."},{"id":"inc-04","title":"Auto-assign Service Desk group","difficulty":"easy","kind":"business_rule","prompt":"Before insert on incident: if assignment_group is empty, set it to the sys_user_group whose name is \"Service Desk\".","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.assignment_group.nil()) {\n    var grp = new GlideRecord('sys_user_group');\n    if (grp.get('name', 'Service Desk')) {\n      current.setValue('assignment_group', grp.getUniqueValue());\n    }\n  }\n})(current, previous);","checks":[{"type":"oneOf","values":["assignment_group.nil()","gs.nil(current.assignment_group)"],"message":"Check empty assignment_group"},{"type":"includes","value":"new GlideRecord('sys_user_group')","message":"Look up sys_user_group"},{"type":"includes","value":"Service Desk","message":"Find the Service Desk group"},{"type":"includes","value":"assignment_group","message":"Set assignment_group"},{"type":"oneOf","values":["getUniqueValue()","grp.sys_id","grp.getValue('sys_id')"],"message":"Use the group sys_id"}],"hint":"grp.get('name', 'Service Desk') then set assignment_group."},{"id":"inc-05","title":"Copy work notes into additional comments","difficulty":"easy","kind":"business_rule","prompt":"When work_notes changes on an incident, append the same text to additional_comments (comments).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.work_notes.changes()) {\n    current.comments = current.work_notes.getJournalEntry(1);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"work_notes.changes()","message":"Run when work_notes changes"},{"type":"oneOf","values":["current.comments","setValue('comments'","setValue('additional_comments'"],"message":"Write additional comments"},{"type":"oneOf","values":["getJournalEntry","work_notes"],"message":"Use the work notes value"}],"hint":"Journal fields: getJournalEntry(1) for the latest entry."},{"id":"inc-06","title":"Count open incidents for a CI","difficulty":"intermediate","kind":"server","prompt":"Given a CI sys_id in variable ciId, use GlideAggregate to count active incidents where cmdb_ci equals that CI. Log the count.","starter":"var ciId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var ciId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar ga = new GlideAggregate('incident');\nga.addQuery('cmdb_ci', ciId);\nga.addQuery('active', true);\nga.addAggregate('COUNT');\nga.query();\nif (ga.next()) {\n  gs.info(ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('incident')","message":"Use GlideAggregate on incident"},{"type":"includes","value":"cmdb_ci","message":"Filter on cmdb_ci"},{"type":"includes","value":"ciId","message":"Use the provided CI sys_id"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT aggregate"},{"type":"includes","value":"getAggregate","message":"Read the aggregate"},{"type":"includes","value":"gs.info","message":"Log the result"}],"hint":"addAggregate('COUNT') then getAggregate('COUNT')."},{"id":"inc-07","title":"Client script: mandatory description on P1","difficulty":"easy","kind":"client","prompt":"onChange of priority: if the new value is 1, make description mandatory; otherwise not mandatory.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setMandatory('description', newValue == '1');\n}","checks":[{"type":"includes","value":"g_form.setMandatory","message":"Use g_form.setMandatory"},{"type":"includes","value":"description","message":"Target the description field"},{"type":"oneOf","values":["newValue == '1'","newValue === '1'","newValue == 1","newValue === '1'"],"message":"When priority is 1"}],"hint":"g_form.setMandatory('description', newValue == '1')."},{"id":"inc-08","title":"Escalate to a major incident","difficulty":"intermediate","kind":"server","prompt":"Load incident INC0000001 by number. Set major_incident_state to \"accepted\", impact to 1, urgency to 1, and update the record.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\nif (gr.get('number', 'INC0000001')) {\n  gr.setValue('major_incident_state', 'accepted');\n  gr.setValue('impact', '1');\n  gr.setValue('urgency', '1');\n  gr.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Query incident"},{"type":"includes","value":"INC0000001","message":"Look up INC0000001"},{"type":"includes","value":"major_incident_state","message":"Set major incident state"},{"type":"includes","value":"accepted","message":"Accepted major incident"},{"type":"includes","value":"update()","message":"Save the record"}],"hint":"gr.get('number', 'INC0000001')."},{"id":"inc-09","title":"Reopen a resolved incident","difficulty":"easy","kind":"server","prompt":"For a given incident sys_id in incId, if state is Resolved (6), set state to In Progress (2), clear resolved_at, and update.","starter":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar gr = new GlideRecord('incident');\nif (gr.get(incId) && gr.getValue('state') == '6') {\n  gr.setValue('state', '2');\n  gr.setValue('resolved_at', '');\n  gr.update();\n}","checks":[{"type":"includes","value":".get(","message":"Load by sys_id"},{"type":"oneOf","values":["getValue('state')","gr.state"],"message":"Read state"},{"type":"regex","value":{"__regex":true,"source":"setValue\\(\\s*['\"]state['\"]\\s*,\\s*['\"]2['\"]\\s*\\)|state\\s*=\\s*['\"]2['\"]","flags":""},"message":"Set state to 2"},{"type":"includes","value":"resolved_at","message":"Clear resolved_at"},{"type":"includes","value":"update()","message":"Update"}],"hint":"Check state == 6 before setting state to 2."},{"id":"inc-10","title":"Queue an incident assigned event","difficulty":"intermediate","kind":"business_rule","prompt":"When assigned_to changes to a non-empty value, queue event incident.assigned with parm1 = assigned_to user name and parm2 = incident number.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.assigned_to.changes() && !current.assigned_to.nil()) {\n    gs.eventQueue(\n      'incident.assigned',\n      current,\n      current.assigned_to.getDisplayValue(),\n      current.getValue('number')\n    );\n  }\n})(current, previous);","checks":[{"type":"includes","value":"assigned_to.changes()","message":"Watch assigned_to"},{"type":"includes","value":"gs.eventQueue","message":"Queue an event"},{"type":"includes","value":"incident.assigned","message":"Event name incident.assigned"},{"type":"includes","value":"current","message":"Pass the incident record"}],"hint":"gs.eventQueue(name, current, parm1, parm2)."},{"id":"inc-11","title":"GlideAjax: open incident count","difficulty":"intermediate","kind":"script_include","prompt":"Client-callable Script Include IncidentUtilsAjax with method getOpenCount. Read sysparm_caller, count active incidents for that caller_id, return the count as a string.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var IncidentUtilsAjax = Class.create();\nIncidentUtilsAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  getOpenCount: function() {\n    var caller = this.getParameter('sysparm_caller');\n    var ga = new GlideAggregate('incident');\n    ga.addQuery('caller_id', caller);\n    ga.addQuery('active', true);\n    ga.addAggregate('COUNT');\n    ga.query();\n    return ga.next() ? ga.getAggregate('COUNT') : '0';\n  },\n  type: 'IncidentUtilsAjax'\n});","checks":[{"type":"includes","value":"AbstractAjaxProcessor","message":"Extend AbstractAjaxProcessor"},{"type":"includes","value":"getOpenCount","message":"Implement getOpenCount"},{"type":"includes","value":"getParameter('sysparm_caller')","message":"Read sysparm_caller"},{"type":"oneOf","values":["GlideAggregate","GlideRecord"],"message":"Query incidents"},{"type":"includes","value":"caller_id","message":"Filter by caller"}],"hint":"this.getParameter('sysparm_caller') then GlideAggregate COUNT."},{"id":"inc-12","title":"Parent incident close child incidents","difficulty":"intermediate","kind":"business_rule","prompt":"After update: if this incident is a parent (parent_incident is empty) and state changes to Closed (7), close all child incidents whose parent_incident is this record (state 7, close_code \"Closed/Resolved by parent\"). Use updateMultiple or a loop with setWorkflow(false) to avoid recursion.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.parent_incident.nil() && current.state.changesTo('7')) {\n    var child = new GlideRecord('incident');\n    child.addQuery('parent_incident', current.getUniqueValue());\n    child.addQuery('active', true);\n    child.query();\n    while (child.next()) {\n      child.setValue('state', '7');\n      child.setValue('close_code', 'Closed/Resolved by parent');\n      child.setWorkflow(false);\n      child.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Query child incidents"},{"type":"includes","value":"parent_incident","message":"Match parent_incident"},{"type":"regex","value":{"__regex":true,"source":"setValue\\(\\s*['\"]state['\"]\\s*,\\s*['\"]7['\"]\\s*\\)|state\\s*=\\s*['\"]7['\"]","flags":""},"message":"Close children (state 7)"},{"type":"includes","value":"close_code","message":"Set close_code"},{"type":"oneOf","values":["setWorkflow(false)","updateMultiple()"],"message":"Avoid recursive engines or use updateMultiple"}],"hint":"Query parent_incident = current.sys_id, then update each child."},{"id":"inc-13","title":"Priority from impact and urgency","difficulty":"intermediate","kind":"business_rule","prompt":"If impact is 1 and urgency is 1, set priority to 1. If either impact or urgency is 1 and the other is 2, set priority to 2. Otherwise leave priority unchanged. Use getValue/setValue.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var impact = current.getValue('impact');\n  var urgency = current.getValue('urgency');\n  if (impact == '1' && urgency == '1') {\n    current.setValue('priority', '1');\n  } else if ((impact == '1' && urgency == '2') || (impact == '2' && urgency == '1')) {\n    current.setValue('priority', '2');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"getValue('impact')","message":"Read impact"},{"type":"includes","value":"getValue('urgency')","message":"Read urgency"},{"type":"includes","value":"setValue('priority'","message":"Set priority"},{"type":"regex","value":{"__regex":true,"source":"priority['\"]\\s*,\\s*['\"]1['\"]","flags":""},"message":"Set priority 1 for 1/1"},{"type":"regex","value":{"__regex":true,"source":"priority['\"]\\s*,\\s*['\"]2['\"]","flags":""},"message":"Set priority 2 for mixed 1 and 2"}],"hint":"Compare impact/urgency strings, then setValue('priority', ...)."},{"id":"inc-14","title":"onSubmit: block empty assignment","difficulty":"easy","kind":"client","prompt":"onSubmit client script: if assignment_group is empty, show an error message and return false. Otherwise return true.","starter":"function onSubmit() {\n  return true;\n}\n","solution":"function onSubmit() {\n  if (!g_form.getValue('assignment_group')) {\n    g_form.addErrorMessage('Assignment group is required.');\n    return false;\n  }\n  return true;\n}","checks":[{"type":"includes","value":"g_form.getValue('assignment_group')","message":"Read assignment_group"},{"type":"includes","value":"g_form.addErrorMessage","message":"Show an error"},{"type":"includes","value":"return false","message":"Block submit"},{"type":"includes","value":"return true","message":"Allow submit when valid"}],"hint":"Return false to cancel submit."},{"id":"inc-15","title":"Encoded query: VIP P2 opened today","difficulty":"intermediate","kind":"server","prompt":"Query incidents with addEncodedQuery for caller_id.vip=true^priority=2^opened_atONToday. Order by opened_at descending. Log numbers.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\ngr.addEncodedQuery('caller_id.vip=true^priority=2^opened_atONToday');\ngr.orderByDesc('opened_at');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Use addEncodedQuery"},{"type":"includes","value":"caller_id.vip=true","message":"VIP caller"},{"type":"includes","value":"priority=2","message":"Priority 2"},{"type":"includes","value":"opened_atONToday","message":"Opened today"},{"type":"includes","value":"orderByDesc","message":"Newest first"},{"type":"includes","value":"opened_at","message":"Sort by opened_at"}],"hint":"Dot-walk caller_id.vip in the encoded query."},{"id":"inc-16","title":"Related incident tasks still open","difficulty":"intermediate","kind":"server","prompt":"For incident sys_id incId, query incident_task where incident matches and state is not Closed (3). If any exist, log \"OPEN_TASKS\" otherwise \"CLEAR\".","starter":"var incId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var incId = 'cccccccccccccccccccccccccccccccc';\nvar task = new GlideRecord('incident_task');\ntask.addQuery('incident', incId);\ntask.addQuery('state', '!=', '3');\ntask.setLimit(1);\ntask.query();\nif (task.hasNext()) {\n  gs.info('OPEN_TASKS');\n} else {\n  gs.info('CLEAR');\n}","checks":[{"type":"includes","value":"new GlideRecord('incident_task')","message":"Query incident_task"},{"type":"includes","value":"incident","message":"Relate to the incident"},{"type":"oneOf","values":["addQuery('state', '!=', '3')","addQuery(\"state\", \"!=\", \"3\")","state!=3"],"message":"Exclude closed state 3"},{"type":"oneOf","values":["hasNext()",".next()"],"message":"Test whether a row exists"},{"type":"includes","value":"OPEN_TASKS","message":"Log OPEN_TASKS"},{"type":"includes","value":"CLEAR","message":"Log CLEAR"}],"hint":"addQuery('state', '!=', '3') and hasNext()."}]},{"id":"problem","title":"Problem Management","blurb":"Create problems from incidents, investigate root cause, and close with known errors.","questions":[{"id":"prb-01","title":"Query new problems without assignee","difficulty":"easy","kind":"server","prompt":"Query problem records in state New (1) where assigned_to is empty. Log each number.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('problem');\ngr.addQuery('state', '1');\ngr.addNullQuery('assigned_to');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecord('problem')","message":"Use the problem table"},{"type":"regex","value":{"__regex":true,"source":"addQuery\\(\\s*['\"]state['\"]\\s*,\\s*['\"]1['\"]\\s*\\)","flags":""},"message":"State New (1)"},{"type":"oneOf","values":["addNullQuery('assigned_to')","assigned_toISEMPTY"],"message":"Unassigned problems"},{"type":"includes","value":"query()","message":"Execute query"},{"type":"includes","value":".next()","message":"Iterate"}]},{"id":"prb-02","title":"Create a problem from an incident","difficulty":"intermediate","kind":"server","prompt":"Load incident by sys_id incId. Create a problem copying short_description and cmdb_ci. Set first_reported_by_incident rt a problem_task for problem prbId with short_description \"Collect logs\" and state Open (1).","starter":"var prbId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var prbId = 'cccccccccccccccccccccccccccccccc';\nvar task = new GlideRecord('problem_task');\ntask.initialize();\ntask.setValue('problem', prbId);\ntask.setValue('short_description', 'Collect logs');\ntask.setValue('state', '1');\ntask.insert();","checks":[{"type":"includes","value":"new GlideRecord('problem_task')","message":"problem_task table"},{"type":"includes","value":"problem","message":"Link to the problem"},{"type":"includes","value":"Collect logs","message":"Short description"},{"type":"includes","value":"insert()","message":"Insert"}]},{"id":"prb-07","title":"Close problem tasks when problem closes","difficulty":"intermediate","kind":"business_rule","prompt":"When problem state changes to Closed (3), set related problem_task records to Closed Complete (3) with setWorkflow(false).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('3')) {\n    var task = new GlideRecord('problem_task');\n    task.addQuery('problem', current.getUniqueValue());\n    task.addQuery('state', '!=', '3');\n    task.query();\n    while (task.next()) {\n      task.setValue('state', '3');\n      task.setWorkflow(false);\n      task.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('problem_task')","message":"Query problem tasks"},{"type":"includes","value":"problem","message":"Match parent problem"},{"type":"regex","value":{"__regex":true,"source":"setValue\\(\\s*['\"]state['\"]\\s*,\\s*['\"]3['\"]\\s*\\)","flags":""},"message":"Close tasks"},{"type":"includes","value":"setWorkflow(false)","message":"Skip extra engines"}]},{"id":"prb-08","title":"Client: hide workaround until RCA","difficulty":"easy","kind":"client","prompt":"onLoad: if state is New (1), hide field workaround. Otherwise show it.","starter":"function onLoad() {\n\n}\n","solution":"function onLoad() {\n  var state = g_form.getValue('state');\n  g_form.setDisplay('workaround', state != '1');\n}","checks":[{"type":"includes","value":"g_form.getValue('state')","message":"Read state"},{"type":"includes","value":"g_form.setDisplay('workaround'","message":"Toggle workaround display"}]},{"id":"prb-09","title":"Copy problem fix to incidents","difficulty":"intermediate","kind":"server","prompt":"When writing a fix, copy problem fix_notes onto additional comments of all incidents linked via problem_id. Use setWorkflow(false).","starter":"var prbId = 'dddddddddddddddddddddddddddddddd';\nvar fix = 'Restart the listener process';\n","solution":"var prbId = 'dddddddddddddddddddddddddddddddd';\nvar fix = 'Restart the listener process';\nvar inc = new GlideRecord('incident');\ninc.addQuery('problem_id', prbId);\ninc.query();\nwhile (inc.next()) {\n  inc.comments = fix;\n  inc.setWorkflow(false);\n  inc.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Update incidents"},{"type":"includes","value":"problem_id","message":"Linked incidents"},{"type":"oneOf","values":["inc.comments","setValue('comments'","setValue('additional_comments'"],"message":"Write comments"},{"type":"includes","value":"update()","message":"Save"}]},{"id":"prb-10","title":"Duplicate problem check","difficulty":"intermediate","kind":"server","prompt":"Before insert logic: query other problems with the same cmdb_ci and active=true. If any exist, gs.info the existing number and do not insert a duplicate—just log \"DUPLICATE\". If none, insert is assumed to happen elsewhere; log \"UNIQUE\". Use ciId.","starter":"var ciId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\n","solution":"var ciId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\nvar gr = new GlideRecord('problem');\ngr.addQuery('cmdb_ci', ciId);\ngr.addQuery('active', true);\ngr.setLimit(1);\ngr.query();\nif (gr.next()) {\n  gs.info(gr.getValue('number'));\n  gs.info('DUPLICATE');\n} else {\n  gs.info('UNIQUE');\n}","checks":[{"type":"includes","value":"new GlideRecord('problem')","message":"Query problems"},{"type":"includes","value":"cmdb_ci","message":"Same CI"},{"type":"includes","value":"DUPLICATE","message":"Log DUPLICATE"},{"type":"includes","value":"UNIQUE","message":"Log UNIQUE"}]},{"id":"prb-11","title":"Event problem.closed","difficulty":"easy","kind":"business_rule","prompt":"When state changes to Closed (3), queue event problem.closed with parm1 = number.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('3')) {\n    gs.eventQueue('problem.closed', current, current.getValue('number'), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.eventQueue","message":"eventQueue"},{"type":"includes","value":"problem.closed","message":"Event name"},{"type":"includes","value":"getValue('number')","message":"Parm1 is number"}]},{"id":"prb-12","title":"GlideAjax getProblemState","difficulty":"intermediate","kind":"script_include","prompt":"Script Include ProblemAjax.getState reads sysparm_sys_id, loads the problem, returns state.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var ProblemAjax = Class.create();\nProblemAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  getState: function() {\n    var id = this.getParameter('sysparm_sys_id');\n    var gr = new GlideRecord('problem');\n    if (gr.get(id)) {\n      return gr.getValue('state');\n    }\n    return '';\n  },\n  type: 'ProblemAjax'\n});","checks":[{"type":"includes","value":"AbstractAjaxProcessor","message":"Ajax processor"},{"type":"includes","value":"getState","message":"getState method"},{"type":"includes","value":"getParameter('sysparm_sys_id')","message":"Read sysparm_sys_id"},{"type":"includes","value":"new GlideRecord('problem')","message":"Load problem"},{"type":"includes","value":"getValue('state')","message":"Return state"}]},{"id":"prb-13","title":"Assign to Problem Management group","difficulty":"easy","kind":"business_rule","prompt":"If assignment_group is empty, set it from sys_user_group named \"Problem Management\".","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.assignment_group.nil()) {\n    var g = new GlideRecord('sys_user_group');\n    if (g.get('name', 'Problem Management')) {\n      current.setValue('assignment_group', g.getUniqueValue());\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('sys_user_group')","message":"Look up group"},{"type":"includes","value":"Problem Management","message":"Group name"},{"type":"includes","value":"assignment_group","message":"Set assignment_group"}]},{"id":"prb-14","title":"onChange: known error article mandatory","difficulty":"easy","kind":"client","prompt":"onChange of known_error: if true, make knowledge mandatory; else not mandatory.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setMandatory('knowledge', newValue == 'true');\n}","checks":[{"type":"includes","value":"g_form.setMandatory('knowledge'","message":"knowledge mandatory"},{"type":"oneOf","values":["newValue == 'true'","newValue === 'true'","newValue == true"],"message":"When known_error is true"}]},{"id":"prb-15","title":"Encoded query: high priority open problems","difficulty":"intermediate","kind":"server","prompt":"addEncodedQuery priority=1^ORpriority=2^active=true on problem, orderBy priority, log numbers.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('problem');\ngr.addEncodedQuery('priority=1^ORpriority=2^active=true');\ngr.orderBy('priority');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"priority=1","message":"P1"},{"type":"includes","value":"^ORpriority=2","message":"OR P2"},{"type":"includes","value":"active=true","message":"Active"},{"type":"includes","value":"orderBy('priority')","message":"Order by priority"}]},{"id":"prb-16","title":"Prevent delete with related incidents","difficulty":"intermediate","kind":"business_rule","prompt":"Before delete on problem: if any incident has this problem_id, abort and add an error message.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var inc = new GlideRecord('incident');\n  inc.addQuery('problem_id', current.getUniqueValue());\n  inc.setLimit(1);\n  inc.query();\n  if (inc.hasNext()) {\n    gs.addErrorMessage('Cannot delete a problem with related incidents.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Check incidents"},{"type":"includes","value":"problem_id","message":"Match problem_id"},{"type":"includes","value":"setAbortAction(true)","message":"Abort delete"},{"type":"includes","value":"gs.addErrorMessage","message":"Error message"}]}]},{"id":"change","title":"Change Management","blurb":"Normal, standard, and emergency changes: risk, approvals, scheduling, and tasks.","questions":[{"id":"chg-01","title":"Query emergency changes this week","difficulty":"easy","kind":"server","prompt":"Query change_request where type is emergency and active is true. Log each number.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('change_request');\ngr.addQuery('type', 'emergency');\ngr.addQuery('active', true);\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecord('change_request')","message":"change_request table"},{"type":"includes","value":"addQuery('type', 'emergency')","message":"Emergency type"},{"type":"includes","value":"query()","message":"Query"},{"type":"includes","value":".next()","message":"Iterate"}]},{"id":"chg-02","title":"Create a normal change","difficulty":"easy","kind":"server","prompt":"Insert a change_request: type normal, short_description \"Patch Windows cluster\", risk moderate, impact 2. Log the number after insert.","starter":"// Write your ServiceNow script below\n","solution":"var chg = new GlideRecord('change_request');\nchg.initialize();\nchg.setValue('type', 'normal');\nchg.setValue('short_description', 'Patch Windows cluster');\nchg.setValue('risk', 'moderate');\nchg.setValue('impact', '2');\nchg.insert();\ngs.info(chg.getValue('number'));","checks":[{"type":"includes","value":"new GlideRecord('change_request')","message":"change_request"},{"type":"includes","value":"setValue('type', 'normal')","message":"Type normal"},{"type":"includes","value":"Patch Windows cluster","message":"Description"},{"type":"includes","value":"moderate","message":"Risk moderate"},{"type":"includes","value":"insert()","message":"Insert"}]},{"id":"chg-03","title":"Abort if planned end before start","difficulty":"intermediate","kind":"business_rule","prompt":"If end_date is before start_date, abort and add an error message. Use GlideDateTime compareTo.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var start = new GlideDateTime(current.ge includes","value":"change_request","message":"Parent change"},{"type":"includes","value":"Implement","message":"Short description"},{"type":"includes","value":"implementation","message":"Task type"},{"type":"includes","value":"insert()","message":"Insert"}]},{"id":"chg-06","title":"Unauthorized emergency","difficulty":"intermediate","kind":"business_rule","prompt":"If type changes to emergency and gs.hasRole(\"itil\") is true but gs.hasRole(\"itil_admin\") is false and gs.hasRole(\"admin\") is false, abort with an error (only admins / itil_admin may create emergency here).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.type.changesTo('emergency') && !gs.hasRole('itil_admin') && !gs.hasRole('admin')) {\n    gs.addErrorMessage('Only change admins can submit emergency changes.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('emergency')","message":"Detect emergency"},{"type":"includes","value":"gs.hasRole('itil_admin')","message":"Check itil_admin"},{"type":"includes","value":"gs.hasRole('admin')","message":"Check admin"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"chg-07","title":"Copy CI from request to change","difficulty":"easy","kind":"server","prompt":"Load sc_req_item ritmId and create a change_request copying cmdb_ci and short_description. Set requested_by from the RITM requested_for.","starter":"var ritmId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var ritmId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar ritm = new GlideRecord('sc_req_item');\nif (ritm.get(ritmId)) {\n  var chg = new GlideRecord('change_request');\n  chg.initialize();\n  chg.setValue('cmdb_ci', ritm.getValue('cmdb_ci'));\n  chg.setValue('short_description', ritm.getValue('short_description'));\n  chg.setValue('requested_by', ritm.getValue('requested_for'));\n  chg.insert();\n}","checks":[{"type":"includes","value":"new GlideRecord('sc_req_item')","message":"Load RITM"},{"type":"includes","value":"new GlideRecord('change_request')","message":"Create change"},{"type":"includes","value":"cmdb_ci","message":"Copy CI"},{"type":"includes","value":"requested_by","message":"Set requested_by"},{"type":"includes","value":"requested_for","message":"From requested_for"}]},{"id":"chg-08","title":"Client: conflict message on dates","difficulty":"easy","kind":"client","prompt":"onChange of start_date: if g_form.getValue(\"outside_maintenance\") is true, show a field message on start_date of type warning about CAB overlap. Use showFieldMsg.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n  if (g_form.getValue('outside_maintenance') == 'true') {\n    g_form.showFieldMsg('start_date', 'This window is outside maintenance. Expect CAB discussion.', 'warning');\n  }\n}","checks":[{"type":"includes","value":"g_form.showFieldMsg","message":"showFieldMsg"},{"type":"includes","value":"start_date","message":"On start_date"},{"type":"includes","value":"warning","message":"Warning type"},{"type":"includes","value":"outside_maintenance","message":"Check outside_maintenance"}]},{"id":"chg-09","title":"Close remaining change tasks","difficulty":"intermediate","kind":"business_rule","prompt":"When change state is Closed (3) or Canceled (4), close open change_task (state 3) with setWorkflow(false). Treat any state != 3 as open.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var st = current.getValue('state');\n  if (st == '3' || st == '4') {\n    var t = new GlideRecord('change_task');\n    t.addQuery('change_request', current.getUniqueValue());\n    t.addQuery('state', '!=', '3');\n    t.query();\n    while (t.next()) {\n      t.setValue('state', '3');\n      t.setWorkflow(false);\n      t.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('change_task')","message":"change_task"},{"type":"includes","value":"change_request","message":"Parent change"},{"type":"includes","value":"setWorkflow(false)","message":"setWorkflow false"},{"type":"includes","value":"update()","message":"Update tasks"}]},{"id":"chg-10","title":"Count changes on a CI last 30 days","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate COUNT of change_request where cmdb_ci = ciId and sys_created_on is on or after gs.daysAgo(30). Log the count.","starter":"var ciId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var ciId = 'cccccccccccccccccccccccccccccccc';\nvar ga = new GlideAggregate('change_request');\nga.addQuery('cmdb_ci', ciId);\nga.addQuery('sys_created_on', '>=', gs.daysAgo(30));\nga.addAggregate('COUNT');\nga.query();\nif (ga.next()) {\n  gs.info(ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('change_request')","message":"Aggregate changes"},{"type":"includes","value":"cmdb_ci","message":"Filter CI"},{"type":"includes","value":"gs.daysAgo(30)","message":"Last 30 days"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"}]},{"id":"chg-11","title":"Queue change.approval.required","difficulty":"easy","kind":"business_rule","prompt":"When state changes to Assess (2), queue change.approval.required with parm1 = assignment_group display value.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('2')) {\n    gs.eventQueue('change.approval.required', current, current.assignment_group.getDisplayValue(), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('2')","message":"Assess state"},{"type":"includes","value":"gs.eventQueue","message":"Queue event"},{"type":"includes","value":"change.approval.required","message":"Event name"}]},{"id":"chg-12","title":"Risk calculation stub","difficulty":"intermediate","kind":"business_rule","prompt":"If impact is 1, set risk to high. Else if impact is 2, set risk to moderate. Else set risk to low.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var impact = current.getValue('impact');\n  if (impact == '1') {\n    current.setValue('risk', 'high');\n  } else if (impact == '2') {\n    current.setValue('risk', 'moderate');\n  } else {\n    current.setValue('risk', 'low');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"getValue('impact')","message":"Read impact"},{"type":"includes","value":"setValue('risk', 'high')","message":"High risk"},{"type":"includes","value":"setValue('risk', 'moderate')","message":"Moderate"},{"type":"includes","value":"setValue('risk', 'low')","message":"Low"}]},{"id":"chg-13","title":"GlideAjax: isChangeBlackout","difficulty":"intermediate","kind":"script_include","prompt":"ChangeAjax.inBlackout reads sysparm_start. If it contains \"2026-12-25\" return \"true\" else \"false\". (Simulated blackout check.)","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var ChangeAjax = Class.create();\nChangeAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  inBlackout: function() {\n    var start = this.getParameter('sysparm_start') || '';\n    return start.indexOf('2026-12-25') >= 0 ? 'true' : 'false';\n  },\n  type: 'ChangeAjax'\n});","checks":[{"type":"includes","value":"AbstractAjaxProcessor","message": rent, previous /*null when async*/) {\n  if (current.backout_plan.changes()) {\n    current.comments = current.getValue('backout_plan');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"backout_plan.changes()","message":"When backout_plan changes"},{"type":"oneOf","values":["current.comments","setValue('comments'"],"message":"Write comments"}]}]},{"id":"request","title":"Request & Catalog","blurb":"Service Catalog requests, RITMs, catalog tasks, variables, and request fulfillment.","questions":[{"id":"req-01","title":"Query open requested items","difficulty":"easy","kind":"server","prompt":"Query sc_req_item where active is true and state is not Closed Complete (3). Log the number of each RITM.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('sc_req_item');\ngr.addQuery('active', true);\ngr.addQuery('state', '!=', '3');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecord('sc_req_item')","message":"sc_req_item"},{"type":"includes","value":"addQuery('active', true)","message":"Active"},{"type":"includes","value":"addQuery('state', '!=', '3')","message":"Not closed complete"},{"type":"includes","value":".next()","message":"Iterate"}]},{"id":"req-02","title":"Create a catalog request and RITM","difficulty":"intermediate","kind":"server","prompt":"Insert sc_request for the current user (requested_for). Then insert sc_req_item linked via request, cat_item sys_id itemId, short_description \"Laptop request\".","starter":"var itemId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var itemId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar req = new GlideRecord('sc_request');\nreq.initialize();\nreq.setValue('requested_for', gs.getUserID());\nvar reqId = req.insert();\nvar ritm = new GlideRecord('sc_req_item');\nritm.initialize();\nritm.setValue('request', reqId);\nritm.setValue('cat_item', itemId);\nritm.setValue('short_description', 'Laptop request');\nritm.insert();","checks":[{"type":"includes","value":"new GlideRecord('sc_request')","message":"Create request"},{"type":"includes","value":"gs.getUserID()","message":"Current user"},{"type":"includes","value":"new GlideRecord('sc_req_item')","message":"Create RITM"},{"type":"includes","value":"cat_item","message":"Set cat_item"},{"type":"includes","value":"Laptop request","message":"Description"},{"type":"includes","value":"insert()","message":"Insert records"}]},{"id":"req-03","title":"Abort RITM close with open catalog tasks","difficulty":"intermediate","kind":"business_rule","prompt":"On sc_req_item, if state changes to Closed Complete (3) and any sc_task for this request_item is still active, abort and add an error.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('3')) {\n    var t = new GlideRecord('sc_task');\n    t.addQuery('request_item', current.getUniqueValue());\n    t.addQuery('active', true);\n    t.setLimit(1);\n    t.query();\n    if (t.hasNext()) {\n      gs.addErrorMessage('Close catalog tasks before closing the requested item.');\n      current.setAbortAction(true);\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('sc_task')","message":"Query sc_task"},{"type":"includes","value":"request_item","message":"Link to RITM"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"},{"type":"includes","value":"gs.addErrorMessage","message":"Error"}]},{"id":"req-04","title":"Set stage to fulfillment","difficulty":"easy","kind":"business_rule","prompt":"When assignment_group is set (changes and not nil), set stage to fulfillment.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.assignment_group.changes() && !current.assignment_group.nil()) {\n    current.setValue('stage', 'fulfillment');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"assignment_group.changes()","message":"Watch assignment_group"},{"type":"includes","value":"setValue('stage', 'fulfillment')","message":"Stage fulfillment"}]},{"id":"req-05","title":"Create a catalog task","difficulty":"easy","kind":"server","prompt":"Insert sc_task for RITM ritmId, short_description \"Procure hardware\", assignment_group looked up by name \"Hardware\".","starter":"var ritmId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var ritmId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar g = new GlideRecord('sys_user_group');\ng.get('name', 'Hardware');\nvar t = new GlideRecord('sc_task');\nt.initialize();\nt.setValue('request_item', ritmId);\nt.setValue('short_description', 'Procure hardware');\nt.setValue('assignment_group', g.getUniqueValue());\nt.insert();","checks":[{"type":"includes","value":"new GlideRecord('sc_task')","message":"sc_task"},{"type":"includes","value":"request_item","message":"Parent RITM"},{"type":"includes","value":"Procure hardware","message":"Description"},{"type":"includes","value":"Hardware","message":"Hardware group"}]},{"id":"req-06","title":"Cart API style: set quantity variable","difficulty":"intermediate","kind":"server","prompt":"Load sc_item_option_mtom is not required. Instead: GlideRecord sc_item_option where request_item = ritmId and item_option_new.name is \"quantity\". Set value to \"2\" and update. Use a join query or two-step query. Simple approach: query sc_item_option_mtom... For this lab, query sc_item_option with addQuery(\"request_item\", ritmId) and addQuery(\"item_option_new.name\", \"quantity\").","starter":"var ritmId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var ritmId = 'cccccccccccccccccccccccccccccccc';\nvar opt = new GlideRecord('sc_item_option');\nopt.addQuery('request_item', ritmId);\nopt.addQuery('item_option_new.name', 'quantity');\nopt.query();\nif (opt.next()) {\n  opt.setValue('value', '2');\n  opt.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('sc_item_option')","message":"Variable value table"},{"type":"includes","value":"quantity","message":"quantity variable"},{"type":"includes","value":"setValue('value', '2')","message":"Set quantity 2"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"req-07","title":"Client: hide delivery_address for pickup","difficulty":"easy","kind":"client","prompt":"onChange of delivery_method: if newValue is pickup, hide delivery_address; otherwise show it.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setDisplay('delivery_address', newValue != 'pickup');\n}","checks":[{"type":"includes","value":"g_form.setDisplay('delivery_address'","message":"Toggle delivery_address"},{"type":"includes","value":"pickup","message":"Pickup method"}]},{"id":"req-08","title":"Close request when all RITMs close","difficulty":"intermediate","kind":"server","prompt":"For request reqId, if no active sc_req_item remain, set the sc_request state to Closed Complete (3) and update.","starter":"var reqId = 'dddddddddddddddddddddddddddddddd';\n","solution":"var reqId = 'dddddddddddddddddddddddddddddddd';\nvar ritm = new GlideRecord('sc_req_item');\nritm.addQuery('request', reqId);\nritm.addQuery('active', true);\nritm.setLimit(1);\nritm.query();\nif (!ritm.hasNext()) {\n  var req = new GlideRecord('sc_request');\n  if (req.get(reqId)) {\n    req.setValue('request_state', 'closed_complete');\n    req.update();\n  }\n}","checks":[{"type":"includes","value":"new GlideRecord('sc_req_item')","message":"Check RITMs"},{"type":"includes","value":"new GlideRecord('sc_request')","message":"Update request"},{"type":"oneOf","values":["closed_complete","setValue('state', '3')","setValue('request_state'"],"message":"Close the request"},{"type":"includes","value":"update()","message":"Save request"}]},{"id":"req-09","title":"Event sc.request.opened","difficulty":"easy","kind":"business_rule","prompt":"On insert of sc_request, queue sc.request.opened with parm1 = requested_for display value.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  gs.eventQueue('sc.request.opened', current, current.requested_for.getDisplayValue(), '');\n})(current, previous);","checks":[{"type":"includes","value":"gs.eventQueue","message":"eventQueue"},{"type":"includes","value":"sc.request.opened","message":"Event name"},{"type":"includes","value":"requested_for","message":"Parm from requested_for"}]},{"id":"req-10","title":"Count RITMs per catalog item","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate sc_req_item COUNT grouped by cat_item. Log cat_item and count.","starter":"// Write your ServiceNow script below\n","solution":"var ga = new GlideAggregate('sc_req_item');\nga.addAggregate('COUNT');\nga.groupBy('cat_item');\nga.query();\nwhile (ga.next()) {\n  gs.info(ga.getValue('cat_item') + ' ' + ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('sc_req_item')","message":"Aggregate RITMs"},{"type":"includes","value":"groupBy('cat_item')","message":"Group by cat_item"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"},{"type":"includes","value":"getAggregate","message":"Read count"}]},{"id":"req-11","title":"GlideAjax: getItemPrice","difficulty":"intermediate","kind":"script_include","prompt":"CatalogAjax.getPrice reads sysparm_item, loads sc_cat_item, returns price field.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","s ","kind":"server","prompt":"Load sysapproval_approver by sys_id appId and set state to approved, then update.","starter":"var appId = 'ffffffffffffffffffffffffffffffff';\n","solution":"var appId = 'ffffffffffffffffffffffffffffffff';\nvar app = new GlideRecord('sysapproval_approver');\nif (app.get(appId)) {\n  app.setValue('state', 'approved');\n  app.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('sysapproval_approver')","message":"Approver table"},{"type":"includes","value":"setValue('state', 'approved')","message":"Approved"},{"type":"includes","value":"update()","message":"Update"}]}]},{"id":"knowledge","title":"Knowledge Management","blurb":"Author, publish, retire, and search knowledge articles used by ITSM.","questions":[{"id":"kb-01","title":"Query published articles in a KB","difficulty":"easy","kind":"server","prompt":"Query kb_knowledge where workflow_state is published and kb_knowledge_base name is \"IT\". Use addQuery with a join or encoded query kb_knowledge_base.name=IT. Log number and short_description.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('kb_knowledge');\ngr.addQuery('workflow_state', 'published');\ngr.addQuery('kb_knowledge_base.name', 'IT');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number') + ' ' + gr.getValue('short_description'));\n}","checks":[{"type":"includes","value":"new GlideRecord('kb_knowledge')","message":"kb_knowledge"},{"type":"includes","value":"addQuery('workflow_state', 'published')","message":"Published"},{"type":"includes","value":"kb_knowledge_base","message":"Knowledge base"},{"type":"includes","value":"IT","message":"IT knowledge base"}]},{"id":"kb-02","title":"Create a draft article","difficulty":"easy","kind":"server","prompt":"Insert kb_knowledge with short_description \"Reset VPN client\", text \"Reinstall the VPN profile.\", workflow_state draft, and kb_knowledge_base looked up by title/name \"IT\". Use get on kb_knowledge_base table (name field).","starter":"// Write your ServiceNow script below\n","solution":"var kb = new GlideRecord('kb_knowledge_base');\nkb.get('name', 'IT');\nvar art = new GlideRecord('kb_knowledge');\nart.initialize();\nart.setValue('short_description', 'Reset VPN client');\nart.setValue('text', 'Reinstall the VPN profile.');\nart.setValue('workflow_state', 'draft');\nart.setValue('kb_knowledge_base', kb.getUniqueValue());\nart.insert();","checks":[{"type":"includes","value":"new GlideRecord('kb_knowledge')","message":"Create article"},{"type":"includes","value":"Reset VPN client","message":"Title"},{"type":"includes","value":"draft","message":"Draft state"},{"type":"includes","value":"kb_knowledge_base","message":"Set KB"}]},{"id":"kb-03","title":"Retire expired articles","difficulty":"intermediate","kind":"server","prompt":"Query kb_knowledge where valid_to is before gs.nowDateTime() and workflow_state is published. Set workflow_state to retired and update each with setWorkflow(false).","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('kb_knowledge');\ngr.addQuery('workflow_state', 'published');\ngr.addQuery('valid_to', '\u003c', gs.nowDateTime());\ngr.query();\nwhile (gr.next()) {\n  gr.setValue('workflow_state', 'retired');\n  gr.setWorkflow(false);\n  gr.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('kb_knowledge')","message":"Articles"},{"type":"includes","value":"valid_to","message":"Expiration"},{"type":"includes","value":"retired","message":"Retire"},{"type":"includes","value":"setWorkflow(false)","message":"Skip extra workflow"}]},{"id":"kb-04","title":"Increment helpful count","difficulty":"easy","kind":"server","prompt":"Load article by sys_id kbId. Increment helpful_count by 1 (parseInt) and update.","starter":"var kbId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var kbId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar gr = new GlideRecord('kb_knowledge');\nif (gr.get(kbId)) {\n  var n = parseInt(gr.getValue('helpful_count') || '0', 10);\n  gr.setValue('helpful_count', n + 1);\n  gr.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('kb_knowledge')","message":"Load article"},{"type":"includes","value":"helpful_count","message":"helpful_count"},{"type":"includes","value":"parseInt","message":"parseInt"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"kb-05","title":"Abort publish without text","difficulty":"intermediate","kind":"business_rule","prompt":"If workflow_state changes to published and text is empty, abort and add an error.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.workflow_state.changesTo('published') && current.text.nil()) {\n    gs.addErrorMessage('Article body is required to publish.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('published')","message":"Publishing"},{"type":"oneOf","values":["text.nil()","getValue('text')"],"message":"Check text"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"kb-06","title":"Link article to incident","difficulty":"easy","kind":"server","prompt":"Set incident incId field knowledge to kbId (or caused_by / knowledge depending on instance). Use setValue(\"knowledge\", kbId) on incident and update.","starter":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar kbId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar kbId = 'cccccccccccccccccccccccccccccccc';\nvar inc = new GlideRecord('incident');\nif (inc.get(incId)) {\n  inc.setValue('knowledge', kbId);\n  inc.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Incident"},{"type":"includes","value":"setValue('knowledge'","message":"Set knowledge"},{"type":"includes","value":"kbId","message":"Use kbId"}]},{"id":"kb-07","title":"Record kb_feedback","difficulty":"easy","kind":"server","prompt":"Insert kb_feedback for article kbId with used_count not needed: set article, user gs.getUserID(), and commented true, comments \"Fixed my issue\".","starter":"var kbId = 'dddddddddddddddddddddddddddddddd';\n","solution":"var kbId = 'dddddddddddddddddddddddddddddddd';\nvar fb = new GlideRecord('kb_feedback');\nfb.initialize();\nfb.setValue('article', kbId);\nfb.setValue('user', gs.getUserID());\nfb.setValue('commented', true);\nfb.setValue('comments', 'Fixed my issue');\nfb.insert();","checks":[{"type":"includes","value":"new GlideRecord('kb_feedback')","message":"kb_feedback"},{"type":"includes","value":"article","message":"Article"},{"type":"includes","value":"Fixed my issue","message":"Comment"},{"type":"includes","value":"gs.getUserID()","message":"Current user"}]},{"id":"kb-08","title":"Client: category mandatory on publish","difficulty":"easy","kind":"client","prompt":"onChange workflow_state: if newValue is published, setMandatory topic or kb_category. Use field kb_category.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setMandatory('kb_category', newValue == 'published');\n}","checks":[{"type":"includes","value":"g_form.setMandatory('kb_category'","message":"kb_category mandatory"},{"type":"includes","value":"published","message":"When published"}]},{"id":"kb-09","title":"Search encoded query","difficulty":"intermediate","kind":"server","prompt":"addEncodedQuery workflow_state=published^short_descriptionLIKEVPN on kb_knowledge, orderByDesc sys_view_count, setLimit 5, log numbers.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('kb_knowledge');\ngr.addEncodedQuery('workflow_state=published^short_descriptionLIKEVPN');\ngr.orderByDesc('sys_view_count');\ngr.setLimit(5);\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"short_descriptionLIKEVPN","message":"LIKE VPN"},{"type":"includes","value":"orderByDesc('sys_view_count')","message":"Popular first"},{"type":"includes","value":"setLimit(5)","message":"Limit 5"}]},{"id":"kb-10","title":"GlideAjax canReadArticle","difficulty":"intermediate","kind":"script_include","prompt":"KBAjax.canRead: load kb_knowledge by sysparm_id, return \"true\" if canRead() else \"false\".","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var KBAjax = Class.create();\nKBAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  canRead: function() {\n    var id = this.getParameter('sysparm_id');\n    var gr = new GlideRecord('kb_knowledge');\n    if (gr.get(id) && gr.canRead()) {\n      return 'true';\n    }\n    return 'false';\n  },\n  type: 'KBAjax'\n});","checks":[{"type":"includes","value":"canRead","message":"canRead"},{"type":"includes","value":"getParameter('sysparm_id')","message":"sysparm_id"},{"type":"includes","value":"new GlideRecord('kb_knowledge')","message":"Article"},{"type":"includes","value":".canRead()","message":"ACL canRead"}]},{"id":"kb-11","title":"Event kb.published","difficulty":"easy","kind":"business_rule","prompt":"When workflow_state changes to published, queue kb.published with parm1 = number.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.workflow_state.changesTo('published')) {\n    gs.eventQueue('kb.published', current, current.getValue('number'), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.eventQueue","message":"eventQueue"},{"type":"includes","value":"kb.published","message":"Event"},{"type":"includes","value":"getValue('number')","message":"Number parm"}]},{"id":"kb-12","title":"Copy article to a new draft","difficulty":"intermediate","kind":"server","prompt":"Load kbId, insert a new kb_knowledge copying short_description and text, set workflow_state draft, short_description prefix \"Copy of \".","starter":"var kbId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\n","solution":"var kbId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\nvar src = new GlideRecord('kb_knowledge');\nif (src.get(kbId)) {\n  var copy = new GlideRecord('kb_knowledge');\n  copy.initialize();\n  copy.setValue('short_description', 'Copy of ' + src.getValue('short_description'));\n  copy.setValue('text', src.getValue('text'));\n  copy.setValue('workflow_state', 'draft');\n  copy.setValue('kb_knowledge_base', src.getValue('kb_knowledge_base'));\n  copy.insert();\n}","checks":[{"type":"includes","value":"Copy of ","message":"Prefix"},{"type":"includes","value":"setValue('text'","message":"Copy text"},{"type":"includes","value":"draft","message":"Draft"},{"type":"includes","value":"insert()","message":"Insert copy"}]},{"id":"kb-13","title":"onLoad: read-only published body","difficulty":"easy","kind":"client","prompt":"If workflow_state is published, setReadOnly text to true.","starter":"function onLoad() {\n\n}\n","solution":"function onLoad() {\n  if (g_form.getValue('workflow_state') == 'published') {\n    g_form.setReadOnly('text', true);\n  }\n}","checks":[{"type":"includes","value":"g_form.getValue('workflow_state')","message":"Read state"},{"type":"includes","value":"g_form.setReadOnly('text', true)","message":"Lock text"}]},{"id":"kb-14","title":"Count articles by author","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate COUNT on kb_knowledge groupBy author. Log author and count.","starter":"// Write your ServiceNow script below\n","solution":"var ga = new GlideAggregate('kb_knowledge');\nga.addAggregate('COUNT');\nga.groupBy('author');\nga.query();\nwhile (ga.next()) {\n  gs.info(ga.getValue('author') + ' ' + ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('kb_knowledge')","message":"Aggregate"},{"type":"includes","value":"groupBy('author')","message":"By author"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"}]},{"id":"kb-15","title":"Set valid_to 90 days out","difficulty":"intermediate","kind":"business_rule","prompt":"On insert, if valid_to is empty, set it to now plus 90 days using GlideDateTime addDaysUTC(90).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.valid_to.nil()) {\n    var gdt = new GlideDateTime();\n    gdt.addDaysUTC(90);\n    current.setValue('valid_to', gdt.getValue());\n  }\n})(current, previous);","checks":[{"type":"includes","value":"GlideDateTime","message":"GlideDateTime"},{"type":"includes","value":"addDaysUTC(90)","message":"Plus 90 days"},{"type":"includes","value":"valid_to","message":"Set valid_to"}]},{"id":"kb-16","title":"Prevent delete of published","difficulty":"easy","kind":"business_rule","prompt":"Before delete: if workflow_state is published, abort and add an error.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.getValue('workflow_state') == 'published') {\n    gs.addErrorMessage('Retire the article instead of deleting it.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"published","message":"Published check"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"},{"type":"includes","value":"gs.addErrorMessage","message":"Error"}]}]},{"id":"cmdb","title":"CMDB & Configuration","blurb":"Configuration items, relationships, identification, and CI health used by ITSM.","questions":[{"id":"cmdb-01","title":"Query operational servers","difficulty":"easy","kind":"server","prompt":"Query cmdb_ci_server where operational_status is 1 (Operational). Log name.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('cmdb_ci_server');\ngr.addQuery('operational_status', '1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('name'));\n}","checks":[{"type":"includes","value":"new GlideRecord('cmdb_ci_server')","message":"Server CIs"},{"type":"includes","value":"operational_status","message":"Operational status"},{"type":"includes","value":"getValue('name')","message":"Log name"}]},{"id":"cmdb-02","title":"Create an application CI","difficulty":"easy","kind":"server","prompt":"Insert cmdb_ci_appl named \"Payroll Portal\", install_status 1. Log sys_id.","starter":"// Write your ServiceNow script below\n","solution":"var ci = new GlideRecord('cmdb_ci_appl');\nci.initialize();\nci.setValue('name', 'Payroll Portal');\nci.setValue('install_status', '1');\nvar id = ci.insert();\ngs.info(id);","checks":[{"type":"includes","value":"new GlideRecord('cmdb_ci_appl')","message":"Application CI"},{"type":"includes","value":"Payroll Portal","message":"Name"},{"type":"includes","value":"insert()","message":"Insert"}]},{"id":"cmdb-03","title":"Relate app Runs on::Runs server","difficulty":"intermediate","kind":"server","prompt":"Insert cmdb_rel_ci: parent = appId, child = serverId, type = the sys_id of the relationship type looked up from cmdb_rel_type where name is \"Runs on::Runs\". If lookup fails, still set parent and child.","starter":"var appId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar serverId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var appId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar serverId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar type = new GlideRecord('cmdb_rel_type');\ntype.get('name', 'Runs on::Runs');\nvar rel = new GlideRecord('cmdb_rel_ci');\nrel.initialize();\nrel.setValue('parent', appId);\nrel.setValue('child', serverId);\nrel.setValue('type', type.getUniqueValue());\nrel.insert();","checks":[{"type":"includes","value":"new GlideRecord('cmdb_rel_ci')","message":"Relationship table"},{"type":"includes","value":"setValue('parent', appId)","message":"Parent app"},{"type":"includes","value":"setValue('child', serverId)","message":"Child server"},{"type":"includes","value":"Runs on::Runs","message":"Relationship type name"}]},{"id":"cmdb-04","title":"Find CIs missing support group","difficulty":"easy","kind":"server","prompt":"Query cmdb_ci addNullQuery support_group, addActiveQuery or operational, setLimit 50, log names.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('cmdb_ci');\ngr.addNullQuery('support_group');\ngr.setLimit(50);\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('name'));\n}","checks":[{"type":"includes","value":"new GlideRecord('cmdb_ci')","message":"cmdb_ci"},{"type":"includes","value":"addNullQuery('support_group')","message":"Missing support group"},{"type":"includes","value":"setLimit(50)","message":"Limit 50"}]},{"id":"cmdb-05","title":"Set support group from assignment","difficulty":"easy","kind":"business_rule","prompt":"If support_group is empty and assignment_group is not, copy assignment_group to support_group.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.support_group.nil() && !current.assignment_group.nil()) {\n    current.setValue('support_group', current.getValue('assignment_group'));\n  }\n})(current, previous);","checks":[{"type":"includes","value":"support_group","message":"support_group"},{"type":"includes","value":"assignment_group","message":"assignment_group"},{"type":"includes","value":"setValue","message":"Copy
