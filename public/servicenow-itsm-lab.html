atory('serial_number', true)","message":"Mandatory serial"}]},{"id":"cmdb-09","title":"Retire CI and related relationships","difficulty":"intermediate","kind":"server","prompt":"Set CI ciId install_status to 7 (Retired). Delete cmdb_rel_ci where parent or child is ciId using two queries or addEncodedQuery parent=ciId^ORchild=ciId then deleteMultiple.","starter":"var ciId = 'dddddddddddddddddddddddddddddddd';\n","solution":"var ciId = 'dddddddddddddddddddddddddddddddd';\nvar ci = new GlideRecord('cmdb_ci');\nif (ci.get(ciId)) {\n  ci.setValue('install_status', '7');\n  ci.update();\n}\nvar rel = new GlideRecord('cmdb_rel_ci');\nrel.addEncodedQuery('parent=' + ciId + '^ORchild=' + ciId);\nrel.deleteMultiple();","checks":[{"type":"includes","value":"setValue('install_status', '7')","message":"Retire status 7"},{"type":"includes","value":"new GlideRecord('cmdb_rel_ci')","message":"Relationships"},{"type":"includes","value":"deleteMultiple()","message":"Delete relationships"},{"type":"includes","value":"^OR","message":"Parent or child"}]},{"id":"cmdb-10","title":"Encoded query: Windows OS","difficulty":"easy","kind":"server","prompt":"Query cmdb_ci_computer addEncodedQuery osLIKEWindows^operational_status=1. Log names.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('cmdb_ci_computer');\ngr.addEncodedQuery('osLIKEWindows^operational_status=1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('name'));\n}","checks":[{"type":"includes","value":"new GlideRecord('cmdb_ci_computer')","message":"Computers"},{"type":"includes","value":"osLIKEWindows","message":"Windows OS"},{"type":"includes","value":"operational_status=1","message":"Operational"}]},{"id":"cmdb-11","title":"GlideAjax getCISupportGroup","difficulty":"intermediate","kind":"script_include","prompt":"CMDBAjax.supportGroup reads sysparm_ci, returns support_group sys_id.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var CMDBAjax = Class.create();\nCMDBAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  supportGroup: function() {\n    var id = this.getParameter('sysparm_ci');\n    var ci = new GlideRecord('cmdb_ci');\n    if (ci.get(id)) {\n      return ci.getValue('support_group');\n    }\n    return '';\n  },\n  type: 'CMDBAjax'\n});","checks":[{"type":"includes","value":"supportGroup","message":"Method"},{"type":"includes","value":"getParameter('sysparm_ci')","message":"sysparm_ci"},{"type":"includes","value":"getValue('support_group')","message":"support_group"}]},{"id":"cmdb-12","title":"Event cmdb.ci.retired","difficulty":"easy","kind":"business_rule","prompt":"When install_status changes to 7, queue cmdb.ci.retired with parm1 = name.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.install_status.changesTo('7')) {\n    gs.eventQueue('cmdb.ci.retired', current, current.getValue('name'), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('7')","message":"Retired"},{"type":"includes","value":"gs.eventQueue","message":"Event"},{"type":"includes","value":"cmdb.ci.retired","message":"Event name"}]},{"id":"cmdb-13","title":"Duplicate name check","difficulty":"intermediate","kind":"business_rule","prompt":"Before insert, query cmdb_ci for the same name. If found, abort with an error.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  var gr = new GlideRecord('cmdb_ci');\n  gr.addQuery('name', current.getValue('name'));\n  gr.setLimit(1);\n  gr.query();\n  if (gr.hasNext()) {\n    gs.addErrorMessage('A CI with this name already exists.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('cmdb_ci')","message":"Query CIs"},{"type":"includes","value":"addQuery('name'","message":"Same name"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"cmdb-14","title":"Walk child CIs","difficulty":"intermediate","kind":"server","prompt":"Query cmdb_rel_ci where parent is ciId. For each, load child cmdb_ci and gs.info the child name.","starter":"var ciId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\n","solution":"var ciId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\nvar rel = new GlideRecord('cmdb_rel_ci');\nrel.addQuery('parent', ciId);\nrel.query();\nwhile (rel.next()) {\n  var child = new GlideRecord('cmdb_ci');\n  if (child.get(rel.getValue('child'))) {\n    gs.info(child.getValue('name'));\n  }\n}","checks":[{"type":"includes","value":"new GlideRecord('cmdb_rel_ci')","message":"Relationships"},{"type":"includes","value":"addQuery('parent', ciId)","message":"Children of parent"},{"type":"includes","value":"new GlideRecord('cmdb_ci')","message":"Load child CI"},{"type":"includes","value":"getValue('name')","message":"Log name"}]},{"id":"cmdb-15","title":"createOrUpdateCI","difficulty":"intermediate","kind":"server","prompt":"Call IdentificationEngine.createOrUpdateCI with source \"ServiceNow\" and a JSON payload for cmdb_ci_win_server named \"winapp01\".","starter":"// Write your ServiceNow script below\n","solution":"var payload = JSON.stringify({\n  items: [\n    { className: 'cmdb_ci_win_server', values: { name: 'winapp01' } }\n  ]\n});\nvar result = IdentificationEngine.createOrUpdateCI('ServiceNow', payload);\ngs.info(result);","checks":[{"type":"includes","value":"IdentificationEngine.createOrUpdateCI","message":"createOrUpdateCI"},{"type":"includes","value":"ServiceNow","message":"Source"},{"type":"includes","value":"cmdb_ci_win_server","message":"Windows server"},{"type":"includes","value":"winapp01","message":"Name"}]},{"id":"cmdb-16","title":"onChange: warn if CI retired","difficulty":"easy","kind":"client","prompt":"onChange of cmdb_ci on incident: getReference callback; if operational_status is 6 (Retired) showFieldMsg on cmdb_ci error.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n  g_form.getReference('cmdb_ci', function(ci) {\n    if (ci.operational_status == '6') {\n      g_form.showFieldMsg('cmdb_ci', 'Selected CI is retired', 'error');\n    }\n  });\n}","checks":[{"type":"includes","value":"g_form.getReference('cmdb_ci'","message":"getReference"},{"type":"includes","value":"operational_status","message":"Status"},{"type":"includes","value":"showFieldMsg","message":"Field message"}]}]},{"id":"asset","title":"Asset Management","blurb":"Hardware and software assets, stock, assignment, and lifecycle in ITSM.","questions":[{"id":"ast-01","title":"Query in-stock hardware","difficulty":"easy","kind":"server","prompt":"Query alm_hardware where install_status is 6 (In stock). Log asset_tag.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('alm_hardware');\ngr.addQuery('install_status', '6');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('asset_tag'));\n}","checks":[{"type":"includes","value":"new GlideRecord('alm_hardware')","message":"Hardware assets"},{"type":"includes","value":"addQuery('install_status', '6')","message":"In stock"},{"type":"includes","value":"asset_tag","message":"Log asset tag"}]},{"id":"ast-02","title":"Create a hardware asset","difficulty":"easy","kind":"server","prompt":"Insert alm_hardware with display_name \"Laptop\", asset_tag \"AST-1001\", serial_number \"SN9\", install_status 1 (In use).","starter":"// Write your ServiceNow script below\n","solution":"var ast = new GlideRecord('alm_hardware');\nast.initialize();\nast.setValue('display_name', e":"Abort"}]},{"id":"ast-05","title":"Sync CI from asset","difficulty":"intermediate","kind":"business_rule","prompt":"When assigned_to changes, if ci is not empty, load cmdb_ci and set assigned_to to the same user, then update the CI with setWorkflow(false).","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.assigned_to.changes() && !current.ci.nil()) {\n    var ci = new GlideRecord('cmdb_ci');\n    if (ci.get(current.getValue('ci'))) {\n      ci.setValue('assigned_to', current.getValue('assigned_to'));\n      ci.setWorkflow(false);\n      ci.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"assigned_to.changes()","message":"Watch assigned_to"},{"type":"includes","value":"new GlideRecord('cmdb_ci')","message":"Update CI"},{"type":"includes","value":"setWorkflow(false)","message":"Avoid loops"}]},{"id":"ast-06","title":"Count assets by model","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate COUNT alm_asset groupBy model. Log model and count.","starter":"// Write your ServiceNow script below\n","solution":"var ga = new GlideAggregate('alm_asset');\nga.addAggregate('COUNT');\nga.groupBy('model');\nga.query();\nwhile (ga.next()) {\n  gs.info(ga.getValue('model') + ' ' + ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('alm_asset')","message":"Aggregate assets"},{"type":"includes","value":"groupBy('model')","message":"By model"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"}]},{"id":"ast-07","title":"Client: cost mandatory when in use","difficulty":"easy","kind":"client","prompt":"onChange install_status: if newValue is 1, setMandatory cost true else false.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution": is empty, addErrorMessage and return false.","starter":"function onSubmit() {\n  return true;\n}\n","solution":"function onSubmit() {\n  if (g_form.getValue('install_status') == '6' && !g_form.getValue('stockroom')) {\n    g_form.addErrorMessage('Stockroom is required for in-stock assets.');\n    return false;\n  }\n  return true;\n}","checks":[{"type":"includes","value":"install_status","message":"Status"},{"type":"includes","value":"stockroom","message":"Stockroom"},{"type":"includes","value":"return false","message":"Block"}]},{"id":"ast-13","title":"Encoded query: warranty expired","difficulty":"intermediate","kind":"server","prompt":"Query alm_hardware addEncodedQuery warranty_expiration\u003cjavascript:gs.now()^install_status=1. Log asset_tag.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('alm_hardware');\ngr.addEncodedQuery('warranty_expiration\u003cjavascript:gs.now()^install_status=1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('asset_tag'));\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"warranty_expiration","message":"Warranty"},{"type":"includes","value":"install_status=1","message":"In use"}]},{"id":"ast-14","title":"Link asset to incident CI","difficulty":"easy","kind":"server","prompt":"Load incident incId; if cmdb_ci is set, query alm_asset where ci equals that value and gs.info asset_tag of each.","starter":"var incId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var incId = 'cccccccccccccccccccccccccccccccc';\nvar inc = new GlideRecord('incident');\nif (inc.get(incId) && inc.getValue('cmdb_ci')) {\n  var ast = new GlideRecord('alm_asset');\n  ast.addQuery('ci', inc.getValue('cmdb_ci'));\n  ast.query();\n  while (ast.next()) {\n    gs.info(ast.getValue('asset_tag'));\n  }\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Incident"},{"type":"includes","value":"new GlideRecord('alm_asset')","message":"Assets"},{"type":"includes","value":"addQuery('ci'","message":"Match CI"}]},{"id":"ast-15","title":"Bulk retire by model","difficulty":"intermediate","kind":"server","prompt":"Query alm_asset where model is modelId, set install_status 7, updateMultiple (also set substatus disposed if the field exists—set substatus to disposed before updateMultiple).","starter":"var modelId = 'dddddddddddddddddddddddddddddddd';\n","solution":"var modelId = 'dddddddddddddddddddddddddddddddd';\nvar ast = new GlideRecord('alm_asset');\nast.addQuery('model', modelId);\nast.setValue('install_status', '7');\nast.setValue('substatus', 'disposed');\nast.updateMultiple();","checks":[{"type":"includes","value":"addQuery('model', modelId)","message":"Filter model"},{"type":"includes","value":"setValue('install_status', '7')","message":"Retire"},{"type":"includes","value":"updateMultiple()","message":"Bulk update"},{"type":"includes","value":"disposed","message":"Substatus"}]},{"id":"ast-16","title":"Prevent delete of in-use asset","difficulty":"easy","kind":"business_rule","prompt":"Before delete, if install_status is 1, abort with an error.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.getValue('install_status') == '1') {\n    gs.addErrorMessage('Return the asset to stock before deleting.');\n    current.setAbortAction(true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"install_status","message":"Check status"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"},{"type":"includes","value":"gs.addErrorMessage","message":"Error"}]}]},{"id":"sla","title":"SLA Management","blurb":"Task SLAs, breach handling, pause conditions, and notifications.","questions":[{"id":"sla-01","title":"Query breached task SLAs","difficulty":"easy","kind":"server","prompt":"Query task_sla where has_breached is true and stage is in_progress. Log the task display (task.getDisplayValue) or task field.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('task_sla');\ngr.addQuery('has_breached', true);\ngr.addQuery('stage', 'in_progress');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getDisplayValue('task'));\n}","checks":[{"type":"includes","value":"new GlideRecord('task_sla')","message":"task_sla"},{"type":"includes","value":"has_breached","message":"Breached"},{"type":"includes","value":"addQuery('stage', 'in_progress')","message":"In progress"}]},{"id":"sla-02","title":"Count open SLAs for an incident","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate COUNT task_sla where task = incId and stage != complete. Log count. Use addQuery stage != completed or stage=in_progress. Filter task = incId.","starter":"var incId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var incId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar ga = new GlideAggregate('task_sla');\nga.addQuery('task', incId);\nga.addQuery('stage', '!=', 'completed');\nga.addAggregate('COUNT');\nga.query();\nif (ga.next()) {\n  gs.info(ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('task_sla')","message":"Aggregate task_sla"},{"type":"includes","value":"addQuery('task', incId)","message":"For the incident"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"}]},{"id":"sla-03","title":"On breach escalate assignment group","difficulty":"intermediate","kind":"business_rule","prompt":"After update on task_sla: if has_breached changes to true, load the task incident and set escalation to 1, then update the task.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.has_breached.changesTo('true')) {\n    var task = new GlideRecord('incident');\n    if (task.get(current.getValue('task'))) {\n      task.setValue('escalation', '1');\n      task.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('true')","message":"Newly breached"},{"type":"includes","value":"has_breached","message":"has_breached"},{"type":"includes","value":"setValue('escalation', '1')","message":"Escalate"},{"type":"includes","value":"update()","message":"Update task"}]},{"id":"sla-04","title":"Queue sla.breached event","difficulty":"easy","kind":"business_rule","prompt":"When has_breached changes to true, gs.eventQueue sla.breached on current with parm1 = task number display.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.has_breached.changesTo('true')) {\n    gs.eventQueue('sla.breached', current, current.task.getDisplayValue(), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.eventQueue","message":"eventQueue"},{"type":"includes","value":"sla.breached","message":"Event name"},{"type":"includes","value":"has_breached","message":"Breach field"}]},{"id":"sla-05","title":"Pause SLA when on hold","difficulty":"intermediate","kind":"server","prompt":"This is a script snippet for a pause condition: return true if incident state is On Hold (3). Read current.state in a script that sets answer. Use answer = (current.getValue(\"state\") == \"3\");","starter":"// Write your ServiceNow script below\n","solution":"answer = current.getValue('state') == '3';","checks":[{"type":"includes","value":"answer","message":"Set answer"},{"type":"includes","value":"getValue('state')","message":"Read state"},{"type":"regex","value":{"__regex":true,"source":"==\\s*['\"]3['\"]","flags":""},"message":"On Hold is 3"}]},{"id":"sla-06","title":"List contract SLAs for P1","difficulty":"easy","kind":"server","prompt":"Query contract_sla (or sla) table contract_sla where duration is not empty and name contains P1. Use addQuery name CONTAINS P1. Log name.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('contract_sla');\ngr.addQuery('name', 'CONTAINS', 'P1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('name'));\n}","checks":[{"type":"includes","value":"new GlideRecord('contract_sla')","message":"SLA definitions"},{"type":"includes","value":"P1","message":"P1 SLAs"},{"type":"includes","value":"addQuery('name', 'CONTAINS', 'P1')","message":"CONTAINS query"}]},{"id":"sla-07","title":"Client: warn when SLA breached","difficulty":"easy","kind":"client","prompt":"onLoad: if g_form.getValue(\"made_sla\") is false, addErrorMessage that an SLA was missed.","starter":"function onLoad() {\n\n}\n","solution":"function onLoad() {\n  if (g_form.getValue('made_sla') == 'false') {\n    g_form.addErrorMessage('This task missed its SLA.');\n  }\n}","checks":[{"type":"includes","value":"g_form.getValue('made_sla')","message":"made_sla"},{"type":"includes","value":"g_form.addErrorMessage","message":"Error message"}]},{"id":"sla-08","title":"Percentage used threshold","difficulty":"intermediate","kind":"server","prompt":"Query task_sla where percentage >= 75 and stage is in_progress. Log task and percentage.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('task_sla');\ngr.addQuery('percentage', '>=', 75);\ngr.addQuery('stage', 'in_progress');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('task') + ' ' + gr.getValue('percentage'));\n}","checks":[{"type":"includes","value":"new GlideRecord('task_sla')","message":"task_sla"},{"type":"includes","value":"percentage","message":"percentage"},{"type":"includes","value":"'>='","message":"At least 75"}]},{"id":"sla-09","title":"Reset business elapsed after reopen","difficulty":"intermediate","kind":"business_rule","prompt":"On incident, when state changes from 6 (Resolved) to 2 (In Progress), log \"SLA_RESTART\" with gs.info. (Repair scripts would cancel task_sla; here just detect reopen.)","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesFrom('6') && current.getValue('state') == '2') {\n    gs.info('SLA_RESTART');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesFrom('6')","message":"Left Resolved"},{"type":"regex","value":{"__regex":true,"source":"state['\"]\\)\\s*==\\s*['\"]2['\"]|getValue\\('state'\\) == '2'","flags":""},"message":"Now In Progress"},{"type":"includes","value":"SLA_RESTART","message":"Log marker"}]},{"id":"sla-10","title":"GlideAjax remaining time","difficulty":"intermediate","kind":"script_include","prompt":"SlaAjax.remaining reads sysparm_task, finds first task_sla in_progress, returns planned_end_time getDisplayValue.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var SlaAjax = Class.create();\nSlaAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  remaining: function() {\n    var task = this.getParameter('sysparm_task');\n    var sla = new GlideRecord('task_sla');\n    sla.addQuery('task', task);\n    sla.addQuery('stage', 'in_progress');\n    sla.setLimit(1);\n    sla.query();\n    if (sla.next()) {\n      return sla.getDisplayValue('planned_end_time');\n    }\n    return '';\n  },\n  type: 'SlaAjax'\n});","checks":[{"type":"includes","value":"remaining","message":"Method"},{"type":"includes","value":"getParameter('sysparm_task')","message":"sysparm_task"},{"type":"includes","value":"new GlideRecord('task_sla')","message":"task_sla"},{"type":"includes","value":"planned_end_time","message":"End time"}]},{"id":"sla-11","title":"onChange: hold reason mandatory","difficulty":"easy","kind":"client","prompt":"onChange state: if newValue is 3, setMandatory hold_reason true.","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setMandatory('hold_reason', newValue == '3');\n}","checks":[{"type":"includes","value":"g_form.setMandatory('hold_reason'","message":"hold_reason"},{"type":"regex","value":{"__regex":true,"source":"newValue\\s*==\\s*['\"]3['\"]","flags":""},"message":"On Hold"}]},{"id":"sla-12","title":"Encoded query: breached today","difficulty":"intermediate","kind":"server","prompt":"task_sla addEncodedQuery has_breached=true^breached_onONToday. Log sys_id.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('task_sla');\ngr.addEncodedQuery('has_breached=true^breached_onONToday');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getUniqueValue());\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"has_breached=true","message":"Breached"},{"type":"includes","value":"breached_onONToday","message":"Today"}]},{"id":"sla-13","title":"Stop SLAs on cancel","difficulty":"intermediate","kind":"server","prompt":"For task incId, query task_sla stage in_progress, set stage to cancelled and update each (setWorkflow false).","starter":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\n","solution":"var incId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar sla = new GlideRecord('task_sla');\nsla.addQuery('task', incId);\nsla.addQuery('stage', 'in_progress');\nsla.query();\nwhile (sla.next()) {\n  sla.setValue('stage', 'cancelled');\n  sla.setWorkflow(false);\n  sla.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('task_sla')","message":"task_sla"},{"type":"includes","value":"setValue('stage', 'cancelled')","message":"Cancelled"},{"type":"includes","value":"setWorkflow(false)","message":"setWorkflow"}]},{"id":"sla-14","title":"Duration display with GlideDuration","difficulty":"intermediate","kind":"server","prompt":"Create GlideDuration from business_percentage is wrong. Instead: var d = new GlideDuration(current.duration); gs.info(d.getDayPart()); Assume you have ms in variable ms. Log getDurationValue().","starter":"var ms = 3600000;\n","solution":"var ms = 3600000;\nvar d = new GlideDuration(ms);\ngs.info(d.getDurationValue());","checks":[{"type":"includes","value":"new GlideDuration","message":"GlideDuration"},{"type":"includes","value":"getDurationValue()","message":"Display duration"}]},{"id":"sla-15","title":"Made SLA flag","difficulty":"easy","kind":"business_rule","prompt":"When incident state changes to 6 or 7, if any related task_sla has_breached true, set made_sla to false else true.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('6') || current.state.changesTo('7')) {\n    var sla = new GlideRecord('task_sla');\n    sla.addQuery('task', current.getUniqueValue());\n    sla.addQuery('has_breached', true);\n    sla.setLimit(1);\n    sla.query();\n    current.setValue('made_sla', sla.hasNext() ? false : true);\n  }\n})(current, previous);","checks":[{"type":"includes","value":"new GlideRecord('task_sla')","message":"task_sla"},{"type":"includes","value":"has_breached","message":"Breach check"},{"type":"includes","value":"made_sla","message":"Set made_sla"}]},{"id":"sla-16","title":"Schedule window using GlideDateTime","difficulty":"intermediate","kind":"server","prompt":"If now is after a breach GlideDateTime stored in breachAt (string UTC), gs.info(\"BREACHED\") else gs.info(\"OK\"). Use compareTo.","starter":"var breachAt = '2026-01-01 00:00:00';\n","solution":"var breachAt = '2026-01-01 00:00:00';\nvar now = new GlideDateTime();\nvar due = new GlideDateTime(breachAt);\nif (now.compareTo(due) > 0) {\n  gs.info('BREACHED');\n} else {\n  gs.info('OK');\n}","checks":[{"type":"includes","value":"GlideDateTime","message":"GlideDateTime"},{"type":"includes","value":"compareTo","message":"compareTo"},{"type":"includes","value":"BREACHED","message":"BREACHED"},{"type":"includes","value":"OK","message":"OK"}]}]},{"id":"major_incident","title":"Major Incident","blurb":"Major incident state, communication plans, workbench fields, and related incidents.","questions":[{"id":"mim-01","title":"Query accepted major incidents","difficulty":"easy","kind":"server","prompt":"Query incident where major_incident_state is accepted and active is true. Log number.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\ngr.addQuery('major_incident_state', 'accepted');\ngr.addQuery('active', true);\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"incident"},{"type":"includes","value":"addQuery('major_incident_state', 'accepted')","message":"Accepted MIM"},{"type":"includes","value":"query()","message":"Query"}]},{"id":"mim-02","title":"Propose a major incident","difficulty":"easy","kind":"server","prompt":"Load INC0000450 by number, set major_incident_state to proposed, update.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\nif (gr.get('number', 'INC0000450')) {\n  gr.setValue('major_incident_state', 'proposed');\n  gr.update();\n}","checks":[{"type":"includes","value":"INC0000450","message":"Incident number"},{"type":"includes","value":"setValue('major_incident_state', 'proposed')","message":"Proposed"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"mim-03","title":"Accept MIM sets impact/urgency","difficulty":"intermediate","kind":"business_rule","prompt":"When major_incident_state changes to accepted, set impact 1, urgency 1, and priority 1.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.major_incident_state.changesTo('accepted')) {\n    current.setValue('impact', '1');\n    current.setValue('urgency', '1');\n    current.setValue('priority', '1');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('accepted')","message":"Accepted"},{"type":"includes","value":"setValue('impact', '1')","message":"Impact 1"},{"type":"includes","value":"setValue('urgency', '1')","message":"Urgency 1"},{"type":"includes","value":"setValue('priority', '1')","message":"Priority 1"}]},{"id":"mim-04","title":"Reject proposal","difficulty":"easy","kind":"server","prompt":"For incId, set major_incident_state to rejected and add a work note \"Not a major incident\".","starter":"var incId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\n","solution":"var incId = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';\nvar gr = new GlideRecord('incident');\nif (gr.get(incId)) {\n  gr.setValue('major_incident_state', 'rejected');\n  gr.work_notes = 'Not a major incident';\n  gr.update();\n}","checks":[{"type":"includes","value":"rejected","message":"Rejected"},{"type":"includes","value":"Not a major incident","message":"Work note"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"mim-05","title":"Queue major incident communication event","difficulty":"easy","kind":"business_rule","prompt":"When major_incident_state changes to accepted, queue incident.major.accepted with parm1 = number.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.major_incident_state.changesTo('accepted')) {\n    gs.eventQueue('incident.major.accepted', current, current.getValue('number'), '');\n  }\n})(current, previous);","checks":[{"type":"includes","value":"gs.eventQueue","message":"eventQueue"},{"type":"includes","value":"incident.major.accepted","message":"Event name"}]},{"id":"mim-06","title":"Link child incidents to MIM","difficulty":"intermediate","kind":"server","prompt":"Query active incidents with matching cmdb_ci ciId excluding parentId. Set parent_incident to parentId and update with setWorkflow(false).","starter":"var parentId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar ciId = 'cccccccccccccccccccccccccccccccc';\n","solution":"var parentId = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';\nvar ciId = 'cccccccccccccccccccccccccccccccc';\nvar gr = new GlideRecord('incident');\ngr.addQuery('cmdb_ci', ciId);\ngr.addQuery('active', true);\ngr.addQuery('sys_id', '!=', parentId);\ngr.query();\nwhile (gr.next()) {\n  gr.setValue('parent_incident', parentId);\n  gr.setWorkflow(false);\n  gr.update();\n}","checks":[{"type":"includes","value":"new GlideRecord('incident')","message":"Incidents"},{"type":"includes","value":"cmdb_ci","message":"Same CI"},{"type":"includes","value":"parent_incident","message":"Set parent"},{"type":"includes","value":"setWorkflow(false)","message":"setWorkflow"}]},{"id":"mim-07","title":"Client: communication plan mandatory","difficulty":"easy","kind":"client","prompt":"onChange major_incident_state: if accepted, setMandatory description true (stand-in for communication plan).","starter":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading || newValue === '') {\n    return;\n  }\n\n}\n","solution":"function onChange(control, oldValue, newValue, isLoading, isTemplate) {\n  if (isLoading) {\n    return;\n  }\n  g_form.setMandatory('description', newValue == 'accepted');\n}","checks":[{"type":"includes","value":"g_form.setMandatory('description'","message":"Mandatory description"},{"type":"includes","value":"accepted","message":"Accepted"}]},{"id":"mim-08","title":"Count children of a MIM","difficulty":"intermediate","kind":"server","prompt":"GlideAggregate COUNT incident where parent_incident = parentId. Log count.","starter":"var parentId = 'dddddddddddddddddddddddddddddddd';\n","solution":"var parentId = 'dddddddddddddddddddddddddddddddd';\nvar ga = new GlideAggregate('incident');\nga.addQuery('parent_incident', parentId);\nga.addAggregate('COUNT');\nga.query();\nif (ga.next()) {\n  gs.info(ga.getAggregate('COUNT'));\n}","checks":[{"type":"includes","value":"new GlideAggregate('incident')","message":"Aggregate"},{"type":"includes","value":"parent_incident","message":"Children"},{"type":"includes","value":"addAggregate('COUNT')","message":"COUNT"}]},{"id":"mim-09","title":"onSubmit: require CAB note for MIM close","difficulty":"easy","kind":"client","prompt":"If major_incident_state is accepted and close_notes empty and state will be 7, block. Check g_form.getValue state == 7 and close_notes.","starter":"function onSubmit() {\n  return true;\n}\n","solution":"function onSubmit() {\n  if (g_form.getValue('major_incident_state') == 'accepted' && g_form.getValue('state') == '7' && !g_form.getValue('close_notes')) {\n    g_form.addErrorMessage('Close notes are required to close a major incident.');\n    return false;\n  }\n  return true;\n}","checks":[{"type":"includes","value":"major_incident_state","message":"MIM state"},{"type":"includes","value":"close_notes","message":"close_notes"},{"type":"includes","value":"return false","message":"Block"}]},{"id":"mim-10","title":"GlideAjax isMajor","difficulty":"intermediate","kind":"script_include","prompt":"MimAjax.isMajor reads sysparm_id, returns \"true\" if major_incident_state is accepted.","starter":"var MyAjax = Class.create();\nMyAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  type: 'MyAjax'\n});\n","solution":"var MimAjax = Class.create();\nMimAjax.prototype = Object.extend(new AbstractAjaxProcessor(), {\n  isMajor: function() {\n    var id = this.getParameter('sysparm_id');\n    var gr = new GlideRecord('incident');\n    if (gr.get(id) && gr.getValue('major_incident_state') == 'accepted') {\n      return 'true';\n    }\n    return 'false';\n  },\n  type: 'MimAjax'\n});","checks":[{"type":"includes","value":"isMajor","message":"Method"},{"type":"includes","value":"getParameter('sysparm_id')","message":"sysparm_id"},{"type":"includes","value":"accepted","message":"Accepted"}]},{"id":"mim-11","title":"Encoded query: proposed P1","difficulty":"easy","kind":"server","prompt":"addEncodedQuery major_incident_state=proposed^priority=1 on incident. Log numbers.","starter":"// Write your ServiceNow script below\n","solution":"var gr = new GlideRecord('incident');\ngr.addEncodedQuery('major_incident_state=proposed^priority=1');\ngr.query();\nwhile (gr.next()) {\n  gs.info(gr.getValue('number'));\n}","checks":[{"type":"includes","value":"addEncodedQuery","message":"Encoded query"},{"type":"includes","value":"major_incident_state=proposed","message":"Proposed"},{"type":"includes","value":"priority=1","message":"P1"}]},{"id":"mim-12","title":"Resolve children when MIM resolves","difficulty":"intermediate","kind":"business_rule","prompt":"When parent MIM state changes to 6, set child incidents (parent_incident = current) to state 6 with same close_notes, setWorkflow false.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.state.changesTo('6')) {\n    var child = new GlideRecord('incident');\n    child.addQuery('parent_incident', current.getUniqueValue());\n    child.addQuery('active', true);\n    child.query();\n    while (child.next()) {\n      child.setValue('state', '6');\n      child.setValue('close_notes', current.getValue('close_notes'));\n      child.setWorkflow(false);\n      child.update();\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"changesTo('6')","message":"Resolved"},{"type":"includes","value":"parent_incident","message":"Children"},{"type":"regex","value":{"__regex":true,"source":"setValue\\(\\s*['\"]state['\"]\\s*,\\s*['\"]6['\"]\\s*\\)","flags":""},"message":"Resolve children"},{"type":"includes","value":"setWorkflow(false)","message":"setWorkflow"}]},{"id":"mim-13","title":"Assign Major Incident Managers group","difficulty":"easy","kind":"business_rule","prompt":"On accept, set assignment_group to group named \"Major Incident Managers\".","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.major_incident_state.changesTo('accepted')) {\n    var g = new GlideRecord('sys_user_group');\n    if (g.get('name', 'Major Incident Managers')) {\n      current.setValue('assignment_group', g.getUniqueValue());\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"Major Incident Managers","message":"Group name"},{"type":"includes","value":"assignment_group","message":"Assign group"}]},{"id":"mim-14","title":"Timeline work note","difficulty":"easy","kind":"server","prompt":"Append work_notes \"Bridge opened\" to incident incId.","starter":"var incId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\n","solution":"var incId = 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';\nvar gr = new GlideRecord('incident');\nif (gr.get(incId)) {\n  gr.work_notes = 'Bridge opened';\n  gr.update();\n}","checks":[{"type":"includes","value":"Bridge opened","message":"Work note text"},{"type":"includes","value":"work_notes","message":"work_notes"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"mim-15","title":"Prevent cancel of accepted MIM","difficulty":"intermediate","kind":"business_rule","prompt":"If major_incident_state is accepted and state changes to 8 (Canceled), abort unless gs.hasRole(\"major_incident_manager\") or admin.","starter":"(function executeRule(current, previous /*null when async*/) {\n\n})(current, previous);\n","solution":"(function executeRule(current, previous /*null when async*/) {\n  if (current.getValue('major_incident_state') == 'accepted' && current.state.changesTo('8')) {\n    if (!gs.hasRole('major_incident_manager') && !gs.hasRole('admin')) {\n      gs.addErrorMessage('Only major incident managers can cancel an accepted MIM.');\n      current.setAbortAction(true);\n    }\n  }\n})(current, previous);","checks":[{"type":"includes","value":"accepted","message":"Accepted MIM"},{"type":"includes","value":"changesTo('8')","message":"Canceled"},{"type":"includes","value":"gs.hasRole('major_incident_manager')","message":"Role check"},{"type":"includes","value":"setAbortAction(true)","message":"Abort"}]},{"id":"mim-16","title":"onLoad: banner for MIM","difficulty":"easy","kind":"client","prompt":"If major_incident_state is accepted, addInfoMessage \"Major incident — follow the communication plan.\"","starter":"function onLoad() {\n\n}\n","solution":"function onLoad() {\n  if (g_form.getValue('major_incident_state') == 'accepted') {\n    g_form.addInfoMessage('Major incident — follow the communication plan.');\n  }\n}","checks":[{"type":"includes","value":"g_form.getValue('major_incident_state')","message":"Read MIM state"},{"type":"includes","value":"g_form.addInfoMessage","message":"Info banner"},{"type":"includes","value":"communication plan","message":"Message text"}]}]},{"id":"integrations","title":"Integrations","blurb":"Outbound REST/SOAP, Scripted REST APIs, import sets, MID Server, and JSON payloads.","questions":[{"id":"int-01","title":"Outbound REST GET","difficulty":"easy","kind":"integration","prompt":"Create sn_ws.RESTMessageV2, setHttpMethod GET, setEndpoint https://api.example.com/incidents, execute, log status code and body.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('GET');\nrm.setEndpoint('https://api.example.com/incidents');\nvar res = rm.execute();\ngs.info(res.getStatusCode());\ngs.info(res.getBody());","checks":[{"type":"includes","value":"sn_ws.RESTMessageV2","message":"RESTMessageV2"},{"type":"includes","value":"setHttpMethod('GET')","message":"GET"},{"type":"includes","value":"https://api.example.com/incidents","message":"Endpoint"},{"type":"includes","value":"execute()","message":"execute"},{"type":"includes","value":"getStatusCode()","message":"Status"},{"type":"includes","value":"getBody()","message":"Body"}]},{"id":"int-02","title":"Outbound REST JSON POST","difficulty":"intermediate","kind":"integration","prompt":"POST https://api.example.com/tickets with Content-Type application/json and body JSON.stringify({ short_description: \"VPN down\", urgency: \"1\" }). Log status.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('POST');\nrm.setEndpoint('https://api.example.com/tickets');\nrm.setRequestHeader('Content-Type', 'application/json');\nrm.setRequestBody(JSON.stringify({ short_description: 'VPN down', urgency: '1' }));\nvar res = rm.execute();\ngs.info(res.getStatusCode());","checks":[{"type":"includes","value":"setHttpMethod('POST')","message":"POST"},{"type":"includes","value":"setRequestHeader","message":"Header"},{"type":"includes","value":"application/json","message":"JSON content type"},{"type":"includes","value":"setRequestBody","message":"Body"},{"type":"includes","value":"JSON.stringify","message":"JSON.stringify"},{"type":"includes","value":"VPN down","message":"Payload"}]},{"id":"int-03","title":"Named REST message with parameters","difficulty":"intermediate","kind":"integration","prompt":"new sn_ws.RESTMessageV2(\"PagerDuty\", \"postEvent\"); setStringParameter(\"routing_key\", \"RKEY\"); setStringParameter(\"summary\", current.getValue(\"short_description\")); execute and if haveError log getErrorMessage.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2('PagerDuty', 'postEvent');\nrm.setStringParameter('routing_key', 'RKEY');\nrm.setStringParameter('summary', current.getValue('short_description'));\nvar res = rm.execute();\nif (res.haveError()) {\n  gs.error(res.getErrorMessage());\n}","checks":[{"type":"includes","value":"RESTMessageV2('PagerDuty', 'postEvent')","message":"Named message"},{"type":"includes","value":"setStringParameter('routing_key'","message":"routing_key"},{"type":"includes","value":"setStringParameter('summary'","message":"summary"},{"type":"includes","value":"haveError()","message":"Error check"},{"type":"includes","value":"getErrorMessage()","message":"Error text"}]},{"id":"int-04","title":"Async REST via MID Server","difficulty":"intermediate","kind":"integration","prompt":"RESTMessageV2 GET to http://internal.example.local/health, setMIDServer \"MID_PROD\", executeAsync, then waitForResponse(30) on the response.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('GET');\nrm.setEndpoint('http://internal.example.local/health');\nrm.setMIDServer('MID_PROD');\nvar res = rm.executeAsync();\nres.waitForResponse(30);\ngs.info(res.getStatusCode());","checks":[{"type":"includes","value":"setMIDServer('MID_PROD')","message":"MID Server"},{"type":"includes","value":"executeAsync()","message":"Async"},{"type":"includes","value":"waitForResponse(30)","message":"Wait 30s"},{"type":"includes","value":"internal.example.local","message":"Internal endpoint"}]},{"id":"int-05","title":"Scripted REST: get incident by number","difficulty":"intermediate","kind":"integration","prompt":"Scripted REST process function: read pathParams.number, GlideRecord incident get by number, if found setStatus 200 and setBody { number, short_description, state }; else setStatus 404 and setBody { error: \"not_found\" }.","starter":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n\n})(request, response);\n","solution":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n  var number = request.pathParams.number;\n  var gr = new GlideRecord('incident');\n  if (gr.get('number', number)) {\n    response.setStatus(200);\n    response.setBody({\n      number: gr.getValue('number'),\n      short_description: gr.getValue('short_description'),\n      state: gr.getValue('state')\n    });\n  } else {\n    response.setStatus(404);\n    response.setBody({ error: 'not_found' });\n  }\n})(request, response);","checks":[{"type":"includes","value":"request.pathParams","message":"Path params"},{"type":"includes","value":"new GlideRecord('incident')","message":"Load incident"},{"type":"includes","value":"response.setStatus(200)","message":"200"},{"type":"includes","value":"response.setStatus(404)","message":"404"},{"type":"includes","value":"not_found","message":"not_found"},{"type":"includes","value":"setBody","message":"Body"}]},{"id":"int-06","title":"Scripted REST: create incident","difficulty":"intermediate","kind":"integration","prompt":"Parse request.body.data (already an object) short_description and caller_id. Insert incident. setStatus 201, setBody { sys_id, number }.","starter":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n\n})(request, response);\n","solution":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n  var data = request.body.data;\n  var gr = new GlideRecord('incident');\n  gr.initialize();\n  gr.setValue('short_description', data.short_description);\n  gr.setValue('caller_id', data.caller_id);\n  var id = gr.insert();\n  response.setStatus(201);\n  response.setBody({ sys_id: id, number: gr.getValue('number') });\n})(request, response);","checks":[{"type":"includes","value":"request.body.data","message":"Read JSON body"},{"type":"includes","value":"initialize()","message":"New record"},{"type":"includes","value":"short_description","message":"short_description"},{"type":"includes","value":"insert()","message":"Insert"},{"type":"includes","value":"setStatus(201)","message":"201 Created"}]},{"id":"int-07","title":"Basic authentication on REST","difficulty":"easy","kind":"integration","prompt":"RESTMessageV2 POST to https://api.example.com/login, setBasicAuth user \"svc.itsm\" password gs.getProperty(\"integration.password\"), setRequestHeader Accept application/json.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('POST');\nrm.setEndpoint('https://api.example.com/login');\nrm.setBasicAuth('svc.itsm', gs.getProperty('integration.password'));\nrm.setRequestHeader('Accept', 'application/json');\nvar res = rm.execute();\ngs.info(res.getStatusCode());","checks":[{"type":"includes","value":"setBasicAuth","message":"Basic auth"},{"type":"includes","value":"svc.itsm","message":"Service user"},{"type":"includes","value":"gs.getProperty('integration.password')","message":"Password from property"},{"type":"includes","value":"application/json","message":"Accept JSON"}]},{"id":"int-08","title":"Parse inbound JSON and update incident","difficulty":"intermediate","kind":"integration","prompt":"var payload is a JSON string { \"number\": \"INC0001111\", \"state\": \"6\" }. JSON.parse it, load incident by number, set state, update.","starter":"var payload = '{\"number\":\"INC0001111\",\"state\":\"6\"}';\n","solution":"var payload = '{\"number\":\"INC0001111\",\"state\":\"6\"}';\nvar data = JSON.parse(payload);\nvar gr = new GlideRecord('incident');\nif (gr.get('number', data.number)) {\n  gr.setValue('state', data.state);\n  gr.update();\n}","checks":[{"type":"includes","value":"JSON.parse","message":"Parse JSON"},{"type":"includes","value":"new GlideRecord('incident')","message":"Incident"},{"type":"includes","value":"data.number","message":"Use parsed number"},{"type":"includes","value":"data.state","message":"Use parsed state"},{"type":"includes","value":"update()","message":"Update"}]},{"id":"int-09","title":"SOAP message execute","difficulty":"easy","kind":"integration","prompt":"new sn_ws.SOAPMessageV2(\"CMDBSync\", \"exportCI\"); setStringParameter(\"ci_name\", \"lxapp01\"); execute; log getBody.","starter":"// Write your ServiceNow script below\n","solution":"var soap = new sn_ws.SOAPMessageV2('CMDBSync', 'exportCI');\nsoap.setStringParameter('ci_name', 'lxapp01');\nvar res = soap.execute();\ngs.info(res.getBody());","checks":[{"type":"includes","value":"SOAPMessageV2","message":"SOAPMessageV2"},{"type":"includes","value":"CMDBSync","message":"Message name"},{"type":"includes","value":"setStringParameter('ci_name'","message":"Parameter"},{"type":"includes","value":"execute()","message":"execute"}]},{"id":"int-10","title":"Import set row insert","difficulty":"intermediate","kind":"integration","prompt":"Insert into import table u_incident_import: u_number INC9990001, u_short_description \"Interface error\". Then you would transform; here just insert and log sys_id.","starter":"// Write your ServiceNow script below\n","solution":"var row = new GlideRecord('u_incident_import');\nrow.initialize();\nrow.setValue('u_number', 'INC9990001');\nrow.setValue('u_short_description', 'Interface error');\nvar id = row.insert();\ngs.info(id);","checks":[{"type":"includes","value":"new GlideRecord('u_incident_import')","message":"Import table"},{"type":"includes","value":"INC9990001","message":"External number"},{"type":"includes","value":"Interface error","message":"Description"},{"type":"includes","value":"insert()","message":"Insert row"}]},{"id":"int-11","title":"Transform script: ignore empty","difficulty":"easy","kind":"integration","prompt":"In an onBefore transform script: if source.u_short_description is empty, set ignore = true.","starter":"// Write your ServiceNow script below\n","solution":"if (gs.nil(source.u_short_description)) {\n  ignore = true;\n}","checks":[{"type":"includes","value":"source.u_short_description","message":"Source field"},{"type":"includes","value":"ignore = true","message":"Ignore row"},{"type":"oneOf","values":["gs.nil","!source.u_short_description"],"message":"Empty check"}]},{"id":"int-12","title":"ECC queue probe log","difficulty":"intermediate","kind":"integration","prompt":"Query ecc_queue where agent is MID_PROD and topic is RESTProbe, orderByDesc sys_created_on, setLimit 10, log payload or name field—use getValue(\"queue\") and getValue(\"state\").","starter":"// Write your ServiceNow script below\n","solution":"var ecc = new GlideRecord('ecc_queue');\necc.addQuery('agent', 'MID_PROD');\necc.addQuery('topic', 'RESTProbe');\necc.orderByDesc('sys_created_on');\necc.setLimit(10);\necc.query();\nwhile (ecc.next()) {\n  gs.info(ecc.getValue('state'));\n}","checks":[{"type":"includes","value":"new GlideRecord('ecc_queue')","message":"ecc_queue"},{"type":"includes","value":"MID_PROD","message":"Agent"},{"type":"includes","value":"RESTProbe","message":"Topic"},{"type":"includes","value":"setLimit(10)","message":"Limit 10"}]},{"id":"int-13","title":"Query parameter and header","difficulty":"easy","kind":"integration","prompt":"REST GET https://api.example.com/search, setQueryParameter q \"email outage\", setRequestHeader Authorization \"Bearer \" + gs.getProperty(\"integration.token\").","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('GET');\nrm.setEndpoint('https://api.example.com/search');\nrm.setQueryParameter('q', 'email outage');\nrm.setRequestHeader('Authorization', 'Bearer ' + gs.getProperty('integration.token'));\nvar res = rm.execute();\ngs.info(res.getBody());","checks":[{"type":"includes","value":"setQueryParameter","message":"Query param"},{"type":"includes","value":"email outage","message":"Search text"},{"type":"includes","value":"Authorization","message":"Auth header"},{"type":"includes","value":"integration.token","message":"Token property"}]},{"id":"int-14","title":"Scripted REST query filter","difficulty":"intermediate","kind":"integration","prompt":"Read request.queryParams.priority (may be array—use + or String). Query incident addQuery priority that value, active true, setLimit 20. setBody an array of { number, priority }.","starter":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n\n})(request, response);\n","solution":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n  var priority = request.queryParams.priority;\n  if (priority && priority.join) {\n    priority = priority[0];\n  }\n  var result = [];\n  var gr = new GlideRecord('incident');\n  gr.addQuery('priority', priority);\n  gr.addQuery('active', true);\n  gr.setLimit(20);\n  gr.query();\n  while (gr.next()) {\n    result.push({ number: gr.getValue('number'), priority: gr.getValue('priority') });\n  }\n  response.setStatus(200);\n  response.setBody(result);\n})(request, response);","checks":[{"type":"includes","value":"request.queryParams","message":"Query params"},{"type":"includes","value":"priority","message":"Priority filter"},{"type":"includes","value":"setLimit(20)","message":"Limit 20"},{"type":"includes","value":"result.push","message":"Build array"},{"type":"includes","value":"setBody","message":"Response body"}]},{"id":"int-15","title":"Handle non-2xx REST status","difficulty":"intermediate","kind":"integration","prompt":"Execute a GET. If status \u003c 200 or >= 300, gs.error the body and do not parse JSON. Else JSON.parse the body and gs.info parsed.id.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2();\nrm.setHttpMethod('GET');\nrm.setEndpoint('https://api.example.com/item');\nvar res = rm.execute();\nvar status = res.getStatusCode();\nvar body = res.getBody();\nif (status \u003c 200 || status >= 300) {\n  gs.error(body);\n} else {\n  var parsed = JSON.parse(body);\n  gs.info(parsed.id);\n}","checks":[{"type":"includes","value":"getStatusCode()","message":"Status"},{"type":"includes","value":"gs.error","message":"Log errors"},{"type":"includes","value":"JSON.parse","message":"Parse success JSON"},{"type":"includes","value":"parsed.id","message":"Read id"}]},{"id":"int-16","title":"setStringParameterNoEscape for JSON fragments","difficulty":"easy","kind":"integration","prompt":"Named REST message Webhook / send: setStringParameterNoEscape(\"payload\", JSON.stringify({ number: current.getValue(\"number\") })); execute.","starter":"// Write your ServiceNow script below\n","solution":"var rm = new sn_ws.RESTMessageV2('Webhook', 'send');\nrm.setStringParameterNoEscape('payload', JSON.stringify({ number: current.getValue('number') }));\nvar res = rm.execute();\ngs.info(res.getStatusCode());","checks":[{"type":"includes","value":"setStringParameterNoEscape","message":"NoEscape"},{"type":"includes","value":"JSON.stringify","message":"JSON fragment"},{"type":"includes","value":"RESTMessageV2('Webhook', 'send')","message":"Named webhook"}]},{"id":"int-17","title":"Inbound header API key check","difficulty":"intermediate","kind":"integration","prompt":"In Scripted REST, if request.getHeader(\"X-API-Key\") does not equal gs.getProperty(\"inbound.api.key\"), setStatus 401 and setBody { error: \"unauthorized\" }, return. Else setStatus 204.","starter":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n\n})(request, response);\n","solution":"(function process(/*RESTAPIRequest*/ request, /*RESTAPIResponse*/ response) {\n  var key = request.getHeader('X-API-Key');\n  if (key != gs.getProperty('inbound.api.key')) {\n    response.setStatus(401);\n    response.setBody({ error: 'unauthorized' });\n    return;\n  }\n  response.setStatus(204);\n})(request, response);","checks":[{"type":"includes","value":"getHeader('X-API-Key')","message":"API key header"},{"type":"includes","value":"gs.getProperty('inbound.api.key')","message":"Stored key"},{"type":"includes","value":"setStatus(401)","message":"401"},{"type":"includes","value":"unauthorized","message":"unauthorized"},{"type":"includes","value":"setStatus(204)","message":"204"}]}]}];

      tables: ["incident","problem","problem_task","change_request","change_task","sc_request","sc_req_item","sc_task","sc_cat_item","kb_knowledge","kb_feedback","cmdb_ci","cmdb_rel_ci","alm_asset","alm_hardware","task_sla","contract_sla","sys_user","sys_user_group","sys_user_grmember","sysapproval_approver","incident_task","em_alert","sys_attachment","sys_email","sys_import_set","sys_import_set_row","ecc_queue","sys_rest_message","sys_web_service"]

  <script>
/* global TOPICS, SNOW_API */
(function () {
  const STORAGE_KEY = 'snow-itsm-lab-v1';

  const COMMENT_BLOCK = /\/\*[\s\S]*?\*\//g;
  const COMMENT_LINE = /(^|[^:\\])\/\/.*$/gm;

  function stripComments(code) {
    return String(code ?? '')
      .replace(COMMENT_BLOCK, ' ')
      .replace(COMMENT_LINE, '$1');
  }

  function asRegex(value, flags) {
    if (value instanceof RegExp) return value;
    return new RegExp(value, flags || '');
  }

  function runCheck(source, stripped, check) {
    const haystack = check.raw ? source : stripped;
    const type = check.type || 'includes';
    if (type === 'includes') {
      const ok = haystack.includes(check.value);
      return { ok, message: check.message, detail: ok ? 'found' : 'missing “' + check.value + '”' };
    }
    if (type === 'includesi') {
      const ok = haystack.toLowerCase().includes(String(check.value).toLowerCase());
      return { ok, message: check.message, detail: ok ? 'found' : 'missing “' + check.value + '”' };
    }
    if (type === 'excludes') {
      const ok = !haystack.includes(check.value);
      return { ok, message: check.message, detail: ok ? 'ok' : 'must not include “' + check.value + '”' };
    }
    if (type === 'regex') {
      const pattern = check.value && check.value.__regex
        ? new RegExp(check.value.source, check.value.flags || '')
        : asRegex(check.value, check.flags);
      const ok = pattern.test(haystack);
      return { ok, message: check.message, detail: ok ? 'matched' : 'pattern not found' };
    }
    if (type === 'oneOf') {
      const ok = (check.values || []).some(function (value) { return haystack.includes(value); });
      return { ok, message: check.message, detail: ok ? 'found' : 'need one of: ' + (check.values || []).join(', ') };
    }
    if (type === 'allOf') {
      const missing = (check.values || []).filter(function (value) { return !haystack.includes(value); });
      return { ok: missing.length === 0, message: check.message, detail: missing.length ? 'missing ' + missing.join(', ') : 'found' };
    }
    if (type === 'order') {
      const values = check.values || [];
      var from = 0;
      for (var i = 0; i < values.length; i += 1) {
        var idx = haystack.indexOf(values[i], from);
        if (idx === -1) return { ok: false, message: check.message, detail: 'missing “' + values[i] + '” in order' };
        from = idx + values[i].length;
      }
      return { ok: true, message: check.message, detail: 'order ok' };
    }
    if (type === 'minCount') {
      var needle = check.value;
      var count = 0;
      var pos = 0;
      while (needle && (pos = haystack.indexOf(needle, pos)) !== -1) {
        count += 1;
        pos += needle.length;
      }
      var okc = count >= (check.count || 1);
      return { ok: okc, message: check.message, detail: okc ? count + ' occurrence(s)' : 'need at least ' + check.count + ' of “' + needle + '”' };
    }
    return { ok: false, message: check.message || 'Unknown check', detail: type };
  }

  function grade(code, checks) {
    var started = performance.now();
    var source = String(code ?? '');
    var stripped = stripComments(source);
    var results = (checks || []).map(function (check) { return runCheck(source, stripped, check); });
    return {
      passed: results.length > 0 && results.every(function (item) { return item.ok; }),
      results: results,
      durationMs: Math.max(0, performance.now() - started),
    };
  }

  function hydrateChecks(checks) {
    return (checks || []).map(function (check) {
      if (check && check.value && check.value.__regex) {
        return Object.assign({}, check, { value: new RegExp(check.value.source, check.value.flags || '') });
      }
      return check;
    });
  }

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"answers":{},"results":{}}');
    } catch (e) {
      return { answers: {}, results: {} };
    }
  }

  function saveProgress(progress) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }

  function escapeHtml(value) {
    return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function getTopic(id) {
    return TOPICS.find(function (topic) { return topic.id === id; }) || TOPICS[0];
  }

  var state = {
    topicId: TOPICS[0].id,
    questionId: TOPICS[0].questions[0].id,
    progress: loadProgress(),
    solutionOpen: false,
    acIndex: 0,
    acItems: [],
  };

  function currentTopic() {
    return getTopic(state.topicId);
  }

  function currentQuestion() {
    var topic = currentTopic();
    return topic.questions.find(function (item) { return item.id === state.questionId; }) || topic.questions[0];
  }

  function passedCount(topic) {
    return topic.questions.filter(function (item) { return state.progress.results[item.id] && state.progress.results[item.id].passed; }).length;
  }

  var textarea = document.getElementById('code');
  var acMenu = document.getElementById('ac-menu');

  function persistCode() {
    state.progress.answers[currentQuestion().id] = textarea.value;
    saveProgress(state.progress);
  }

  function snippetInsert(text) {
    return String(text || '').replace(/\$\{\d+:([^}]+)\}/g, '$1').replace(/\$\d+/g, '');
  }

  function completionsFor(prefix, objectName) {
    var items = [];
    var p = (prefix || '').toLowerCase();
    if (objectName && SNOW_API.namespaces[objectName]) {
      (SNOW_API.namespaces[objectName].methods || []).forEach(function (method) {
        if (!p || method.name.toLowerCase().indexOf(p) === 0) {
          items.push({ label: method.name, detail: method.signature, insert: snippetInsert(method.insertText || method.name + '()') });
        }
      });
    }
    if (objectName && SNOW_API.classes[objectName] && SNOW_API.classes[objectName].methods) {
      SNOW_API.classes[objectName].methods.forEach(function (method) {
        if (!p || method.name.toLowerCase().indexOf(p) === 0) {
          items.push({ label: method.name, detail: method.signature, insert: snippetInsert(method.insertText || method.name + '()') });
        }
      });
    }
    if (items.length) return items.slice(0, 20);
    Object.keys(SNOW_API.classes).forEach(function (name) {
      if (!p || name.toLowerCase().indexOf(p) === 0) {
        var cls = SNOW_API.classes[name];
        items.push({ label: name, detail: cls.detail, insert: snippetInsert(cls.construct || name) });
      }
    });
    SNOW_API.globals.forEach(function (g) {
      if (!p || g.name.toLowerCase().indexOf(p) === 0) {
        items.push({ label: g.name, detail: g.detail, insert: g.name });
      }
    });
    SNOW_API.snippets.forEach(function (snip) {
      if (!p || snip.label.toLowerCase().indexOf(p) !== -1) {
        items.push({ label: snip.label, detail: 'snippet', insert: snippetInsert(snip.insertText) });
      }
    });
    SNOW_API.tables.forEach(function (table) {
      if (p && table.toLowerCase().indexOf(p) === 0) {
        items.push({ label: table, detail: 'table', insert: table });
      }
    });
    return items.slice(0, 20);
  }

  function tokenBeforeCursor() {
    var pos = textarea.selectionStart;
    var before = textarea.value.slice(0, pos);
    var member = before.match(/([A-Za-z_$][\w$]*)\.([A-Za-z_$][\w$]*)$/);
    if (member) return { objectName: member[1], prefix: member[2], start: pos - member[2].length };
    var word = before.match(/[A-Za-z_$][\w$]*$/);
    if (word) return { objectName: '', prefix: word[0], start: pos - word[0].length };
    return { objectName: '', prefix: '', start: pos };
  }

  function hideAc() {
    acMenu.hidden = true;
    state.acItems = [];
  }

  function showAc() {
    var token = tokenBeforeCursor();
    if (!token.prefix && !token.objectName) {
      hideAc();
      return;
    }
    state.acItems = completionsFor(token.prefix, token.objectName);
    state.acIndex = 0;
    if (!state.acItems.length) {
      hideAc();
      return;
    }
    acMenu.innerHTML = state.acItems.map(function (item, i) {
      return '<button type="button" class="ac-item' + (i === 0 ? ' active' : '') + '" data-i="' + i + '"><strong>' + escapeHtml(item.label) + '</strong><span>' + escapeHtml(item.detail || '') + '</span></button>';
    }).join('');
    acMenu.hidden = false;
    acMenu.querySelectorAll('.ac-item').forEach(function (btn) {
      btn.addEventListener('mousedown', function (ev) {
        ev.preventDefault();
        acceptAc(Number(btn.getAttribute('data-i')));
      });
    });
  }

  function acceptAc(index) {
    var item = state.acItems[index];
    if (!item) return;
    var token = tokenBeforeCursor();
    var value = textarea.value;
    var pos = textarea.selectionStart;
    textarea.value = value.slice(0, token.start) + item.insert + value.slice(pos);
    var caret = token.start + item.insert.length;
    textarea.selectionStart = textarea.selectionEnd = caret;
    hideAc();
    persistCode();
    textarea.focus();
  }

  function renderSidebar() {
    var nav = document.getElementById('topic-nav');
    nav.innerHTML = TOPICS.map(function (topic) {
      var done = passedCount(topic);
      var active = topic.id === state.topicId ? 'active' : '';
      return '<button class="topic ' + active + '" data-topic="' + topic.id + '"><span class="topic-title">' + escapeHtml(topic.title) + '</span><span class="topic-count">' + done + '/' + topic.questions.length + '</span></button>';
    }).join('');
    nav.querySelectorAll('.topic').forEach(function (btn) {
      btn.addEventListener('click', function () {
        persistCode();
        state.topicId = btn.getAttribute('data-topic');
        state.questionId = getTopic(state.topicId).questions[0].id;
        state.solutionOpen = false;
        render();
      });
    });
  }

  function renderQuestionList() {
    var topic = currentTopic();
    var list = document.getElementById('question-list');
    list.innerHTML = topic.questions.map(function (item, index) {
      var result = state.progress.results[item.id];
      var cls = item.id === state.questionId ? 'active' : '';
      if (result && result.passed) cls += ' passed';
      return '<button class="q-item ' + cls + '" data-qid="' + item.id + '"><span class="q-idx">' + String(index + 1).padStart(2, '0') + '</span><span class="q-name">' + escapeHtml(item.title) + '</span><span class="q-diff">' + escapeHtml(item.difficulty) + '</span></button>';
    }).join('');
    list.querySelectorAll('.q-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        persistCode();
        state.questionId = btn.getAttribute('data-qid');
        state.solutionOpen = false;
        render();
      });
    });
  }

  function renderGrade(result) {
    var box = document.getElementById('grade-results');
    if (!result) {
      box.innerHTML = '<p class="muted">Press Grade (Ctrl/Cmd+Enter) for instant feedback. Type a ServiceNow API name for autocomplete.</p>';
      box.className = 'grade-box';
      return;
    }
    box.className = 'grade-box ' + (result.passed ? 'ok' : 'fail');
    var rows = result.results.map(function (item) {
      return '<li class="' + (item.ok ? 'ok' : 'fail') + '"><span>' + (item.ok ? 'Pass' : 'Fail') + '</span>' + escapeHtml(item.message) + (item.ok ? '' : ' — ' + escapeHtml(item.detail)) + '</li>';
    }).join('');
    box.innerHTML = '<div class="grade-head">' + (result.passed ? 'Passed' : 'Not yet') + ' · ' + result.durationMs.toFixed(1) + ' ms</div><ul>' + rows + '</ul>';
  }

  function render() {
    var question = currentQuestion();
    var topic = currentTopic();
    renderSidebar();
    renderQuestionList();
    document.getElementById('crumb').textContent = topic.title + ' · ' + String(question.kind || 'server').replace(/_/g, ' ');
    document.getElementById('q-title').textContent = question.title;
    document.getElementById('q-prompt').textContent = question.prompt;
    var hint = document.getElementById('hint');
    hint.textContent = question.hint || '';
    hint.hidden = !question.hint;
    document.getElementById('solution-pane').hidden = !state.solutionOpen;
    document.getElementById('solution-code').textContent = question.solution;
    document.getElementById('reveal-btn').textContent = state.solutionOpen ? 'Hide solution' : 'Show solution';
    textarea.value = state.progress.answers[question.id] != null ? state.progress.answers[question.id] : question.starter;
    var last = state.progress.results[question.id];
    renderGrade(last && last.grade ? last.grade : null);
    document.getElementById('blurb').textContent = topic.blurb;
    document.getElementById('progress-label').textContent = passedCount(topic) + ' of ' + topic.questions.length + ' passed in this topic';
  }

  function runGrade() {
    persistCode();
    var question = currentQuestion();
    var result = grade(textarea.value, hydrateChecks(question.checks));
    var prev = state.progress.results[question.id] || {};
    state.progress.results[question.id] = { passed: result.passed, grade: result, revealed: prev.revealed };
    saveProgress(state.progress);
    renderSidebar();
    renderQuestionList();
    renderGrade(result);
  }

  document.getElementById('grade-btn').addEventListener('click', runGrade);
  document.getElementById('reveal-btn').addEventListener('click', function () {
    state.solutionOpen = !state.solutionOpen;
    var prev = state.progress.results[currentQuestion().id] || {};
    state.progress.results[currentQuestion().id] = Object.assign({}, prev, { revealed: true });
    saveProgress(state.progress);
    render();
  });
  document.getElementById('apply-btn').addEventListener('click', function () {
    textarea.value = currentQuestion().solution;
    persistCode();
  });
  document.getElementById('reset-btn').addEventListener('click', function () {
    delete state.progress.answers[currentQuestion().id];
    saveProgress(state.progress);
    textarea.value = currentQuestion().starter;
  });

  textarea.addEventListener('input', function () {
    persistCode();
    showAc();
  });
  textarea.addEventListener('keydown', function (ev) {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
      ev.preventDefault();
      hideAc();
      runGrade();
      return;
    }
    if (acMenu.hidden) return;
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      state.acIndex = (state.acIndex + 1) % state.acItems.length;
      acMenu.querySelectorAll('.ac-item').forEach(function (el, i) { el.classList.toggle('active', i === state.acIndex); });
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      state.acIndex = (state.acIndex - 1 + state.acItems.length) % state.acItems.length;
      acMenu.querySelectorAll('.ac-item').forEach(function (el, i) { el.classList.toggle('active', i === state.acIndex); });
    } else if (ev.key === 'Tab' || ev.key === 'Enter') {
      ev.preventDefault();
      acceptAc(state.acIndex);
    } else if (ev.key === 'Escape') {
      hideAc();
    }
  });
  textarea.addEventListener('blur', function () {
    setTimeout(hideAc, 150);
  });

  render();
})();

  </script>
